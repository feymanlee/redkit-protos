    - file_option: go_package
      path: support/governance/v1
      value: github.com/feymanlee/redkit-protos/gen/go/support/governance/v1;governancepb
    - file_option: go_package
      path: user/administration/v1
      value: github.com/feymanlee/redkit-protos/gen/go/user/administration/v1;useradministrationpb
