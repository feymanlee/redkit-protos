      path: gamoji/user/v1
      value: github.com/feymanlee/redkit-protos/gen/go/gamoji/user/v1;gamojiuserpb

plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=import
      - module=github.com/feymanlee/redkit-protos/gen/go
  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=import
      - module=github.com/feymanlee/redkit-protos/gen/go
  - local: protoc-gen-go-http
    out: gen/go
    opt:
      - paths=import
      - module=github.com/feymanlee/redkit-protos/gen/go
  - local: protoc-gen-go-errors
    out: gen/go
    opt:
      - paths=import
      - module=github.com/feymanlee/redkit-protos/gen/go
  - local: protoc-gen-validate
    out: gen/go
    opt:
      - paths=import
      - module=github.com/feymanlee/redkit-protos/gen/go
      - lang=go
