version: v2

# Go SDK 生成模板。module 前缀与 go.mod 一致：github.com/feymanlee/redkit-protos

clean: true

managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/envoyproxy/protoc-gen-validate
    - module: buf.build/kratos/apis
    - module: buf.build/gnostic/gnostic
    - module: buf.build/gogo/protobuf
  override:
    - file_option: go_package_prefix
      value: github.com/feymanlee/redkit-protos/gen/go
    - file_option: go_package
      path: admin/platform/v1
      value: github.com/feymanlee/redkit-protos/gen/go/admin/platform/v1;adminplatformpb
    - file_option: go_package
      path: admin/core/v1
      value: github.com/feymanlee/redkit-protos/gen/go/admin/core/v1;admincorepb
    - file_option: go_package
      path: admin/ops/v1
      value: github.com/feymanlee/redkit-protos/gen/go/admin/ops/v1;adminopspb
    - file_option: go_package
      path: admin/gift/v1
      value: github.com/feymanlee/redkit-protos/gen/go/admin/gift/v1;admingiftpb
    - file_option: go_package
      path: admin/payment/v1
      value: github.com/feymanlee/redkit-protos/gen/go/admin/payment/v1;adminpaymentpb
    - file_option: go_package
      path: admin/support/v1
      value: github.com/feymanlee/redkit-protos/gen/go/admin/support/v1;adminsupportpb
    - file_option: go_package
      path: admin/user/v1
      value: github.com/feymanlee/redkit-protos/gen/go/admin/user/v1;adminuserpb
    - file_option: go_package
      path: admin/wallet/v1
      value: github.com/feymanlee/redkit-protos/gen/go/admin/wallet/v1;adminwalletpb
    - file_option: go_package
      path: common/v1
      value: github.com/feymanlee/redkit-protos/gen/go/common/v1;commonpb
    - file_option: go_package
      path: common/file/v1
      value: github.com/feymanlee/redkit-protos/gen/go/common/file/v1;filepb
    - file_option: go_package
      path: common/pagination/v1
      value: github.com/feymanlee/redkit-protos/gen/go/common/pagination/v1;paginationpb
    - file_option: go_package
      path: core/application/v1
      value: github.com/feymanlee/redkit-protos/gen/go/core/application/v1;applicationpb
    - file_option: go_package
      path: core/audit/v1
      value: github.com/feymanlee/redkit-protos/gen/go/core/audit/v1;auditpb
    - file_option: go_package
      path: core/authentication/v1
      value: github.com/feymanlee/redkit-protos/gen/go/core/authentication/v1;authenticationpb
    - file_option: go_package
      path: core/operator/v1
      value: github.com/feymanlee/redkit-protos/gen/go/core/operator/v1;operatorpb
    - file_option: go_package
      path: core/permission/v1
      value: github.com/feymanlee/redkit-protos/gen/go/core/permission/v1;permissionpb
    - file_option: go_package
      path: gift/v1
      value: github.com/feymanlee/redkit-protos/gen/go/gift/v1;giftpb
    - file_option: go_package
      path: payment/v1
      value: github.com/feymanlee/redkit-protos/gen/go/payment/v1;paymentpb
    - file_option: go_package
      path: support/messaging/v1
      value: github.com/feymanlee/redkit-protos/gen/go/support/messaging/v1;messagingpb
    - file_option: go_package
