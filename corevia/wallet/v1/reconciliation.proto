syntax = "proto3";

package wallet.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "wallet/v1/adjustment.proto";
import "wallet/v1/refund.proto";
import "wallet/v1/risk.proto";
import "wallet/v1/wallet_types.proto";

// Investigation and verification lifecycle for one immutable difference.
enum WalletReconciliationInvestigationStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  WALLET_RECONCILIATION_INVESTIGATION_STATUS_UNSPECIFIED = 0;
  // 当前处于开放状态，可继续处理。
  OPEN = 1;
  // 正在调查事实与证据，尚未形成处置结论。
  INVESTIGATING = 2;
  // 异常或争议已经处置完成。
  RESOLVED = 3;
  // 校验已经通过。
  VERIFIED = 4;
}

// 钱包对账批次。
message WalletReconciliationBatch {
  // 批次 ID。
  optional uint64 id = 1;
  // 对账币种。
  optional WalletCurrency currency = 3;
  // 批次号。
  optional string batch_no = 4;
  // 状态。
  optional string status = 5;
  // 检查钱包数。
  optional uint64 checked_wallets = 6;
  // 差异数量。
  optional uint64 diff_count = 7;
  // Stable Admin operation identity used to make governed reconciliation idempotent.
  optional string operation_no = 8;
  // 批次开始时待处理的钱包总数。
  optional uint64 total_count = 9;
  // 已完成核对的钱包数。
  optional uint64 processed_count = 10;
  // 发现的差异数量。
  optional uint64 difference_count = 11;
  // 已执行次数，包含失败后重试。
  optional uint32 attempt_count = 12;
  // 安全失败类别，不包含底层错误文本。
  optional string failure_category = 13;
  // 开始时间。
  optional google.protobuf.Timestamp started_at = 14;
  // 完成或最近失败时间。
  optional google.protobuf.Timestamp finished_at = 15;
  // 下次允许 worker 自动领取的时间。
  optional google.protobuf.Timestamp next_attempt_at = 16;
  // 最近一次人工重试的稳定操作号。
  optional string last_retry_operation_no = 17;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// 钱包对账明细。
message WalletReconciliationItem {
  // 明细 ID。
  optional uint64 id = 1;
  // 批次 ID。
  optional uint64 batch_id = 2;
  // 用户 ID。
  optional uint64 user_id = 4;
  // 币种。
  optional WalletCurrency currency = 5;
  // 钱包余额。
  optional int64 wallet_balance = 6;
  // 流水净额。
  optional int64 ledger_balance = 7;
  // 差异金额。
  optional int64 diff_amount = 8;
  // 差异类型。
  optional string diff_type = 9;
  // 调查记录；不修改发现时余额。
  optional string investigation = 10;
  // 人工结论。
  optional string conclusion = 11;
  // 记录结论的 Operator。
  optional uint32 resolved_by = 12;
  // Adjustment 或技术修复引用。
  optional string repair_reference = 13;
  // 稳定处置操作号。
  optional string resolution_operation_no = 14;
  // 处置时间。
  optional google.protobuf.Timestamp resolved_at = 15;
  // 调查与后续核验状态。
  optional WalletReconciliationInvestigationStatus investigation_status = 16;
  // 最近追加调查记录的 Operator。
  optional uint32 investigated_by = 17;
  // 最近追加调查记录的时间。
  optional google.protobuf.Timestamp investigated_at = 18;
  // 证明差异已消失的后续批次 ID。
  optional uint64 verified_batch_id = 19;
  // 后续批次证明一致的时间。
  optional google.protobuf.Timestamp verified_at = 20;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
}

// 钱包审计事件。
message WalletEvent {
  // 事件 ID。
  optional uint64 id = 1;
  // 用户 ID。
  optional uint64 user_id = 3;
  // 事件类型。
  optional string event_type = 4;
  // 事件等级。
  optional string level = 5;
  // 业务类型。
  optional string biz_type = 6;
  // 业务关联 ID。
  optional string biz_id = 7;
  // 消息。
  optional string message = 8;
  // 扩展元数据。
  optional string metadata = 9;
  // Stable operation identity shared with the Admin audit chain.
  optional string operation_no = 10;
  // Transport request identity shared with Core API Audit.
  optional string request_id = 11;
  // Stable resource kind affected by the operation.
  optional string resource_type = 12;
  // Stable resource identity affected by the operation.
  optional string resource_id = 13;
  // Resource state before the operation.
  optional string before_state = 14;
  // Resource state after the operation.
  optional string after_state = 15;
  // Operator who requested the change.
  optional uint32 requester_id = 16;
  // Operator who approved or executed a reviewed change.
  optional uint32 approver_id = 17;
  // Human-entered governance reason.
  optional string reason = 18;
  // Stable safe operation result.
  optional string result = 19;
  // Stable safe failure category; never stores raw errors.
  optional string failure_category = 20;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
}
// 创建对账批次请求。
message CreateWalletReconciliationBatchRequest {
  // 对账币种。
  optional WalletCurrency currency = 2;
  // Trusted governance identity for Admin execution.
  optional WalletGovernanceIdentity governance = 3;
}

// 重试失败的对账批次。
message RetryWalletReconciliationBatchRequest {
  // batch_id 标识关联的 Batch。
  uint64 batch_id = 2 [(google.api.field_behavior) = REQUIRED];
  // governance 承载 RetryWalletReconciliationBatch 关联的 WalletGovernanceIdentity。
  optional WalletGovernanceIdentity governance = 3;
}

// 为对账差异追加人工调查与处置引用。
message ResolveWalletReconciliationItemRequest {
  // item_id 标识关联的 Item。
  uint64 item_id = 2 [(google.api.field_behavior) = REQUIRED];
  // investigation 记录人工调查过程与结论摘要，供审计复核。
  optional string investigation = 3;
  // conclusion 记录 ResolveWalletReconciliationItem 对应审核或执行流程的结论。
  optional string conclusion = 4;
  // repair_reference 记录外部系统或关联流程提供的引用标识。
  optional string repair_reference = 5;
  // governance 承载 ResolveWalletReconciliationItem 关联的 WalletGovernanceIdentity。
  optional WalletGovernanceIdentity governance = 6;
  // investigation_status 表示 ResolveWalletReconciliationItem 当前可观察的生命周期状态。
  WalletReconciliationInvestigationStatus investigation_status = 7 [(google.api.field_behavior) = REQUIRED];
}

// 人工调账列表响应。
message ListWalletFreezeResponse {
  // 列表项。
  repeated WalletFreeze items = 1;
  // 总数。
  uint64 total = 2;
}

// 人工调账列表响应。
message ListWalletAdjustmentResponse {
  // 列表项。
  repeated WalletAdjustment items = 1;
  // 总数。
  uint64 total = 2;
}

// 对账批次列表响应。
message ListWalletReconciliationBatchResponse {
  // 列表项。
  repeated WalletReconciliationBatch items = 1;
  // 总数。
  uint64 total = 2;
}

// 对账明细列表响应。
message ListWalletReconciliationItemResponse {
  // 列表项。
  repeated WalletReconciliationItem items = 1;
  // 总数。
  uint64 total = 2;
}

// 钱包事件列表响应。
message ListWalletEventResponse {
  // 列表项。
  repeated WalletEvent items = 1;
  // 总数。
  uint64 total = 2;
}

// 用户欠款列表响应。
message ListWalletUserDebtResponse {
  // 列表项。
  repeated WalletUserDebt items = 1;
  // 总数。
  uint64 total = 2;
}
