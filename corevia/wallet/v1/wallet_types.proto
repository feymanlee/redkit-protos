syntax = "proto3";

package wallet.v1;

import "common/v1/common.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// 钱包虚拟币币种。
enum WalletCurrency {
  // 未指定；请求中表示使用默认规则，响应中表示未知。
  WALLET_CURRENCY_UNSPECIFIED = 0;
  // 充值币。
  WALLET_CURRENCY_DIAMOND = 1;
  // 赠币。
  WALLET_CURRENCY_COIN = 2;
  // 混合币种，用于一条流水或冻结同时包含充值币和赠币。
  WALLET_CURRENCY_MIXED = 3;
}

// WalletFreezeSource distinguishes Admin-created holds from business reservations.
enum WalletFreezeSource {
  // 未提供有效取值；调用方不得据此推断业务状态。
  WALLET_FREEZE_SOURCE_UNSPECIFIED = 0;
  // WALLET_FREEZE_SOURCE_BUSINESS 表示业务事实或请求来自 BUSINESS 来源。
  WALLET_FREEZE_SOURCE_BUSINESS = 1;
  // WALLET_FREEZE_SOURCE_MANUAL 表示业务事实或请求来自 MANUAL 来源。
  WALLET_FREEZE_SOURCE_MANUAL = 2;
}

// WalletFreezeReleasePolicy controls only Manual Wallet Freeze lifecycle.
enum WalletFreezeReleasePolicy {
  // 未提供有效取值；调用方不得据此推断业务状态。
  WALLET_FREEZE_RELEASE_POLICY_UNSPECIFIED = 0;
  // WALLET_FREEZE_RELEASE_POLICY_TEMPORARY 选择 TEMPORARY 作为对应资源的处理策略。
  WALLET_FREEZE_RELEASE_POLICY_TEMPORARY = 1;
  // WALLET_FREEZE_RELEASE_POLICY_UNTIL_RELEASED 选择 UNTIL_RELEASED 作为对应资源的处理策略。
  WALLET_FREEZE_RELEASE_POLICY_UNTIL_RELEASED = 2;
}

// WalletGovernanceIdentity carries trusted operator and request correlation for an Admin write.
message WalletGovernanceIdentity {
  // Authenticated Operator injected by Admin.
  uint32 operator_id = 1;
  // Human-entered reason for the operation.
  string reason = 2;
  // Stable business operation identity; defaults to the trusted Request ID.
  string operation_no = 3;
  // Trusted request correlation identity generated by transport middleware.
  string request_id = 4;
}

// 钱包信息。
message Wallet {
  // 钱包 ID。
  optional uint64 id = 1;
  // 应用 ID。
  optional uint32 app_id = 2;
  // 应用名称。
  optional string app_name = 3;
  // 用户 ID。
  optional uint64 user_id = 4;
  // 币种；未指定时返回用户聚合余额。
  optional WalletCurrency currency = 5;
  // 总余额，最小单位。
  optional int64 balance = 6 [(gnostic.openapi.v3.property) = {description: "虚拟币总余额，最小单位"}];
  // 总冻结余额。
  optional int64 frozen_balance = 7;
  // 总可用余额。
  optional int64 available_balance = 8;
  // 充值币余额。
  optional int64 diamond = 9;
  // 赠币余额。
  optional int64 coin = 10;
  // 冻结充值币。
  optional int64 frozen_diamond = 11;
  // 冻结赠币。
  optional int64 frozen_coin = 12;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}
// 钱包冻结记录。
message WalletFreeze {
  // 冻结 ID。
  optional uint64 id = 1;
  // 应用 ID。
  optional uint32 app_id = 2;
  // 用户 ID。
  optional uint64 user_id = 3;
  // 钱包 ID。
  optional uint64 wallet_id = 4;
  // 冻结单号。
  optional string freeze_no = 5;
  // 冻结金额。
  optional int64 amount = 6;
  // 冻结币种。
  optional WalletCurrency currency = 7;
  // 状态。
  optional string status = 8;
  // 业务类型。
  optional string biz_type = 9;
  // 业务关联 ID。
  optional string biz_id = 10;
  // 幂等键。
  optional string idempotency_key = 11;
  // 备注。
  optional string remark = 12;
  // 冻结充值币金额。
  optional int64 diamond = 13;
  // 冻结赠币金额。
  optional int64 coin = 14;
  // Freeze ownership; business freezes are never claimed by the Admin expiry worker.
  optional WalletFreezeSource source = 15;
  // Release policy for Manual Wallet Freeze.
  optional WalletFreezeReleasePolicy release_policy = 16;
  // Automatic release deadline for TEMPORARY manual freezes.
  optional google.protobuf.Timestamp expires_at = 17;
  // Human review deadline for UNTIL_RELEASED manual freezes.
  optional google.protobuf.Timestamp review_due_at = 18;
  // Authenticated Operator that created the manual freeze.
  optional uint32 operator_id = 19;
  // Mandatory human-entered reason for the manual freeze.
  optional string reason = 20;
  // Actual release time for manual or business release.
  optional google.protobuf.Timestamp released_at = 21;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}
// 冻结钱包请求。
message FreezeWalletRequest {
  // 应用 ID。
  common.v1.AppId app_id = 1;
  // 用户 ID。
  uint64 user_id = 2;
  // 冻结金额。
  int64 amount = 3;
  // 币种；未指定时按充值币、赠币的优先级消费。
  optional WalletCurrency currency = 4;
  // 业务类型。
  string biz_type = 5;
  // 业务关联 ID。
  string biz_id = 6;
  // 幂等键。
  string idempotency_key = 7;
  // 备注。
  optional string remark = 8;
  // Trusted governance identity for Admin-initiated freezes.
  optional WalletGovernanceIdentity governance = 9;
  // Required for Admin-created Manual Wallet Freeze.
  optional WalletFreezeReleasePolicy release_policy = 10;
  // Required only for TEMPORARY.
  optional google.protobuf.Timestamp expires_at = 11;
  // Required only for UNTIL_RELEASED.
  optional google.protobuf.Timestamp review_due_at = 12;
}

// 解冻钱包请求。
message UnfreezeWalletRequest {
  // 冻结单号。
  string freeze_no = 1;
  // 幂等键。
  string idempotency_key = 2;
  // 备注。
  optional string remark = 3;
  // 应用 ID。
  optional common.v1.AppId app_id = 4;
  // Trusted governance identity for Admin-initiated unfreezes.
  optional WalletGovernanceIdentity governance = 5;
}
