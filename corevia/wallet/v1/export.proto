// WalletExportSortField 定义对应业务维度允许使用的离散取值。
enum WalletExportSortField {
  // 未提供有效取值；调用方不得据此推断业务状态。
  WALLET_EXPORT_SORT_FIELD_UNSPECIFIED = 0;
  // WALLET_EXPORT_SORT_FIELD_ID 选择导出或查询投影中的 ID 字段。
  WALLET_EXPORT_SORT_FIELD_ID = 1;
  // WALLET_EXPORT_SORT_FIELD_USER_ID 选择导出或查询投影中的 USER_ID 字段。
  WALLET_EXPORT_SORT_FIELD_USER_ID = 2;
  // WALLET_EXPORT_SORT_FIELD_CREATED_AT 选择导出或查询投影中的 CREATED_AT 字段。
  WALLET_EXPORT_SORT_FIELD_CREATED_AT = 3;
  // WALLET_EXPORT_SORT_FIELD_UPDATED_AT 选择导出或查询投影中的 UPDATED_AT 字段。
  WALLET_EXPORT_SORT_FIELD_UPDATED_AT = 4;
  // WALLET_EXPORT_SORT_FIELD_AMOUNT 选择导出或查询投影中的 AMOUNT 字段。
  WALLET_EXPORT_SORT_FIELD_AMOUNT = 5;
  // WALLET_EXPORT_SORT_FIELD_DIFF_AMOUNT 选择导出或查询投影中的 DIFF_AMOUNT 字段。
  WALLET_EXPORT_SORT_FIELD_DIFF_AMOUNT = 6;
}

// WalletExportSort 定义 Wallet Export 使用的排序字段与方向。
message WalletExportSort {
  // field 承载 WalletExportSort 关联的 WalletExportSortField。
  WalletExportSortField field = 1;
  // direction 指定 WalletExportSort 统计、流转或查询采用的业务维度。
  common.pagination.v1.Sorting.Direction direction = 2;
}

// WalletBalanceExportFilter 定义可组合的查询筛选条件。
message WalletBalanceExportFilter {
  // user_id 标识关联的 User。
  optional uint64 user_id = 1;
  // currency 指定相关金额使用的币种或计量单位。
  optional WalletCurrency currency = 2;
}

// WalletTransactionExportFilter 定义可组合的查询筛选条件。
message WalletTransactionExportFilter {
  // user_id 标识关联的 User。
  optional uint64 user_id = 1;
  // currency 指定相关金额使用的币种或计量单位。
  optional WalletCurrency currency = 2;
  // type 区分 WalletTransactionExportFilter 的业务类型。
  optional WalletTransaction.Type type = 3;
  // status 表示 WalletTransactionExportFilter 当前可观察的生命周期状态。
  optional WalletTransaction.Status status = 4;
  // created_from 指定 WalletTransactionExportFilter 查询或生效区间的起始边界。
  optional google.protobuf.Timestamp created_from = 5;
  // created_to 指定 WalletTransactionExportFilter 查询或生效区间的结束边界。
  optional google.protobuf.Timestamp created_to = 6;
}

// WalletDebtExportFilter 定义可组合的查询筛选条件。
message WalletDebtExportFilter {
  // user_id 标识关联的 User。
  optional uint64 user_id = 1;
  // status 表示 WalletDebtExportFilter 当前可观察的生命周期状态。
  optional string status = 2;
  // source_type 区分 WalletDebtExportFilter 的业务类型。
  optional string source_type = 3;
  // created_from 指定 WalletDebtExportFilter 查询或生效区间的起始边界。
  optional google.protobuf.Timestamp created_from = 4;
  // created_to 指定 WalletDebtExportFilter 查询或生效区间的结束边界。
  optional google.protobuf.Timestamp created_to = 5;
}

// WalletAdjustmentExportFilter 定义可组合的查询筛选条件。
message WalletAdjustmentExportFilter {
  // user_id 标识关联的 User。
  optional uint64 user_id = 1;
  // status 表示 WalletAdjustmentExportFilter 当前可观察的生命周期状态。
  optional WalletAdjustment.Status status = 2;
  // requester_id 标识关联的 Requester。
  optional uint32 requester_id = 3;
  // created_from 指定 WalletAdjustmentExportFilter 查询或生效区间的起始边界。
  optional google.protobuf.Timestamp created_from = 4;
  // created_to 指定 WalletAdjustmentExportFilter 查询或生效区间的结束边界。
  optional google.protobuf.Timestamp created_to = 5;
}

// WalletReconciliationDifferenceExportFilter 定义可组合的查询筛选条件。
message WalletReconciliationDifferenceExportFilter {
  // batch_id 标识关联的 Batch。
  optional uint64 batch_id = 1;
  // user_id 标识关联的 User。
  optional uint64 user_id = 2;
  // diff_type 区分 WalletReconciliationDifferenceExportFilter 的业务类型。
  optional string diff_type = 3;
  // resolved 显式表示 WalletReconciliationDifferenceExportFilter 是否满足该条件。
  optional bool resolved = 4;
  // created_from 指定 WalletReconciliationDifferenceExportFilter 查询或生效区间的起始边界。
  optional google.protobuf.Timestamp created_from = 5;
  // created_to 指定 WalletReconciliationDifferenceExportFilter 查询或生效区间的结束边界。
  optional google.protobuf.Timestamp created_to = 6;
}

// WalletExportQuery 定义可组合的查询筛选条件。
message WalletExportQuery {
  // resource 指定本次查询、导出或操作面向的资源类型。
  WalletExportResource resource = 1;
  // WalletExportQuery 使用以下一种查询表达式。
  oneof filter {
    // balance 承载 WalletExportQuery 关联的 WalletBalanceExportFilter。
    WalletBalanceExportFilter balance = 2;
    // transaction 承载 WalletExportQuery 关联的 WalletTransactionExportFilter。
    WalletTransactionExportFilter transaction = 3;
    // debt 承载 WalletExportQuery 关联的 WalletDebtExportFilter。
    WalletDebtExportFilter debt = 4;
    // adjustment 承载 WalletExportQuery 关联的 WalletAdjustmentExportFilter。
    WalletAdjustmentExportFilter adjustment = 5;
    // reconciliation_difference 承载 WalletExportQuery 关联的 WalletReconciliationDifferenceExportFilter。
    WalletReconciliationDifferenceExportFilter reconciliation_difference = 6;
  }
  // sorting 列出 WalletExportQuery 关联的 WalletExportSort。
  repeated WalletExportSort sorting = 7;
  // fields 列出 WalletExportQuery 关联的 WalletExportField。
  repeated WalletExportField fields = 8;
}

// WalletExportJob 描述一次异步处理的生命周期与结果。
message WalletExportJob {
  // id 标识关联的 WalletExportJob。
  uint64 id = 1;
  // export_no 是 WalletExportJob 对外关联与审计使用的业务编号。
  string export_no = 3;
  // query 承载 WalletExportJob 关联的 WalletExportQuery。
  WalletExportQuery query = 4;
  // snapshot_at 记录 WalletExportJob 对应业务阶段的时间点。
  google.protobuf.Timestamp snapshot_at = 5;
  // requester_id 标识关联的 Requester。
  uint32 requester_id = 6;
  // purpose 指定 WalletExportJob 数据或能力的预期用途。
  string purpose = 7;
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 8;
  // status 表示 WalletExportJob 当前可观察的生命周期状态。
  WalletExportStatus status = 9;
  // attempt_count 记录 WalletExportJob 中符合对应条件的数量。
  uint32 attempt_count = 10;
  // row_count 记录 WalletExportJob 中符合对应条件的数量。
  uint64 row_count = 11;
  // file_id 标识关联的 File。
  uint64 file_id = 12;
  // result_expires_at 指定 WalletExportJob 失效的时间点。
  google.protobuf.Timestamp result_expires_at = 13;
  // failure_category 对失败进行稳定分类，供调用方决定重试或终止。
  string failure_category = 14;
  // started_at 指定 WalletExportJob 生效或查询区间的起始时间。
  google.protobuf.Timestamp started_at = 15;
  // finished_at 指定 WalletExportJob 生效或查询区间的结束时间。
  google.protobuf.Timestamp finished_at = 16;
  // created_at 记录 WalletExportJob 的创建时间。
  google.protobuf.Timestamp created_at = 17;
  // updated_at 记录 WalletExportJob 最近一次更新的时间。
  google.protobuf.Timestamp updated_at = 18;
}

// CreateWalletExportRequest 定义创建 WalletExport 的幂等命令参数。
message CreateWalletExportRequest {
  // query 承载 CreateWalletExport 关联的 WalletExportQuery。
  WalletExportQuery query = 2 [(google.api.field_behavior) = REQUIRED];
  // requester_id 标识关联的 Requester。
  uint32 requester_id = 3 [(google.api.field_behavior) = REQUIRED];
  // purpose 指定 CreateWalletExport 数据或能力的预期用途。
  string purpose = 4 [(google.api.field_behavior) = REQUIRED];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 5 [(google.api.field_behavior) = REQUIRED];
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 6 [(google.api.field_behavior) = REQUIRED];
}

// ListWalletExportsRequest 定义 WalletExports 的筛选与分页参数。
message ListWalletExportsRequest {
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 2;
  // resource 指定本次查询、导出或操作面向的资源类型。
  optional WalletExportResource resource = 3;
  // status 表示 ListWalletExports 当前可观察的生命周期状态。
  optional WalletExportStatus status = 4;
}

// ListWalletExportsResponse 返回 WalletExports 结果集合及分页信息。
message ListWalletExportsResponse {
  // items 包含本次返回或处理的业务条目。
  repeated WalletExportJob items = 1;
  // total 表示当前查询条件下可见结果的总数。
  uint64 total = 2;
}

// RetryWalletExportRequest 定义重试 WalletExport 的幂等管理命令参数。
message RetryWalletExportRequest {
  // export_id 标识关联的 Export。
  uint64 export_id = 2 [(google.api.field_behavior) = REQUIRED];
  // requester_id 标识关联的 Requester。
  uint32 requester_id = 3 [(google.api.field_behavior) = REQUIRED];
  // purpose 指定 RetryWalletExport 数据或能力的预期用途。
  string purpose = 4 [(google.api.field_behavior) = REQUIRED];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 5 [(google.api.field_behavior) = REQUIRED];
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 6 [(google.api.field_behavior) = REQUIRED];
}

// GetWalletExportDownloadRequest 标识待查询的 WalletExportDownload。
message GetWalletExportDownloadRequest {
  // export_id 标识关联的 Export。
  uint64 export_id = 2 [(google.api.field_behavior) = REQUIRED];
  // requester_id 标识关联的 Requester。
  uint32 requester_id = 3 [(google.api.field_behavior) = REQUIRED];
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 4 [(google.api.field_behavior) = REQUIRED];
}

// WalletExportDownload 提供一次性 Wallet Export 下载授权及失效时间。
message WalletExportDownload {
  // url 指定 WalletExportDownload 访问或跳转使用的目标地址。
  string url = 1;
  // expires_at 指定 WalletExportDownload 失效的时间点。
  google.protobuf.Timestamp expires_at = 2;
}
