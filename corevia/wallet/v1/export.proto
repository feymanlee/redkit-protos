// WalletExportResource 定义对应业务维度允许使用的离散取值。
enum WalletExportResource {
  // 未提供有效取值；调用方不得据此推断业务状态。
  WALLET_EXPORT_RESOURCE_UNSPECIFIED = 0;
  // WALLET_EXPORT_RESOURCE_BALANCE 选择 BALANCE 资源作为操作目标。
  WALLET_EXPORT_RESOURCE_BALANCE = 1;
  // WALLET_EXPORT_RESOURCE_TRANSACTION 选择 TRANSACTION 资源作为操作目标。
  WALLET_EXPORT_RESOURCE_TRANSACTION = 2;
  // WALLET_EXPORT_RESOURCE_DEBT 选择 DEBT 资源作为操作目标。
  WALLET_EXPORT_RESOURCE_DEBT = 3;
  // WALLET_EXPORT_RESOURCE_ADJUSTMENT 选择 ADJUSTMENT 资源作为操作目标。
  WALLET_EXPORT_RESOURCE_ADJUSTMENT = 4;
  // WALLET_EXPORT_RESOURCE_RECONCILIATION_DIFFERENCE 选择 RECONCILIATION_DIFFERENCE 资源作为操作目标。
  WALLET_EXPORT_RESOURCE_RECONCILIATION_DIFFERENCE = 5;
}

// WalletExportStatus 刻画对应资源的生命周期状态。
enum WalletExportStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  WALLET_EXPORT_STATUS_UNSPECIFIED = 0;
  // 已进入处理队列，尚未开始执行。
  WALLET_EXPORT_STATUS_QUEUED = 1;
  // 正在处理中，尚未形成终态。
  WALLET_EXPORT_STATUS_RUNNING = 2;
  // 处理已成功完成。
  WALLET_EXPORT_STATUS_COMPLETED = 3;
  // 处理失败；是否可重试由具体失败原因决定。
  WALLET_EXPORT_STATUS_FAILED = 4;
  // 有效期已结束，不再接受后续使用。
  WALLET_EXPORT_STATUS_EXPIRED = 5;
}

