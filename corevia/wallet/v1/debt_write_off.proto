syntax = "proto3";

package wallet.v1;

import "common/pagination/v1/pagination.proto";
import "common/v1/common.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "wallet/v1/wallet_types.proto";

// WalletDebtWriteOff 表示 Wallet Debt Write-off 的申请、审核与执行状态。
message WalletDebtWriteOff {
  // Status 刻画对应资源的生命周期状态。
  enum Status {
    // 未提供有效取值；调用方不得据此推断业务状态。
    STATUS_UNSPECIFIED = 0;
    // 已受理并等待后续处理。
    PENDING = 1;
    // 变更已经应用并形成可查询结果。
    APPLIED = 2;
    // 审核已拒绝，不再按原请求继续。
    REJECTED = 3;
    // 有效期已结束，不再接受后续使用。
    EXPIRED = 4;
  }

  // id 标识关联的 WalletDebtWriteOff。
  optional uint64 id = 1;
  // app_id 限定 WalletDebtWriteOff 所属 App；UNSPECIFIED 不表示跨 App。
  optional uint32 app_id = 2;
  // user_id 标识当前 App 内关联的 User。
  optional uint64 user_id = 3;
  // debt_id 标识关联的 Debt。
  optional uint64 debt_id = 4;
  // debt_no 是 WalletDebtWriteOff 对外关联与审计使用的业务编号。
  optional string debt_no = 5;
  // amount 以对应 WalletCurrency 的最小计量单位表示，不使用浮点数。
  optional int64 amount = 6;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  optional string reason = 7;
  // status 表示 WalletDebtWriteOff 当前可观察的生命周期状态。
  optional Status status = 8;
  // requester_id 标识关联的 Requester。
  optional uint32 requester_id = 9;
  // reviewer_id 标识关联的 Reviewer。
  optional uint32 reviewer_id = 10;
  // review_note 记录人工判断的补充说明，供审计与复核。
  optional string review_note = 11;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  optional string idempotency_key = 12;
  // expires_at 指定 WalletDebtWriteOff 失效的时间点。
  optional google.protobuf.Timestamp expires_at = 13;
  // reviewed_at 记录 WalletDebtWriteOff 对应业务阶段的时间点。
  optional google.protobuf.Timestamp reviewed_at = 14;
  // expired_at 指定 WalletDebtWriteOff 失效的时间点。
  optional google.protobuf.Timestamp expired_at = 15;
  // created_at 记录 WalletDebtWriteOff 的创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // updated_at 记录 WalletDebtWriteOff 最近一次更新的时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// CreateWalletDebtWriteOffRequest 定义创建 WalletDebtWriteOff 的幂等命令参数。
message CreateWalletDebtWriteOffRequest {
  // app_id 限定 CreateWalletDebtWriteOff 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED];
  // debt_id 标识关联的 Debt。
  uint64 debt_id = 2 [(google.api.field_behavior) = REQUIRED];
  // amount 以对应 WalletCurrency 的最小计量单位表示，不使用浮点数。
  int64 amount = 3 [(google.api.field_behavior) = REQUIRED];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 4 [(google.api.field_behavior) = REQUIRED];
  // requester_id 标识关联的 Requester。
  uint32 requester_id = 5 [(google.api.field_behavior) = REQUIRED];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 6 [(google.api.field_behavior) = REQUIRED];
  // governance 承载 CreateWalletDebtWriteOff 关联的 WalletGovernanceIdentity。
  optional WalletGovernanceIdentity governance = 7;
}

// ReviewWalletDebtWriteOffRequest 定义审核 WalletDebtWriteOff 的命令参数。
message ReviewWalletDebtWriteOffRequest {
  // write_off_id 标识关联的 WriteOff。
  uint64 write_off_id = 1 [(google.api.field_behavior) = REQUIRED];
  // reviewer_id 标识关联的 Reviewer。
  uint32 reviewer_id = 2 [(google.api.field_behavior) = REQUIRED];
  // review_note 记录人工判断的补充说明，供审计与复核。
  optional string review_note = 3;
  // app_id 限定 ReviewWalletDebtWriteOff 所属 App；UNSPECIFIED 不表示跨 App。
  optional common.v1.AppId app_id = 4;
  // governance 承载 ReviewWalletDebtWriteOff 关联的 WalletGovernanceIdentity。
  optional WalletGovernanceIdentity governance = 5;
}

// WalletDebtWriteOffFilter 定义可组合的查询筛选条件。
message WalletDebtWriteOffFilter {
  // status 表示 WalletDebtWriteOffFilter 当前可观察的生命周期状态。
  optional WalletDebtWriteOff.Status status = 1;
  // requester_id 标识关联的 Requester。
  optional uint32 requester_id = 2;
  // user_id 标识当前 App 内关联的 User。
  optional uint64 user_id = 3;
  // debt_id 标识关联的 Debt。
  optional uint64 debt_id = 4;
  // minimum_age_seconds 以秒表示对应流程的持续时间或上限。
  optional uint64 minimum_age_seconds = 5;
}

// ListWalletDebtWriteOffsRequest 定义 WalletDebtWriteOffs 的筛选与分页参数。
message ListWalletDebtWriteOffsRequest {
  // app_id 限定 ListWalletDebtWriteOffs 所属 App；UNSPECIFIED 不表示跨 App。
  optional common.v1.AppId app_id = 1;
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 2;
  // filter 限定本次查询采用的筛选条件。
  optional WalletDebtWriteOffFilter filter = 3;
}

// ListWalletDebtWriteOffsResponse 返回 WalletDebtWriteOffs 结果集合及分页信息。
message ListWalletDebtWriteOffsResponse {
  // items 包含本次返回或处理的业务条目。
  repeated WalletDebtWriteOff items = 1;
  // total 表示当前查询条件下可见结果的总数。
  uint64 total = 2;
}

// 钱包欠款核销服务。
service WalletDebtWriteOffService {
  // 创建 WriteOff。
  rpc CreateWriteOff(CreateWalletDebtWriteOffRequest) returns (WalletDebtWriteOff) {}
  // 批准 WriteOff。
  rpc ApproveWriteOff(ReviewWalletDebtWriteOffRequest) returns (WalletDebtWriteOff) {}
  // 拒绝 WriteOff。
  rpc RejectWriteOff(ReviewWalletDebtWriteOffRequest) returns (WalletDebtWriteOff) {}
  // 查询 WriteOff 列表。
  rpc ListWriteOffs(ListWalletDebtWriteOffsRequest) returns (ListWalletDebtWriteOffsResponse) {}
}
