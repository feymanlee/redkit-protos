syntax = "proto3";

package wallet.v1;

import "common/v1/common.proto";
import "common/pagination/v1/pagination.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "wallet/v1/wallet_types.proto";

// 充值退款记录。
message RechargeRefund {
  // 退款记录 ID。
  optional uint64 id = 1;
  // 用户 ID。
  optional uint64 user_id = 3;
  // 充值订单号。
  optional string order_no = 4;
  // 支付单号。
  optional string payment_no = 5;
  // 退款单号。
  optional string refund_no = 6;
  // 现金退款金额，分。
  optional int64 refund_amount = 7;
  // 应扣回充值币数量。
  optional int64 diamond_amount = 8;
  // 冻结单号。
  optional string freeze_no = 9;
  // 状态。
  optional string status = 10;
  // 实际扣回充值币数量。
  optional int64 deducted_amount = 11;
  // 形成欠款的充值币数量。
  optional int64 debt_amount = 12;
  // 欠款单号。
  optional string debt_no = 13;
  // 是否渠道强制退款。
  optional bool force = 14;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// 用户欠款记录。
message WalletUserDebt {
  // 欠款 ID。
  optional uint64 id = 1;
  // 用户 ID。
  optional uint64 user_id = 3;
  // 欠款单号。
  optional string debt_no = 4;
  // 来源类型。
  optional string source_type = 5;
  // 来源单号。
  optional string source_id = 6;
  // 支付单号。
  optional string payment_no = 7;
  // 充值订单号。
  optional string order_no = 8;
  // 欠款币种。
  optional WalletCurrency currency = 9;
  // 欠款总额。
  optional int64 amount = 10;
  // 已偿还金额。
  optional int64 repaid_amount = 11;
  // 欠款状态。
  optional string status = 12;
  // 幂等键。
  optional string idempotency_key = 13;
  // 备注。
  optional string remark = 14;
  // Amount waived through approved Wallet Debt Write-off.
  optional int64 written_off_amount = 15;
  // Derived amount = amount - repaid_amount - written_off_amount.
  optional int64 outstanding_amount = 16;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// WalletUserDebtFilter 定义可组合的查询筛选条件。
message WalletUserDebtFilter {
  // user_id 标识关联的 User。
  optional uint64 user_id = 1;
  // status 表示 WalletUserDebtFilter 当前可观察的生命周期状态。
  optional string status = 2;
  // source_type 区分 WalletUserDebtFilter 的业务类型。
  optional string source_type = 3;
  // created_from 指定 WalletUserDebtFilter 查询或生效区间的起始边界。
  optional google.protobuf.Timestamp created_from = 4;
  // created_to 指定 WalletUserDebtFilter 查询或生效区间的结束边界。
  optional google.protobuf.Timestamp created_to = 5;
  // order_no 是 WalletUserDebtFilter 对外关联与审计使用的业务编号。
  optional string order_no = 6 [(google.api.field_behavior) = OPTIONAL];
  // payment_no 是 WalletUserDebtFilter 对外关联与审计使用的业务编号。
  optional string payment_no = 7 [(google.api.field_behavior) = OPTIONAL];
}

// ListWalletUserDebtsRequest 定义 WalletUserDebts 的筛选与分页参数。
message ListWalletUserDebtsRequest {
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 2;
  // filter 限定本次查询采用的筛选条件。
  optional WalletUserDebtFilter filter = 3;
}
// 预处理充值退款请求。
message PrepareRechargeRefundRequest {
  // 支付单号。
  string payment_no = 1;
  // 退款单号。
  string refund_no = 2;
  // 现金退款金额，分。
  int64 refund_amount = 3;
}

// 确认充值退款请求。
message ConfirmRechargeRefundRequest {
  // 退款单号。
  string refund_no = 1;
}

// 应用充值退款请求。
message ApplyRechargeRefundRequest {
  // 支付单号。
  string payment_no = 1;
  // 退款单号。
  string refund_no = 2;
  // 现金退款金额，分。
  int64 refund_amount = 3;
  // 是否渠道强制退款；为 true 时余额不足会记录欠款。
  bool force = 4;
}

// 取消充值退款请求。
message CancelRechargeRefundRequest {
  // 退款单号。
  string refund_no = 1;
}
