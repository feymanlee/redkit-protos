syntax = "proto3";

package wallet.v1;

import "common/pagination/v1/pagination.proto";
import "common/v1/common.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "wallet/v1/wallet_types.proto";

// Wallet Intervention 是人工解冻或可冲正流水的双人复核申请。
message WalletIntervention {
  // Type 区分对应资源的业务类型。
  enum Type {
    // 未提供有效取值；调用方不得据此推断业务状态。
    TYPE_UNSPECIFIED = 0;
    // MANUAL_UNFREEZE 选择 MANUAL_UNFREEZE 业务类型。
    MANUAL_UNFREEZE = 1;
    // TRANSACTION_REVERSAL 选择 TRANSACTION_REVERSAL 业务类型。
    TRANSACTION_REVERSAL = 2;
  }
  // Status 刻画对应资源的生命周期状态。
  enum Status {
    // 未提供有效取值；调用方不得据此推断业务状态。
    STATUS_UNSPECIFIED = 0;
    // 已受理并等待后续处理。
    PENDING = 1;
    // 变更已经应用并形成可查询结果。
    APPLIED = 2;
    // 审核已拒绝，不再按原请求继续。
    REJECTED = 3;
    // 有效期已结束，不再接受后续使用。
    EXPIRED = 4;
  }

  // id 标识关联的 WalletIntervention。
  optional uint64 id = 1;
  // user_id 标识关联的 User。
  optional uint64 user_id = 3;
  // type 区分 WalletIntervention 的业务类型。
  optional Type type = 4;
  // status 表示 WalletIntervention 当前可观察的生命周期状态。
  optional Status status = 5;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  optional string reason = 6;
  // requester_id 标识关联的 Requester。
  optional uint32 requester_id = 7;
  // reviewer_id 标识关联的 Reviewer。
  optional uint32 reviewer_id = 8;
  // review_note 记录人工判断的补充说明，供审计与复核。
  optional string review_note = 9;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  optional string idempotency_key = 10;
  // target_freeze_no 是 WalletIntervention 对外关联与审计使用的业务编号。
  optional string target_freeze_no = 11;
  // target_transaction_id 标识关联的 TargetTransaction。
  optional uint64 target_transaction_id = 12;
  // result_transaction_id 标识关联的 ResultTransaction。
  optional uint64 result_transaction_id = 13;
  // expires_at 指定 WalletIntervention 失效的时间点。
  optional google.protobuf.Timestamp expires_at = 14;
  // reviewed_at 记录 WalletIntervention 对应业务阶段的时间点。
  optional google.protobuf.Timestamp reviewed_at = 15;
  // expired_at 指定 WalletIntervention 失效的时间点。
  optional google.protobuf.Timestamp expired_at = 16;
  // created_at 记录 WalletIntervention 的创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // updated_at 记录 WalletIntervention 最近一次更新的时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// CreateWalletInterventionRequest 定义创建 WalletIntervention 的幂等命令参数。
message CreateWalletInterventionRequest {
  // type 区分 CreateWalletIntervention 的业务类型。
  WalletIntervention.Type type = 2 [(google.api.field_behavior) = REQUIRED];
  // target_freeze_no 是 CreateWalletIntervention 对外关联与审计使用的业务编号。
  optional string target_freeze_no = 3;
  // target_transaction_id 标识关联的 TargetTransaction。
  optional uint64 target_transaction_id = 4;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 5 [(google.api.field_behavior) = REQUIRED];
  // requester_id 标识关联的 Requester。
  uint32 requester_id = 6 [(google.api.field_behavior) = REQUIRED];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 7 [(google.api.field_behavior) = REQUIRED];
  // governance 承载 CreateWalletIntervention 关联的 WalletGovernanceIdentity。
  optional WalletGovernanceIdentity governance = 8;
}

// ReviewWalletInterventionRequest 定义审核 WalletIntervention 的命令参数。
message ReviewWalletInterventionRequest {
  // intervention_id 标识关联的 Intervention。
  uint64 intervention_id = 1 [(google.api.field_behavior) = REQUIRED];
  // reviewer_id 标识关联的 Reviewer。
  uint32 reviewer_id = 2 [(google.api.field_behavior) = REQUIRED];
  // review_note 记录人工判断的补充说明，供审计与复核。
  optional string review_note = 3;
  // governance 承载 ReviewWalletIntervention 关联的 WalletGovernanceIdentity。
  optional WalletGovernanceIdentity governance = 5;
}

// WalletInterventionFilter 定义可组合的查询筛选条件。
message WalletInterventionFilter {
  // type 区分 WalletInterventionFilter 的业务类型。
  optional WalletIntervention.Type type = 1;
  // status 表示 WalletInterventionFilter 当前可观察的生命周期状态。
  optional WalletIntervention.Status status = 2;
  // requester_id 标识关联的 Requester。
  optional uint32 requester_id = 3;
  // user_id 标识关联的 User。
  optional uint64 user_id = 4;
  // minimum_age_seconds 以秒表示对应流程的持续时间或上限。
  optional uint64 minimum_age_seconds = 5;
}

// ListWalletInterventionsRequest 定义 WalletInterventions 的筛选与分页参数。
message ListWalletInterventionsRequest {
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 2;
  // filter 限定本次查询采用的筛选条件。
  optional WalletInterventionFilter filter = 3;
}

// ListWalletInterventionResponse 返回 WalletIntervention 结果集合及分页信息。
message ListWalletInterventionResponse {
  // items 包含本次返回或处理的业务条目。
  repeated WalletIntervention items = 1;
  // total 表示当前查询条件下可见结果的总数。
  uint64 total = 2;
}
