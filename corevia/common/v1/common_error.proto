syntax = "proto3";

package common.v1;

import "errors/errors.proto";

// 通用错误原因。
enum ErrorReason {
  option (errors.default_code) = 500;

  // 未指定。
  COMMON_UNSPECIFIED = 0;
  // 通用 bad 请求。
  COMMON_BAD_REQUEST = 400 [(errors.code) = 400];
  // 通用 unauthorized。
  COMMON_UNAUTHORIZED = 401 [(errors.code) = 401];
  // 通用 forbidden。
  COMMON_FORBIDDEN = 403 [(errors.code) = 403];
  // 通用 not found。
  COMMON_NOT_FOUND = 404 [(errors.code) = 404];
  // 通用 conflict。
  COMMON_CONFLICT = 409 [(errors.code) = 409];
  // 缺少具体 App Scope。
  APP_SCOPE_REQUIRED = 4001 [(errors.code) = 400];
  // App Scope 不是受支持的 App。
  APP_SCOPE_INVALID = 4002 [(errors.code) = 400];
  // 通用 站内 server 错误。
  COMMON_INTERNAL_SERVER_ERROR = 500 [(errors.code) = 500];
}
