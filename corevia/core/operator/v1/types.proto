syntax = "proto3";

package core.operator.v1;

// 数据权限范围
enum DataScope {
  // 未指定。
  DATA_SCOPE_UNSPECIFIED = 0;

  // 全部数据：可跨 App 或 App 内所有数据 (取决于 app_id)。
  ALL = 1;              // 全部数据：可跨App或App内所有 Unit (取决于 app_id)
  // 仅限本人：只能看到 owner_id 等于自己的数据。
  SELF = 2;             // 仅限本人：只能看到 owner_id 等于自己的数据

  // 自定义数据范围。
  CUSTOM = 3;           // 自定义数据范围
}
