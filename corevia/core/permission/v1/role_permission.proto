syntax = "proto3";

package core.permission.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "common/pagination/v1/pagination.proto";

// 角色权限关联
message RolePermission {
  // 生效方式
  enum EffectiveStatus {
    // 未指定。
    EFFECTIVE_STATUS_UNSPECIFIED = 0;

    // 有效。
    ALLOW = 1;  // 有效
    // 无效。
    DENY = 2;   // 无效
  }

  // 状态枚举。
  enum Status {
    // 禁用。
    OFF = 0;         // 禁用
    // 启用。
    ON = 1;          // 启用
  }

  // ID。
  optional uint32 id = 1 [
    (gnostic.openapi.v3.property) = {description: "ID"}
  ];  // ID

  // 角色ID。
  optional uint32 role_id = 2 [
    (gnostic.openapi.v3.property) = {description: "角色ID"}
  ];  // 角色ID

  // 权限点ID。
  optional uint32 permission_id = 3 [
    (gnostic.openapi.v3.property) = {description: "权限点ID"}
  ];  // 权限点ID

  // 生效方式。
  optional EffectiveStatus effect = 4 [
    (gnostic.openapi.v3.property) = {description: "生效方式"}
  ];  // 权限点ID

  // 优先级（-100~100，值越大优先级越高）。
  optional int32 priority = 5 [
    (gnostic.openapi.v3.property) = {description: "优先级（-100~100，值越大优先级越高）"}
  ];  // 优先级（-100~100，值越大优先级越高）

  // 状态。
  optional Status status = 6 [
    (gnostic.openapi.v3.property) = {description: "状态"}
  ];  // 状态

  // AppID，0代表系统全局角色。
  optional uint32 app_id = 40 [
    (gnostic.openapi.v3.property) = {description: "AppID，0代表系统全局角色"}
  ];  // AppID，0代表系统全局角色
  // App名称。
  optional string app_name = 41 [
    (gnostic.openapi.v3.property) = {description: "App名称"}
  ];  // App名称

  // 创建者用户ID。
  optional uint32 created_by = 100 [ (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  // 更新者用户ID。
  optional uint32 updated_by = 101 [ (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  // 删除者用户ID。
  optional uint32 deleted_by = 102 [ (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200 [ (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201 [ (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  // 删除时间。
  optional google.protobuf.Timestamp deleted_at = 202 [ (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}
