syntax = "proto3";

package core.permission.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "common/pagination/v1/pagination.proto";

// 菜单服务
service MenuService {
  // 查询菜单列表
  rpc List (common.pagination.v1.PagingRequest) returns (ListMenuResponse) {}

  // 统计菜单数量
  rpc Count (common.pagination.v1.PagingRequest) returns (CountMenuResponse) {}

  // 查询菜单详情
  rpc Get (GetMenuRequest) returns (Menu) {}

  // 创建菜单
  rpc Create (CreateMenuRequest) returns (google.protobuf.Empty) {}

  // 更新菜单
  rpc Update (UpdateMenuRequest) returns (google.protobuf.Empty) {}

  // 删除菜单
  rpc Delete (DeleteMenuRequest) returns (google.protobuf.Empty) {}
}

// 菜单
message Menu {
  // 菜单类型
  enum Type {
    // 目录。
    CATALOG = 0;    // 目录
    // 菜单。
    MENU = 1;       // 菜单
    // 按钮。
    BUTTON = 2;     // 按钮
    // 内嵌。
    EMBEDDED = 3;   // 内嵌
    // 外链。
    LINK = 4;       // 外链
  }

  // 菜单状态
  enum Status {
    // 禁用。
    OFF = 0;         // 禁用
    // 启用。
    ON = 1;          // 启用
  }

  // ID。
  optional uint32 id = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "菜单ID"
    }
  ]; // 菜单ID

  // 菜单状态。
  optional Status status = 2 [
    (gnostic.openapi.v3.property) = {description: "菜单状态"}
  ]; // 菜单状态

  // 菜单类型。
  optional Type type = 3 [
    (gnostic.openapi.v3.property) = {description: "菜单类型"}
  ]; // 菜单类型

  // 路径。
  optional string path = 10 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "路由路径"
    }
  ]; // 路由路径

  // redirect。
  optional string redirect = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "重定向地址"
    }
  ]; // 重定向地址

  // alias。
  optional string alias = 12 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "路由别名"
    }
  ]; // 路由别名

  // 名称。
  optional string name = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "路由命名，然后我们可以使用 name 而不是 path 来传递 to 属性给 <router-link>。"
    }
  ]; // 路由命名，然后我们可以使用 name 而不是 path 来传递 to 属性给 <router-link>。

  // 指向的组件。
  optional string component = 14 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {description: "指向的组件"}
  ]; // 指向的组件

  // 路由元信息。
  optional MenuMeta meta = 15 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {description: "路由元信息"}
  ]; // 路由元信息

  // 父节点ID。
  optional uint32 parent_id = 50 [ (gnostic.openapi.v3.property) = {description: "父节点ID"}];  // 父节点ID
  // 子节点树。
  repeated Menu children = 51 [ (gnostic.openapi.v3.property) = {description: "子节点树"}];  // 子节点树

  // 创建者用户ID。
  optional uint32 created_by = 100 [ (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  // 更新者用户ID。
  optional uint32 updated_by = 101 [ (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  // 删除者用户ID。
  optional uint32 deleted_by = 102 [ (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200 [ (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201 [ (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  // 删除时间。
  optional google.protobuf.Timestamp deleted_at = 202 [ (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 路由元信息
message MenuMeta {
  // active icon。
  optional string activeIcon = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "激活图标，用于：菜单、tab"
    }
  ]; // 激活图标，用于：菜单、tab

  // active path。
  optional string activePath = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "当前激活的菜单，有时候不想激活现有菜单，需要激活父级菜单时使用"
    }
  ]; // 当前激活的菜单，有时候不想激活现有菜单，需要激活父级菜单时使用

  // affix tab。
  optional bool affixTab = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "是否固定标签页"
    }
  ]; // 是否固定标签页

  // affix tab 订单。
  optional int32 affixTabOrder = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "固定标签页的顺序"
    }
  ]; // 固定标签页的顺序

  // authority。
  repeated string authority = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "权限列表，需要特定的角色标识才可以访问"
    }
  ]; // 权限列表，需要特定的角色标识才可以访问

  // badge。
  optional string badge = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "徽标"
    }
  ]; // 徽标

  // badge 类型。
  optional string badgeType = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "徽标类型",
      enum: [{yaml: "dot"}, {yaml: "normal"}]
    }
  ]; // 徽标类型

  // badge variants。
  optional string badgeVariants = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "徽标颜色",
      enum: [{yaml: "default"}, {yaml: "destructive"}, {yaml: "primary"}, {yaml: "success"}, {yaml: "warning"}]
    }
  ]; // 徽标颜色

  // hide children in 菜单。
  optional bool hideChildrenInMenu = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "当前路由的子级在菜单中不展现"
    }
  ]; // 当前路由的子级在菜单中不展现

  // hide in breadcrumb。
  optional bool hideInBreadcrumb = 10 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "当前路由在面包屑中不展现"
    }
  ]; // 当前路由在面包屑中不展现

  // hide in 菜单。
  optional bool hideInMenu = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "当前路由在菜单中不展现"
    }
  ]; // 当前路由在菜单中不展现

  // hide in tab。
  optional bool hideInTab = 12 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "当前路由在标签页不展现"
    }
  ]; // 当前路由在标签页不展现

  // icon。
  optional string icon = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "图标，用于：菜单、标签页"
    }
  ]; // 图标，用于：菜单、标签页

  // iframe src。
  optional string iframeSrc = 14 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "iframe 地址"
    }
  ]; // iframe 地址

  // ignore 访问。
  optional bool ignoreAccess = 15 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "忽略权限，直接可以访问"
    }
  ]; // 忽略权限，直接可以访问

  // keep alive。
  optional bool keepAlive = 16 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "开启KeepAlive缓存"
    }
  ]; // 开启KeepAlive缓存

  // link。
  optional string link = 17 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "外链-跳转路径"
    }
  ]; // 外链-跳转路径

  // loaded。
  optional bool loaded = 18 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "路由是否已经加载过"
    }
  ]; // 路由是否已经加载过

  // max num of open tab。
  optional int32 maxNumOfOpenTab = 19 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "标签页最大打开数量"
    }
  ]; // 标签页最大打开数量

  // 菜单 visible with forbidden。
  optional bool menuVisibleWithForbidden = 20 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "菜单可以看到，但是访问会被重定向到403"
    }
  ]; // 菜单可以看到，但是访问会被重定向到403

  // open in new window。
  optional bool openInNewWindow = 21 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "在新窗口打开"
    }
  ]; // 在新窗口打开

  // 订单。
  optional int32 order = 22 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "排序编号，用于路由->菜单排序"
    }
  ]; // 排序编号，用于路由->菜单排序

  // 标题。
  optional string title = 23 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "标题名称，路由上显示的标题"
    }
  ]; // 标题名称，路由上显示的标题
}

// 路由项
message MenuRouteItem {
  // 子节点树。
  repeated MenuRouteItem children = 1 [ (gnostic.openapi.v3.property) = {description: "子节点树"}]; // 子节点树

  // 路径。
  optional string path = 10 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "路由路径"
    }
  ]; // 路由路径

  // redirect。
  optional string redirect = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "重定向地址"
    }
  ]; // 重定向地址

  // alias。
  optional string alias = 12 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "路由别名"
    }
  ]; // 路由别名

  // 名称。
  optional string name = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "路由命名，然后我们可以使用 name 而不是 path 来传递 to 属性给 <router-link>。"
    }
  ]; // 路由命名，然后我们可以使用 name 而不是 path 来传递 to 属性给 <router-link>。

  // component。
  optional string component = 14 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "指向的组件"
    }
  ]; // 指向的组件

  // meta。
  optional MenuMeta meta = 15 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "路由元信息"
    }
  ]; // 路由元信息
}

// 查询菜单列表 - 回应
message ListMenuResponse {
  // 列表项。
  repeated Menu items = 1;
  // 总数。
  uint64 total = 2;
}

// 查询菜单详情 - 请求
message GetMenuRequest {
  // GetMenuRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  // 读取字段掩码。
  optional google.protobuf.FieldMask view_mask = 100 [
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建菜单 - 请求
message CreateMenuRequest {
  // 数据。
  Menu data = 1;
}

// 更新菜单 - 请求
message UpdateMenuRequest {
  // ID。
  uint32 id = 1;

  // 数据。
  Menu data = 2;

  // 更新字段掩码。
  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    }]; // 要更新的字段列表

}

// 删除菜单 - 请求
message DeleteMenuRequest {
  // 操作用户ID。
  optional uint32 operator_id = 1 [
    (gnostic.openapi.v3.property) = {description: "操作用户ID", read_only: true}]; // 操作用户ID

  // DeleteMenuRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 2 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }
}

// 数量 菜单响应。
message CountMenuResponse {
  // 数量。
  uint64 count = 1;
}
