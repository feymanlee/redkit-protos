syntax = "proto3";

package core.permission.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "common/pagination/v1/pagination.proto";


// API资源服务
service ApiService {
  // 查询API资源列表
  rpc List (common.pagination.v1.PagingRequest) returns (ListApiResponse) {}

  // 统计API资源数量
  rpc Count (common.pagination.v1.PagingRequest) returns (CountApiResponse) {}

  // 查询API资源详情
  rpc Get (GetApiRequest) returns (Api) {}

  // 创建API资源
  rpc Create (CreateApiRequest) returns (google.protobuf.Empty) {}

  // 更新API资源
  rpc Update (UpdateApiRequest) returns (google.protobuf.Empty) {}

  // 删除API资源
  rpc Delete (DeleteApiRequest) returns (google.protobuf.Empty) {}

  // 同步API资源
  rpc SyncApis (SyncApisRequest) returns (google.protobuf.Empty) {}

  // 查询路由数据
  rpc GetWalkRouteData (google.protobuf.Empty) returns (ListApiResponse) {}
}

// API资源
message Api {
  // API作用域
  enum Scope {
    // 无效。
    API_SCOPE_INVALID = 0; // 无效

    // 管理后台API。
    ADMIN = 1; // 管理后台API
    // 前台应用API。
    APP = 2; // 前台应用API
  }

  // 权限状态
  enum Status {
    // 禁用。
    OFF = 0;         // 禁用
    // 启用。
    ON = 1;          // 启用
  }

  // 资源ID。
  optional uint32 id = 1 [
    (gnostic.openapi.v3.property) = { description: "资源ID" }
  ]; // 资源ID

  // 接口操作名。
  optional string operation = 2 [
    (gnostic.openapi.v3.property) = { description: "接口操作名" }
  ]; // 接口操作名

  // 接口路径。
  optional string path = 3 [
    (gnostic.openapi.v3.property) = { description: "接口路径" }
  ]; // 接口路径

  // 请求方法（GET/POST/PUT/DELETE）。
  optional string method = 4 [
    (gnostic.openapi.v3.property) = { description: "请求方法（GET/POST/PUT/DELETE）" }
  ]; // 请求方法

  // 所属业务模块（如 “用户管理”“支付系统”）。
  optional string module = 5 [
    (gnostic.openapi.v3.property) = { description: "所属业务模块（如 “用户管理”“支付系统”）" }
  ]; // 所属业务模块

  // 模块描述。
  optional string module_description = 6 [
    (gnostic.openapi.v3.property) = { description: "模块描述" }
  ]; // 模块描述

  // 描述。
  optional string description = 7 [
    (gnostic.openapi.v3.property) = { description: "描述" }
  ]; // 描述

  // 作用域。
  optional Scope scope = 8 [
    (gnostic.openapi.v3.property) = { description: "作用域" }
  ]; // 作用域

  // 状态。
  optional Status status = 10 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态

  // 创建者用户ID。
  optional uint32 created_by = 100 [ (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  // 更新者用户ID。
  optional uint32 updated_by = 101 [ (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  // 删除者用户ID。
  optional uint32 deleted_by = 102 [ (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200 [ (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201 [ (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  // 删除时间。
  optional google.protobuf.Timestamp deleted_at = 202 [ (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询列表 - 回应
message ListApiResponse {
  // 列表项。
  repeated Api items = 1;
  // 总数。
  uint64 total = 2;
}

// 查询 - 请求
message GetApiRequest {
  // GetApiRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  // 读取字段掩码。
  optional google.protobuf.FieldMask view_mask = 100 [
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建 - 请求
message CreateApiRequest {
  // 数据。
  Api data = 1;
}

// 更新 - 请求
message UpdateApiRequest {
  // ID。
  uint32 id = 1;

  // 数据。
  Api data = 2;

  // 更新字段掩码。
  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    }]; // 要更新的字段列表

}

// 删除 - 请求
message DeleteApiRequest {
  // DeleteApiRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }
}

// 数量 API响应。
message CountApiResponse {
  // 数量。
  uint64 count = 1;
}

// sync apis请求。
message SyncApisRequest {
  // apis。
  repeated Api apis = 1;
}
