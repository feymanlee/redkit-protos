syntax = "proto3";

package core.permission.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "common/pagination/v1/pagination.proto";

// 权限组管理服务
service PermissionGroupService {
  // 查询权限组列表
  rpc List (common.pagination.v1.PagingRequest) returns (ListPermissionGroupResponse) {}

  // 统计权限组数量
  rpc Count (common.pagination.v1.PagingRequest) returns (CountPermissionGroupResponse) {}

  // 查询权限组详情
  rpc Get (GetPermissionGroupRequest) returns (PermissionGroup) {}

  // 创建权限组
  rpc Create (CreatePermissionGroupRequest) returns (google.protobuf.Empty) {}

  // 更新权限组
  rpc Update (UpdatePermissionGroupRequest) returns (google.protobuf.Empty) {}

  // 删除权限组
  rpc Delete (DeletePermissionGroupRequest) returns (google.protobuf.Empty) {}
}

// 权限组
message PermissionGroup {
  // 状态
  enum Status {
    // 禁用。
    OFF = 0;         // 禁用
    // 启用。
    ON = 1;          // 启用
  }

  // 权限组ID。
  optional uint32 id = 1 [
    (gnostic.openapi.v3.property) = { description: "权限组ID" }
  ]; // 权限组ID

  // 分组名称（如：用户管理、订单操作）。
  optional string name = 2 [
    (gnostic.openapi.v3.property) = { description: "分组名称（如：用户管理、订单操作）" }
  ]; // 分组名称（如：用户管理、订单操作）

  // 树形路径，格式：/1/10/101/（包含自身且首尾带/）。
  optional string path = 3 [
    (gnostic.openapi.v3.property) = {description: "树形路径，格式：/1/10/101/（包含自身且首尾带/）"}
  ];  // 树形路径，格式：/1/10/101/（包含自身且首尾带/）

  // 业务模块标识（如：system、order、pay）。
  optional string module = 4 [
    (gnostic.openapi.v3.property) = { description: "业务模块标识（如：system、order、pay）" }
  ]; // 业务模块标识（如：system、order、pay）

  // 排序值（越小越靠前）。
  optional uint32 sort_order = 5 [
    (gnostic.openapi.v3.property) = { description: "排序值（越小越靠前）" }
  ]; // 排序值（越小越靠前）

  // 状态。
  optional Status status = 6 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态

  // 描述。
  optional string description = 7 [
    (gnostic.openapi.v3.property) = { description: "描述" }
  ]; // 描述

  // 父节点ID。
  optional uint32 parent_id = 50 [ (gnostic.openapi.v3.property) = {description: "父节点ID"}];  // 父节点ID
  // 子节点树。
  repeated PermissionGroup children = 51 [ (gnostic.openapi.v3.property) = {description: "子节点树"}];  // 子节点树

  // 创建者用户ID。
  optional uint32 created_by = 100 [ (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  // 更新者用户ID。
  optional uint32 updated_by = 101 [ (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  // 删除者用户ID。
  optional uint32 deleted_by = 102 [ (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200 [ (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201 [ (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  // 删除时间。
  optional google.protobuf.Timestamp deleted_at = 202 [ (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询列表 - 回应
message ListPermissionGroupResponse {
  // 列表项。
  repeated PermissionGroup items = 1;
  // 总数。
  uint64 total = 2;
}

// 查询 - 请求
message GetPermissionGroupRequest {
  // GetPermissionGroupRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  // 读取字段掩码。
  optional google.protobuf.FieldMask view_mask = 100 [
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建 - 请求
message CreatePermissionGroupRequest {
  // 数据。
  PermissionGroup data = 1;
}

// 更新 - 请求
message UpdatePermissionGroupRequest {
  // ID。
  uint32 id = 1;

  // 数据。
  PermissionGroup data = 2;

  // 更新字段掩码。
  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    }]; // 要更新的字段列表

}

// 删除 - 请求
message DeletePermissionGroupRequest {
  // DeletePermissionGroupRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }
}

// 数量 权限 分组响应。
message CountPermissionGroupResponse {
  // 数量。
  uint64 count = 1;
}
