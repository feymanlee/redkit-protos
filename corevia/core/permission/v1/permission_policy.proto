syntax = "proto3";

package core.permission.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/duration.proto";

import "common/pagination/v1/pagination.proto";

// 权限策略
message PermissionPolicy {
  // 策略引擎类型
  enum PolicyEngine {
    // 未指定。
    POLICY_ENGINE_UNSPECIFIED = 0; // 未指定

    // Casbin策略引擎。
    CASBIN = 1; // Casbin策略引擎
    // Google CEL策略引擎。
    CEL = 2; // Google CEL策略引擎
    // SQL策略引擎。
    SQL = 3; // SQL策略引擎
    // Open Policy Agent策略引擎。
    OPA = 4; // Open Policy Agent策略引擎
  }

  // 状态
  enum Status {
    // 禁用。
    OFF = 0;         // 禁用
    // 启用。
    ON = 1;          // 启用
  }

  // ID。
  optional uint32 id = 1 [
    (gnostic.openapi.v3.property) = {
      description: "权限策略ID"
    }
  ]; // 权限策略ID

  // 权限 ID。
  optional uint32 permission_id = 2 [
    (gnostic.openapi.v3.property) = {
      description: "包含的权限点ID"
    }
  ]; // 包含的权限点ID

  // 策略 engine。
  optional PolicyEngine policy_engine = 3 [
    (gnostic.openapi.v3.property) = {
      description: "策略引擎"
    }
  ]; // 策略引擎

  // definition。
  optional string definition = 4 [
    (gnostic.openapi.v3.property) = {
      description: "策略定义（动态结构）"
    }
  ]; // 策略定义（动态结构）

  // version。
  optional uint32 version = 5 [
    (gnostic.openapi.v3.property) = {
      description: "策略版本（用于灰度/回滚）"
    }
  ]; // 策略版本（用于灰度/回滚）

  // eval 订单。
  optional uint32 eval_order = 6 [
    (gnostic.openapi.v3.property) = {
      description: "评估优先级（越小越先执行）"
    }
  ]; // 评估优先级（越小越先执行）

  // cache ttl。
  optional uint32 cache_ttl = 7 [
    (gnostic.openapi.v3.property) = {
      description: "结果缓存秒数（0=不缓存）"
    }
  ]; // 结果缓存秒数（0=不缓存）

  // AppID。
  optional uint32 app_id = 8 [
    (gnostic.openapi.v3.property) = {description: "AppID"}
  ];  // AppID

  // 状态。
  optional Status status = 9 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态

  // 创建者用户ID。
  optional uint32 created_by = 100 [ (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  // 更新者用户ID。
  optional uint32 updated_by = 101 [ (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  // 删除者用户ID。
  optional uint32 deleted_by = 102 [ (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200 [ (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201 [ (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  // 删除时间。
  optional google.protobuf.Timestamp deleted_at = 202 [ (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}
