syntax = "proto3";

package core.permission.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "common/pagination/v1/pagination.proto";
import "core/permission/v1/permission_group.proto";

// 权限点管理服务
service PermissionService {
  // 查询权限点列表
  rpc List (common.pagination.v1.PagingRequest) returns (ListPermissionResponse) {}

  // 统计权限点数量
  rpc Count (common.pagination.v1.PagingRequest) returns (CountPermissionResponse) {}

  // 查询权限点详情
  rpc Get (GetPermissionRequest) returns (Permission) {}

  // 创建权限点
  rpc Create (CreatePermissionRequest) returns (google.protobuf.Empty) {}

  // 更新权限点
  rpc Update (UpdatePermissionRequest) returns (google.protobuf.Empty) {}

  // 删除权限点
  rpc Delete (DeletePermissionRequest) returns (google.protobuf.Empty) {}

  // 批量创建权限点
  rpc BatchCreate (BatchCreatePermissionRequest) returns (BatchCreatePermissionResponse) {}

  // 同步权限
  rpc SyncPermissions (SyncPermissionsRequest) returns (google.protobuf.Empty) {}

  // 列出权限资源
  rpc ListPermissionResources(ListPermissionResourcesRequest) returns (ListPermissionResourcesResponse) {}

  // 根据权限ID列表获取权限值列表
  rpc ListPermissionCodesByIds(ListPermissionCodesByIdsRequest) returns (ListPermissionCodesByIdsResponse) {}
}

// 权限点
message Permission {
  // 权限点状态
  enum Status {
    // 禁用。
    OFF = 0;         // 禁用
    // 启用。
    ON = 1;          // 启用
  }

  // Scope 枚举（编号 0-2）已随平台收敛为单一 App 删除，见 ADR 0075；不得复用这些编号或名称。
  // 权限点ID。
  optional uint32 id = 1 [
    (gnostic.openapi.v3.property) = { description: "权限点ID" }
  ]; // 权限点ID

  // 权限点名称（如：删除用户）。
  optional string name = 2 [
    (gnostic.openapi.v3.property) = { description: "权限点名称（如：删除用户）" }
  ]; // 权限点名称（如：删除用户）

  // 权限点唯一编码（如：user.delete）。
  optional string code = 3 [
    (gnostic.openapi.v3.property) = { description: "权限点唯一编码（如：user.delete）" }
  ]; // 权限点唯一编码（如：user.delete）

  // 描述。
  optional string description = 4 [
    (gnostic.openapi.v3.property) = { description: "描述" }
  ]; // 描述

  // 状态。
  optional Status status = 5 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态

  // 分组ID。
  optional uint32 group_id = 6 [
    (gnostic.openapi.v3.property) = {description: "分组ID"}
  ];  // 分组ID

  // 分组名称。
  optional string group_name = 7 [
    (gnostic.openapi.v3.property) = {description: "分组名称"}
  ];  // 分组名称

  // 关联的菜单ID。
  repeated uint32 menu_ids = 10 [
    (gnostic.openapi.v3.property) = {description: "关联的菜单ID"}
  ]; // 关联的菜单ID

  // 关联的API资源ID。
  repeated uint32 api_ids = 11 [
    (gnostic.openapi.v3.property) = {description: "关联的API资源ID"}
  ]; // 关联的API资源ID

  // 创建者用户ID。
  optional uint32 created_by = 100 [ (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  // 更新者用户ID。
  optional uint32 updated_by = 101 [ (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  // 删除者用户ID。
  optional uint32 deleted_by = 102 [ (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200 [ (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201 [ (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  // 删除时间。
  optional google.protobuf.Timestamp deleted_at = 202 [ (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询列表 - 回应
message ListPermissionResponse {
  // 列表项。
  repeated Permission items = 1;
  // 总数。
  uint64 total = 2;
}

// 查询 - 请求
message GetPermissionRequest {
  // GetPermissionRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID

    // 权限点编码。
    string code = 2 [
      (gnostic.openapi.v3.property) = {description: "权限点编码", read_only: true}]; // 权限点编码
  }

  // 读取字段掩码。
  optional google.protobuf.FieldMask view_mask = 100 [
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建 - 请求
message CreatePermissionRequest {
  // 数据。
  Permission data = 1;
}

// 更新 - 请求
message UpdatePermissionRequest {
  // ID。
  uint32 id = 1;

  // 数据。
  Permission data = 2;

  // 更新字段掩码。
  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    }]; // 要更新的字段列表

}

// 删除 - 请求
message DeletePermissionRequest {
  // DeletePermissionRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID

    // 权限点编码。
    string code = 2 [
      (gnostic.openapi.v3.property) = {description: "权限点编码", read_only: true}]; // 权限点编码

    // 权限分组。
    uint32 group_id = 3 [
      (gnostic.openapi.v3.property) = {description: "权限分组", read_only: true}]; // 权限分组
  }
}

// 数量 权限响应。
message CountPermissionResponse {
  // 数量。
  uint64 count = 1;
}

// 批量创建 - 请求
message BatchCreatePermissionRequest {
  // 数据。
  repeated Permission data = 1;
}
// 批量创建 - 回应
message BatchCreatePermissionResponse {
  // 数据。
  repeated Permission data = 1;
}

// sync permissions请求。
message SyncPermissionsRequest {
  // permissions。
  repeated Permission permissions = 1;
  // 权限分组。
  repeated PermissionGroup permission_groups = 2 [
    (gnostic.openapi.v3.property) = {description: "权限分组", read_only: true}];
  // 操作人ID。
  optional uint32 operator_id = 3 [
    (gnostic.openapi.v3.property) = {description: "操作人ID"}];
}

// 权限点ID列表。
message ListPermissionCodesByIdsRequest {
  // 权限点ID列表。
  repeated uint32 permission_ids = 1 [ (gnostic.openapi.v3.property) = {description: "权限点ID列表"}];
}
// 权限点编码列表。
message ListPermissionCodesByIdsResponse {
  // 权限点编码列表。
  repeated string permission_codes = 1 [ (gnostic.openapi.v3.property) = {description: "权限点编码列表"}];
}

// 列表 权限 resources请求。
message ListPermissionResourcesRequest {
  // 资源类型
  enum ResourceType {
    // 未指定。
    RESOURCE_TYPE_UNSPECIFIED = 0;

    // 菜单。
    MENU = 1;        // 菜单
    // 接口(API)。
    API = 2;         // 接口(API)
    // 数据权限范围。
    DATA_SCOPE = 3;  // 数据权限范围
  }

  // 角色 ids。
  repeated uint32 role_ids = 1;
  // 权限 ids。
  repeated uint32 permission_ids = 2;

  // resource types。
  repeated ResourceType resource_types = 3;
}

// 权限 resource ids。
message PermissionResourceIds {
  // ids。
  repeated uint32 ids = 1;
}

// 列表 权限 resources响应。
message ListPermissionResourcesResponse {
  // resources。
  map<int32, PermissionResourceIds> resources = 1;
}
