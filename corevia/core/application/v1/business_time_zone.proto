syntax = "proto3";

package core.application.v1;

import "google/protobuf/empty.proto";

// BusinessTimeZoneService 暴露平台唯一的固定业务日历。
service BusinessTimeZoneService {
  // Get 返回平台拥有的 IANA 业务时区。
  rpc Get(google.protobuf.Empty) returns (BusinessTimeZone) {}
}

// BusinessTimeZone 描述平台的固定业务日历。
message BusinessTimeZone {
  // Canonical IANA time zone name.
  string iana_name = 1;
}
