syntax = "proto3";

package core.authentication.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "common/pagination/v1/pagination.proto";

// 登录策略管理服务
service LoginPolicyService {
  // 查询登录策略列表
  rpc List (common.pagination.v1.PagingRequest) returns (ListLoginPolicyResponse) {}

  // 统计登录策略数量
  rpc Count (common.pagination.v1.PagingRequest) returns (CountLoginPolicyResponse) {}

  // 查询登录策略详情
  rpc Get (GetLoginPolicyRequest) returns (LoginPolicy) {}

  // 创建登录策略
  rpc Create (CreateLoginPolicyRequest) returns (google.protobuf.Empty) {}

  // 更新登录策略
  rpc Update (UpdateLoginPolicyRequest) returns (google.protobuf.Empty) {}

  // 删除登录策略
  rpc Delete (DeleteLoginPolicyRequest) returns (google.protobuf.Empty) {}
}

// 登录策略
message LoginPolicy {
  // 登录策略类型
  enum Type {
    // 未知。
    LOGIN_RESTRICTION_TYPE_UNSPECIFIED = 0; // 未知

    // 黑名单。
    BLACKLIST = 1; // 黑名单
    // 白名单。
    WHITELIST = 2; // 白名单
  }

  // 登录策略方式
  enum Method {
    // 未知。
    LOGIN_RESTRICTION_METHOD_UNSPECIFIED = 0; // 未知

    // IP地址限制。
    IP = 1; // IP地址限制
    // MAC地址限制，绑定设备的MAC地址。
    MAC = 2; // MAC地址限制，绑定设备的MAC地址。
    // 地区限制，根据地理位置（如国家、城市）限制登录。
    REGION = 3; // 地区限制，根据地理位置（如国家、城市）限制登录。
    // 时间限制，限制登录的时间段，例如只允许工作时间登录。
    TIME = 4; // 时间限制，限制登录的时间段，例如只允许工作时间登录。
    // 设备限制，限制登录设备的类型（如PC、手机）或特定设备ID。
    DEVICE = 5; // 设备限制，限制登录设备的类型（如PC、手机）或特定设备ID。
  }

  // ID。
  optional uint32 id = 1 [ (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "登录策略ID"
    }]; // 登录策略ID

  // 目标用户ID。
  optional uint32 target_id = 2 [ (gnostic.openapi.v3.property) = {
      description: "目标用户ID"
    }]; // 目标用户ID

  // 限制类型。
  optional Type type = 3 [ (gnostic.openapi.v3.property) = {
      description: "限制类型"
    }]; // 限制类型

  // 限制方式。
  optional Method method = 4 [ (gnostic.openapi.v3.property) = {
      description: "限制方式"
    }]; // 限制方式

  // 限制值（如IP地址、MAC地址或地区代码）。
  optional string value = 5 [ (gnostic.openapi.v3.property) = {
      description: "限制值（如IP地址、MAC地址或地区代码）"
    }]; // 限制值（如IP地址、MAC地址或地区代码）

  // 限制原因。
  optional string reason = 6 [ (gnostic.openapi.v3.property) = { description: "限制原因" }]; // 限制原因

  // AppID，0代表系统全局角色。
  optional uint32 app_id = 40 [ (gnostic.openapi.v3.property) = {description: "AppID，0代表系统全局角色"}];  // AppID，0代表系统全局角色
  // App名称。
  optional string app_name = 41 [ (gnostic.openapi.v3.property) = {description: "App名称"}];  // App名称

  // 创建者用户ID。
  optional uint32 created_by = 100 [ (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  // 更新者用户ID。
  optional uint32 updated_by = 101 [ (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  // 删除者用户ID。
  optional uint32 deleted_by = 102 [ (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200 [ (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201 [ (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  // 删除时间。
  optional google.protobuf.Timestamp deleted_at = 202 [ (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询登录策略列表 - 回应
message ListLoginPolicyResponse {
  // 列表项。
  repeated LoginPolicy items = 1;
  // 总数。
  uint64 total = 2;
}

// 查询登录策略详情 - 请求
message GetLoginPolicyRequest {
  // GetLoginPolicyRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [ (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  // 视图字段过滤器，用于控制返回的字段。
  optional google.protobuf.FieldMask view_mask = 100 [ (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }]; // 视图字段过滤器，用于控制返回的字段
}

// 创建登录策略 - 请求
message CreateLoginPolicyRequest {
  // 数据。
  LoginPolicy data = 1;
}

// 更新登录策略 - 请求
message UpdateLoginPolicyRequest {
  // ID。
  uint32 id = 1;

  // 数据。
  LoginPolicy data = 2;

  // 要更新的字段列表。
  google.protobuf.FieldMask update_mask = 3 [ (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    }]; // 要更新的字段列表

}

// 删除登录策略 - 请求
message DeleteLoginPolicyRequest {
  // DeleteLoginPolicyRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [ (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }
}

// 数量 登录 策略响应。
message CountLoginPolicyResponse {
  // 数量。
  uint64 count = 1;
}
