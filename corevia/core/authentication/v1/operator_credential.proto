syntax = "proto3";

package core.authentication.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

import "common/pagination/v1/pagination.proto";

// 后台人员认证服务
service OperatorCredentialService {
  // 查询列表
  rpc List (common.pagination.v1.PagingRequest) returns (ListOperatorCredentialResponse) {}

  // 统计数量
  rpc Count (common.pagination.v1.PagingRequest) returns (CountOperatorCredentialResponse) {}

  // 查询
  rpc Get (GetOperatorCredentialRequest) returns (OperatorCredential) {}
  // 获取by identifier。
  rpc GetByIdentifier (GetOperatorCredentialByIdentifierRequest) returns (OperatorCredential) {}

  // 验证凭证
  rpc VerifyCredential (VerifyCredentialRequest) returns (VerifyCredentialResponse) {}

  // 修改凭证
  rpc ChangeCredential (ChangeCredentialRequest) returns (google.protobuf.Empty) {}

}

// 后台人员凭证
message OperatorCredential {
  // 身份类型
  enum IdentityType {
    // 后台人员名。
    USERNAME = 0; // 后台人员名
    // 后台人员ID。
    USERID = 1; // 后台人员ID
    // 邮箱地址。
    EMAIL = 2; // 邮箱地址
    // 手机号。
    PHONE = 3; // 手机号

    // 通用的外部/第三方身份类型
    SOCIAL_OAUTH = 100;    // 社交平台 OAuth 认证
    // 企业单点登录 (SAML/OIDC/AD)。
    ENTERPRISE_SSO = 200;  // 企业单点登录 (SAML/OIDC/AD)
    // API 密钥 (用于服务间认证等)。
    IDENTITY_API_KEY = 300;         // API 密钥 (用于服务间认证等)
    // 设备标识符。
    DEVICE_ID = 400;       // 设备标识符

    // 可扩展/自定义
    IDENTITY_CUSTOM = 1000;
    // identity reserved for future。
    IDENTITY_RESERVED_FOR_FUTURE = 10000;
  }

  // 凭证类型
  enum CredentialType {
    // 未指定。
    TYPE_UNSPECIFIED = 0;

    // 密码类
    PASSWORD_HASH = 1;

    // API / 静态密钥
    API_KEY = 10;
    // API secret。
    API_SECRET = 11;

    // 访问/刷新令牌
    ACCESS_TOKEN = 20;
    // refresh 令牌。
    REFRESH_TOKEN = 21;
    // jwt。
    JWT = 22;

    // OAuth / Social
    OAUTH_TOKEN = 30;
    // OAuth authorization 编码。
    OAUTH_AUTHORIZATION_CODE = 31;
    // OAuth client credentials。
    OAUTH_CLIENT_CREDENTIALS = 32;

    // OTP / 一次性密码与 MFA
    OTP = 40;
    // totp。
    TOTP = 41;
    // sms otp。
    SMS_OTP = 42;
    // email otp。
    EMAIL_OTP = 43;

    // 设备 / 硬件 / 软件令牌
    HARDWARE_TOKEN = 50;
    // software 令牌。
    SOFTWARE_TOKEN = 51;
    // security key。
    SECURITY_KEY = 52;

    // 生物识别
    BIOMETRIC = 60;
    // biometric 令牌。
    BIOMETRIC_TOKEN = 61;

    // SSO / 断言
    SSO_TOKEN = 70;
    // saml assertion。
    SAML_ASSERTION = 71;
    // openid connect ID 令牌。
    OPENID_CONNECT_ID_TOKEN = 72;

    // 临时 / 会话类
    SESSION_COOKIE = 80;
    // temporary 凭证。
    TEMPORARY_CREDENTIAL = 81;

    // 其他 / 自定义
    CUSTOM = 200;
    // reserved for future。
    RESERVED_FOR_FUTURE = 1000;
  }

  // 后台人员凭证状态
  enum Status {
    // 凭证被禁用，后台人员无法使用该凭证进行认证（如账号被冻结）。
    DISABLED = 0; // 凭证被禁用，后台人员无法使用该凭证进行认证（如账号被冻结）。
    // 凭证有效，后台人员可正常使用该凭证登录或注册。
    ENABLED = 1; // 凭证有效，后台人员可正常使用该凭证登录或注册。
    // 凭证已过期（如临时凭证超期）。
    EXPIRED = 2; // 凭证已过期（如临时凭证超期）。
    // 凭证未验证（需后台人员完成验证流程后才能生效）。
    UNVERIFIED = 3; // 凭证未验证（需后台人员完成验证流程后才能生效）。
    // 凭证已删除（逻辑删除，非物理删除，保留审计记录）。
    REMOVED = 4; // 凭证已删除（逻辑删除，非物理删除，保留审计记录）。
    // 凭证被锁定（通常因多次错误尝试触发安全机制）。
    BLOCKED = 5; // 凭证被锁定（通常因多次错误尝试触发安全机制）。
    // 临时凭证（仅在特定时间段内有效）。
    TEMPORARY = 6; // 临时凭证（仅在特定时间段内有效）。
  }

  // 主键ID。
  uint32 id = 1; // 主键ID

  // 关联主表的后台人员ID。
  optional uint32 operator_id = 2 [ (gnostic.openapi.v3.property) = {description: "关联主表的后台人员ID"}];  // 关联主表的后台人员ID
  // AppID。
  optional uint32 app_id = 3 [ (gnostic.openapi.v3.property) = {description: "AppID"}]; // AppID

  // 认证方式类型。
  optional IdentityType identity_type = 10 [ (gnostic.openapi.v3.property) = {description: "认证方式类型，如后台人员名+密码、邮箱+密码、手机号+验证码、第三方平台认证等"}]; // 认证方式类型
  // 身份唯一标识符。
  optional string identifier = 11 [ (gnostic.openapi.v3.property) = {description: "身份唯一标识符，如果是密码登录，则是后台人员名；如果是邮箱登录，则是邮箱地址；如果是手机号登录，则是手机号；如果是第三方平台登录，则是第三方平台的唯一ID（如微信的OpenID）"}]; // 身份唯一标识符

  // 凭证类型。
  optional CredentialType credential_type = 20 [ (gnostic.openapi.v3.property) = {description: "凭证类型，如加密密码、访问令牌、刷新令牌等"}]; // 凭证类型
  // 凭证。
  optional string credential = 21 [ (gnostic.openapi.v3.property) = {description: "凭证，如果是密码登录，则是密码的hash值；如果是邮箱登录，则是邮箱的验证码；如果是手机号登录，则是手机号的验证码；如果是第三方平台登录，则是第三方平台的access_token"}]; // 凭证

  // 是否主认证方式。
  optional bool is_primary = 30 [ (gnostic.openapi.v3.property) = { description: "是否主认证方式，如果后台人员同时绑定了邮箱和手机号，那么可以指定邮箱为主要认证方式。" }]; // 是否主认证方式

  // 凭证状态。
  optional Status status = 31 [ (gnostic.openapi.v3.property) = { description: "凭证状态" }]; // 凭证状态

  // 扩展信息。
  optional string extra_info = 32 [ (gnostic.openapi.v3.property) = { description: "扩展信息，如果是第三方平台认证，可以记录第三方平台的后台人员信息。" }]; // 扩展信息

  // 第三方平台标识（如 `google`, `wechat`），当 identity_type 为 SOCIAL_OAUTH/ENTERPRISE_SSO 时使用。
  optional string provider = 33 [ (gnostic.openapi.v3.property) = { description: "第三方平台标识（如 google, wechat）" }];   // 第三方平台标识（如 `google`, `wechat`），当 identity_type 为 SOCIAL_OAUTH/ENTERPRISE_SSO 时使用

  // 第三方平台的账号唯一ID（如 OpenID / unionid / sub）。
  optional string provider_account_id = 34 [ (gnostic.openapi.v3.property) = { description: "第三方平台的账号唯一ID" }]; // 第三方平台的账号唯一ID（如 OpenID / unionid / sub）

  // 创建者后台人员ID。
  optional uint32 created_by = 100 [ (gnostic.openapi.v3.property) = {description: "创建者后台人员ID"}]; // 创建者后台人员ID
  // 更新者后台人员ID。
  optional uint32 updated_by = 101 [ (gnostic.openapi.v3.property) = {description: "更新者后台人员ID"}]; // 更新者后台人员ID

  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200 [ (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201 [ (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  // 删除时间。
  optional google.protobuf.Timestamp deleted_at = 202 [ (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询列表 - 答复
message ListOperatorCredentialResponse {
  // 列表项。
  repeated OperatorCredential items = 1;
  // 总数。
  uint64 total = 2;
}

// 查询 - 请求
message GetOperatorCredentialRequest {
  // GetOperatorCredentialRequest 使用以下一种查询表达式。
  oneof query_by {
    // ID。
    uint32 id = 1 [ (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  // 视图字段过滤器，用于控制返回的字段。
  optional google.protobuf.FieldMask view_mask = 100 [ (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }]; // 视图字段过滤器，用于控制返回的字段
}

// 查询 - 请求
message GetOperatorCredentialByIdentifierRequest {
  // 身份类型。
  OperatorCredential.IdentityType identity_type = 1 [ (gnostic.openapi.v3.property) = {description: "身份类型"}]; // 身份类型

  // 身份唯一标识符。
  string identifier = 2 [ (gnostic.openapi.v3.property) = {description: "身份唯一标识符"}]; // 身份唯一标识符
}

// 验证凭证 - 请求
message VerifyCredentialRequest {
  // 身份类型。
  OperatorCredential.IdentityType identity_type = 1 [ (gnostic.openapi.v3.property) = {description: "身份类型"}]; // 身份类型

  // 身份唯一标识符。
  string identifier = 2 [ (gnostic.openapi.v3.property) = {description: "身份唯一标识符"}]; // 身份唯一标识符

  // 凭证。
  string credential = 3 [ (gnostic.openapi.v3.property) = {description: "凭证"}]; // 凭证

  // 是否需要解码。
  bool need_decrypt = 4 [ (gnostic.openapi.v3.property) = {description: "是否需要解码"}]; // 是否需要解码
}
// 验证凭证 - 答复
message VerifyCredentialResponse {
  // 是否成功。
  bool success = 1;
}

// 修改凭证 - 请求
message ChangeCredentialRequest {
  // operator_id 标识关联的后台 Operator。
  uint32 operator_id = 1 [ (gnostic.openapi.v3.property) = {description: "后台人员ID"}];

  // app_id 限定 ChangeCredential 所属 App；UNSPECIFIED 不表示跨 App。
  uint32 app_id = 2 [ (gnostic.openapi.v3.property) = {description: "身份所属AppID"}];

  // 旧凭证。
  string old_credential = 3 [ (gnostic.openapi.v3.property) = {description: "旧凭证"}]; // 旧凭证

  // 新凭证。
  string new_credential = 4 [ (gnostic.openapi.v3.property) = {description: "新凭证"}]; // 新凭证

}

// 数量 后台人员 凭证响应。
message CountOperatorCredentialResponse {
  // 数量。
  uint64 count = 1;
}
