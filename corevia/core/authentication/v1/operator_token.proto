syntax = "proto3";

package core.authentication.v1;

import "gnostic/openapi/v3/annotations.proto";

import "core/operator/v1/types.proto";

// 后台人员令牌载体
message OperatorTokenPayload {
  // 后台人员ID。
  uint32 operator_id = 1 [ (gnostic.openapi.v3.property) = {
      description: "后台人员ID"
    }]; // 后台人员ID

  // 客户端ID。
  optional string client_id = 3 [ (gnostic.openapi.v3.property) = {
      description: "客户端ID"
    }]; // 客户端ID

  // 设备ID。
  optional string device_id = 4 [ (gnostic.openapi.v3.property) = {
      description: "设备ID"
    }]; // 设备ID

  // 用户名。
  optional string username = 5 [ (gnostic.openapi.v3.property) = {
      description: "用户名"
    }]; // 用户名

  // 用户角色码列表。
  repeated string roles = 10 [ (gnostic.openapi.v3.property) = {
      description: "用户角色码列表"
    }]; // 用户角色码列表

  // 数据权限范围。
  optional core.operator.v1.DataScope data_scope = 11 [ (gnostic.openapi.v3.property) = {
      description: "数据权限范围"
    }]; // 数据权限范围

  // 是否平台超级管理员。
  optional bool is_platform_admin = 20 [ (gnostic.openapi.v3.property) = {
      description: "是否平台超级管理员"
    }]; // 是否平台超级管理员

  // 令牌唯一标识(JWT ID)。
  optional string jti = 100 [ (gnostic.openapi.v3.property) = {
      description: "令牌唯一标识(JWT ID)"
    }]; // 令牌唯一标识(JWT ID)
}
