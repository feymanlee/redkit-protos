syntax = "proto3";

package support.governance.v1;

import "common/pagination/v1/pagination.proto";
import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// GovernanceOperationType identifies a controlled Support administration action.
enum GovernanceOperationType {
  // 未提供有效取值；调用方不得据此推断业务状态。
  GOVERNANCE_OPERATION_TYPE_UNSPECIFIED = 0;
  // GOVERNANCE_OPERATION_TYPE_FILE_REVOKE 选择 FILE_REVOKE 业务类型。
  GOVERNANCE_OPERATION_TYPE_FILE_REVOKE = 1;
  // GOVERNANCE_OPERATION_TYPE_FILE_PUBLISH_STANDALONE 选择 FILE_PUBLISH_STANDALONE 业务类型。
  GOVERNANCE_OPERATION_TYPE_FILE_PUBLISH_STANDALONE = 2;
  // GOVERNANCE_OPERATION_TYPE_FILE_TASK_RETRY 选择 FILE_TASK_RETRY 业务类型。
  GOVERNANCE_OPERATION_TYPE_FILE_TASK_RETRY = 3;
  // GOVERNANCE_OPERATION_TYPE_FILE_RECONCILIATION_CREATE 选择 FILE_RECONCILIATION_CREATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_FILE_RECONCILIATION_CREATE = 4;
  // GOVERNANCE_OPERATION_TYPE_CONFIGURATION_DRAFT_CREATE 选择 CONFIGURATION_DRAFT_CREATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_CONFIGURATION_DRAFT_CREATE = 5;
  // GOVERNANCE_OPERATION_TYPE_CONFIGURATION_CHANNEL_REVISION_CREATE 选择 CONFIGURATION_CHANNEL_REVISION_CREATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_CONFIGURATION_CHANNEL_REVISION_CREATE = 6;
  // GOVERNANCE_OPERATION_TYPE_CONFIGURATION_TEMPLATE_REVISION_CREATE 选择 CONFIGURATION_TEMPLATE_REVISION_CREATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_CONFIGURATION_TEMPLATE_REVISION_CREATE = 7;
  // GOVERNANCE_OPERATION_TYPE_CONFIGURATION_DRAFT_PREFLIGHT 选择 CONFIGURATION_DRAFT_PREFLIGHT 业务类型。
  GOVERNANCE_OPERATION_TYPE_CONFIGURATION_DRAFT_PREFLIGHT = 8;
  // GOVERNANCE_OPERATION_TYPE_CONFIGURATION_DRAFT_DISCARD 选择 CONFIGURATION_DRAFT_DISCARD 业务类型。
  GOVERNANCE_OPERATION_TYPE_CONFIGURATION_DRAFT_DISCARD = 9;
  // GOVERNANCE_OPERATION_TYPE_CONFIGURATION_VERIFICATION_POLICY_UPDATE 选择 CONFIGURATION_VERIFICATION_POLICY_UPDATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_CONFIGURATION_VERIFICATION_POLICY_UPDATE = 10;
  // GOVERNANCE_OPERATION_TYPE_DELIVERY_PROBE_EXECUTE 选择 DELIVERY_PROBE_EXECUTE 业务类型。
  GOVERNANCE_OPERATION_TYPE_DELIVERY_PROBE_EXECUTE = 11;
  // GOVERNANCE_OPERATION_TYPE_CONFIGURATION_RELEASE_ACTIVATE 选择 CONFIGURATION_RELEASE_ACTIVATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_CONFIGURATION_RELEASE_ACTIVATE = 12;
  // GOVERNANCE_OPERATION_TYPE_CONFIGURATION_RELEASE_ROLLBACK 选择 CONFIGURATION_RELEASE_ROLLBACK 业务类型。
  GOVERNANCE_OPERATION_TYPE_CONFIGURATION_RELEASE_ROLLBACK = 13;
  // GOVERNANCE_OPERATION_TYPE_FILE_POLICY_DRAFT_CREATE 选择 FILE_POLICY_DRAFT_CREATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_FILE_POLICY_DRAFT_CREATE = 14;
  // GOVERNANCE_OPERATION_TYPE_FILE_POLICY_DRAFT_PREFLIGHT 选择 FILE_POLICY_DRAFT_PREFLIGHT 业务类型。
  GOVERNANCE_OPERATION_TYPE_FILE_POLICY_DRAFT_PREFLIGHT = 15;
  // GOVERNANCE_OPERATION_TYPE_FILE_POLICY_DRAFT_ACTIVATE 选择 FILE_POLICY_DRAFT_ACTIVATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_FILE_POLICY_DRAFT_ACTIVATE = 16;
  // GOVERNANCE_OPERATION_TYPE_FILE_POLICY_DRAFT_DISCARD 选择 FILE_POLICY_DRAFT_DISCARD 业务类型。
  GOVERNANCE_OPERATION_TYPE_FILE_POLICY_DRAFT_DISCARD = 17;
  // GOVERNANCE_OPERATION_TYPE_STORAGE_PROVIDER_DRAFT_CREATE 选择 STORAGE_PROVIDER_DRAFT_CREATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_STORAGE_PROVIDER_DRAFT_CREATE = 18;
  // GOVERNANCE_OPERATION_TYPE_STORAGE_PROVIDER_DRAFT_PREFLIGHT 选择 STORAGE_PROVIDER_DRAFT_PREFLIGHT 业务类型。
  GOVERNANCE_OPERATION_TYPE_STORAGE_PROVIDER_DRAFT_PREFLIGHT = 19;
  // GOVERNANCE_OPERATION_TYPE_STORAGE_PROVIDER_DRAFT_ACTIVATE 选择 STORAGE_PROVIDER_DRAFT_ACTIVATE 业务类型。
  GOVERNANCE_OPERATION_TYPE_STORAGE_PROVIDER_DRAFT_ACTIVATE = 20;
  // GOVERNANCE_OPERATION_TYPE_STORAGE_PROVIDER_DRAFT_DISCARD 选择 STORAGE_PROVIDER_DRAFT_DISCARD 业务类型。
  GOVERNANCE_OPERATION_TYPE_STORAGE_PROVIDER_DRAFT_DISCARD = 21;
}

// GovernanceTargetType identifies the authoritative resource affected by an action.
enum GovernanceTargetType {
  // 未提供有效取值；调用方不得据此推断业务状态。
  GOVERNANCE_TARGET_TYPE_UNSPECIFIED = 0;
  // GOVERNANCE_TARGET_TYPE_FILE 选择 FILE 业务类型。
  GOVERNANCE_TARGET_TYPE_FILE = 1;
  // GOVERNANCE_TARGET_TYPE_FILE_TASK 选择 FILE_TASK 业务类型。
  GOVERNANCE_TARGET_TYPE_FILE_TASK = 2;
  // GOVERNANCE_TARGET_TYPE_FILE_RECONCILIATION 选择 FILE_RECONCILIATION 业务类型。
  GOVERNANCE_TARGET_TYPE_FILE_RECONCILIATION = 3;
  // 仍处于草稿阶段，尚未对业务生效。
  GOVERNANCE_TARGET_TYPE_CONFIGURATION_DRAFT = 4;
  // GOVERNANCE_TARGET_TYPE_SMS_CHANNEL_REVISION 选择 SMS_CHANNEL_REVISION 业务类型。
  GOVERNANCE_TARGET_TYPE_SMS_CHANNEL_REVISION = 5;
  // GOVERNANCE_TARGET_TYPE_SMS_TEMPLATE_REVISION 选择 SMS_TEMPLATE_REVISION 业务类型。
  GOVERNANCE_TARGET_TYPE_SMS_TEMPLATE_REVISION = 6;
  // GOVERNANCE_TARGET_TYPE_DELIVERY_PROBE 选择 DELIVERY_PROBE 业务类型。
  GOVERNANCE_TARGET_TYPE_DELIVERY_PROBE = 7;
  // GOVERNANCE_TARGET_TYPE_CONFIGURATION_RELEASE 选择 CONFIGURATION_RELEASE 业务类型。
  GOVERNANCE_TARGET_TYPE_CONFIGURATION_RELEASE = 8;
  // GOVERNANCE_TARGET_TYPE_FILE_POLICY_REVISION 选择 FILE_POLICY_REVISION 业务类型。
  GOVERNANCE_TARGET_TYPE_FILE_POLICY_REVISION = 9;
  // GOVERNANCE_TARGET_TYPE_STORAGE_PROVIDER_REVISION 选择 STORAGE_PROVIDER_REVISION 业务类型。
  GOVERNANCE_TARGET_TYPE_STORAGE_PROVIDER_REVISION = 10;
}

// GovernanceResult records the durable outcome of one action attempt.
enum GovernanceResult {
  // 未提供有效取值；调用方不得据此推断业务状态。
  GOVERNANCE_RESULT_UNSPECIFIED = 0;
  // 处理已成功完成。
  GOVERNANCE_RESULT_SUCCEEDED = 1;
  // 处理失败；是否可重试由具体失败原因决定。
  GOVERNANCE_RESULT_FAILED = 2;
  // GOVERNANCE_RESULT_IDEMPOTENT_REPLAY 表示处理结果为 IDEMPOTENT_REPLAY。
  GOVERNANCE_RESULT_IDEMPOTENT_REPLAY = 3;
}

// GovernanceFailureCategory is a safe classification that contains no dependency payload.
enum GovernanceFailureCategory {
  // 未提供有效取值；调用方不得据此推断业务状态。
  GOVERNANCE_FAILURE_CATEGORY_UNSPECIFIED = 0;
  // GOVERNANCE_FAILURE_CATEGORY_NONE 选择 NONE 业务类型。
  GOVERNANCE_FAILURE_CATEGORY_NONE = 1;
  // GOVERNANCE_FAILURE_CATEGORY_INVALID_ARGUMENT 选择 INVALID_ARGUMENT 业务类型。
  GOVERNANCE_FAILURE_CATEGORY_INVALID_ARGUMENT = 2;
  // GOVERNANCE_FAILURE_CATEGORY_NOT_FOUND 选择 NOT_FOUND 业务类型。
  GOVERNANCE_FAILURE_CATEGORY_NOT_FOUND = 3;
  // GOVERNANCE_FAILURE_CATEGORY_CONFLICT 选择 CONFLICT 业务类型。
  GOVERNANCE_FAILURE_CATEGORY_CONFLICT = 4;
  // GOVERNANCE_FAILURE_CATEGORY_FORBIDDEN 选择 FORBIDDEN 业务类型。
  GOVERNANCE_FAILURE_CATEGORY_FORBIDDEN = 5;
  // 当前不可供业务流程选择或使用。
  GOVERNANCE_FAILURE_CATEGORY_DEPENDENCY_UNAVAILABLE = 6;
  // GOVERNANCE_FAILURE_CATEGORY_INTERNAL 选择 INTERNAL 业务类型。
  GOVERNANCE_FAILURE_CATEGORY_INTERNAL = 7;
}

// GovernanceEvent is an immutable, secret-free Support governance fact.
message GovernanceEvent {
  // id 标识关联的 GovernanceEvent。
  uint64 id = 1;
  // app_id 限定 GovernanceEvent 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 2;
  // operator_id 标识关联的后台 Operator。
  uint64 operator_id = 3;
  // operation_type 区分 GovernanceEvent 的业务类型。
  GovernanceOperationType operation_type = 4;
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 5;
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 6;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 7;
  // target_type 区分 GovernanceEvent 的业务类型。
  GovernanceTargetType target_type = 8;
  // target_id 标识关联的 Target。
  string target_id = 9;
  // before_identity 记录治理操作前用于关联资源的稳定身份。
  string before_identity = 10;
  // after_identity 记录治理操作后用于关联资源的稳定身份。
  string after_identity = 11;
  // result 承载 GovernanceEvent 关联的 GovernanceResult。
  GovernanceResult result = 12;
  // failure_category 对失败进行稳定分类，供调用方决定重试或终止。
  GovernanceFailureCategory failure_category = 13;
  // occurred_at 记录 GovernanceEvent 对应业务阶段的时间点。
  google.protobuf.Timestamp occurred_at = 14;
}

// ListGovernanceEventsRequest selects immutable history for one authoritative target.
message ListGovernanceEventsRequest {
  // app_id 限定 ListGovernanceEvents 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1;
  // target_type 区分 ListGovernanceEvents 的业务类型。
  GovernanceTargetType target_type = 2;
  // target_id 标识关联的 Target。
  string target_id = 3;
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 4;
}

// ListGovernanceEventsResponse returns newest-first governance history.
message ListGovernanceEventsResponse {
  // items 包含本次返回或处理的业务条目。
  repeated GovernanceEvent items = 1;
  // total 表示当前查询条件下可见结果的总数。
  uint64 total = 2;
}

// GovernanceService exposes immutable Support governance history.
service GovernanceService {
  // 查询 GovernanceEvent 列表。
  rpc ListGovernanceEvents(ListGovernanceEventsRequest) returns (ListGovernanceEventsResponse);
}
