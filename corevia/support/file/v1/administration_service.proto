// CreateStorageProviderDraftRequest 创建一个不可变 Provider Draft Revision。
message CreateStorageProviderDraftRequest {
  // 非零时在指定历史 Revision 的稳定 Provider 身份下创建下一版。
  uint64 source_revision_id = 2;
  // provider 标识本次能力使用的外部 Provider。
  StorageProvider provider = 3 [(google.api.field_behavior) = REQUIRED];
  // is_default 显式表示 CreateStorageProviderDraft 是否满足该条件。
  bool is_default = 4;
  // enabled 显式表示 CreateStorageProviderDraft 是否满足该条件。
  bool enabled = 5;
  // region 指定号码、服务或业务规则采用的地区。
  string region = 6;
  // endpoint 指定 CreateStorageProviderDraft 访问或跳转使用的目标地址。
  string endpoint = 7;
  // upload_endpoint 指定 CreateStorageProviderDraft 访问或跳转使用的目标地址。
  string upload_endpoint = 8;
  // bucket 标识 Storage Provider 中承载对象的 Bucket。
  string bucket = 9 [(google.api.field_behavior) = REQUIRED];
  // cdn_base_url 指定 CreateStorageProviderDraft 访问或跳转使用的目标地址。
  string cdn_base_url = 10 [(google.api.field_behavior) = REQUIRED];
  // secret_ref 仅引用外部 Secret，不在契约中承载明文密钥。
  string secret_ref = 11 [(google.api.field_behavior) = REQUIRED];
  // provider_options 承载 Provider 的非敏感扩展配置；密钥仅通过 secret reference 提供。
  string provider_options = 12;
  // remark 提供 CreateStorageProviderDraft 的补充说明。
  string remark = 13;
  // operator_id 标识关联的后台 Operator。
  uint64 operator_id = 14 [(google.api.field_behavior) = REQUIRED];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 15 [(google.api.field_behavior) = REQUIRED];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 16 [(google.api.field_behavior) = REQUIRED];
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 17 [(google.api.field_behavior) = REQUIRED];
}

