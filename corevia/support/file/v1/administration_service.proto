syntax = "proto3";

package support.file.v1;

import "common/file/v1/file.proto";
import "common/pagination/v1/pagination.proto";
import "common/v1/common.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "support/file/v1/types.proto";

// GetFileRequest 查询 Support 内部 File 详情。
message GetFileRequest {
  // 具体业务 App。
  // File ID。
  uint64 id = 2;
}

// FileFilter 定义 File 观察条件。
message FileFilter {
  // id 标识关联的 FileFilter。
  uint64 id = 1;
  // purpose 指定 FileFilter 数据或能力的预期用途。
  common.file.v1.FilePurpose purpose = 2;
  // owner_type 区分 FileFilter 的业务类型。
  common.file.v1.FileOwnerType owner_type = 3;
  // owner_id 标识关联的 Owner。
  uint64 owner_id = 4;
  // status 表示 FileFilter 当前可观察的生命周期状态。
  common.file.v1.FileStatus status = 5;
  // session_no 是 FileFilter 对外关联与审计使用的业务编号。
  string session_no = 6;
  // created_from 指定 FileFilter 查询或生效区间的起始边界。
  google.protobuf.Timestamp created_from = 7;
  // created_to 指定 FileFilter 查询或生效区间的结束边界。
  google.protobuf.Timestamp created_to = 8;
}

// ListFilesRequest 查询 File。
message ListFilesRequest {
  // filter 限定本次查询采用的筛选条件。
  FileFilter filter = 2;
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 3;
}

// ListFilesResponse 返回 File 列表。
message ListFilesResponse {
  // File 项。
  repeated File items = 1;
  // 总数。
  uint64 total = 2;
}

// UploadSessionFilter 定义 Upload Session 观察条件。
message UploadSessionFilter {
  // session_no 是 UploadSessionFilter 对外关联与审计使用的业务编号。
  string session_no = 1;
  // purpose 指定 UploadSessionFilter 数据或能力的预期用途。
  common.file.v1.FilePurpose purpose = 2;
  // owner_type 区分 UploadSessionFilter 的业务类型。
  common.file.v1.FileOwnerType owner_type = 3;
  // owner_id 标识关联的 Owner。
  uint64 owner_id = 4;
  // provider 标识本次能力使用的外部 Provider。
  StorageProvider provider = 5;
  // status 表示 UploadSessionFilter 当前可观察的生命周期状态。
  UploadSessionStatus status = 6;
  // file_id 标识关联的 File。
  uint64 file_id = 7;
  // created_from 指定 UploadSessionFilter 查询或生效区间的起始边界。
  google.protobuf.Timestamp created_from = 8;
  // created_to 指定 UploadSessionFilter 查询或生效区间的结束边界。
  google.protobuf.Timestamp created_to = 9;
}

// ListUploadSessionsRequest 查询 Upload Session。
message ListUploadSessionsRequest {
  // filter 限定本次查询采用的筛选条件。
  UploadSessionFilter filter = 2;
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 3;
}

// ListUploadSessionsResponse 返回 Upload Session 列表。
message ListUploadSessionsResponse {
  // Session 项。
  repeated UploadSession items = 1;
  // 总数。
  uint64 total = 2;
}

// PublishStandaloneFileRequest 显式发布一个公共资源。
message PublishStandaloneFileRequest {
  // 具体业务 App。
  // File ID。
  uint64 file_id = 2;
  // 后台操作员 ID。
  uint64 operator_id = 3;
  // 幂等操作号。
  string operation_no = 4;
  // 请求链标识。
  string request_id = 5;
  // 必填发布原因。
  string reason = 6;
}

// RevokeFileRequest 永久阻断一个 File 的公共访问。
message RevokeFileRequest {
  // 具体业务 App。
  // File ID。
  uint64 file_id = 2;
  // 后台操作员 ID。
  uint64 operator_id = 3;
  // 必填撤销原因。
  string reason = 4;
  // 幂等操作号。
  string operation_no = 5;
  // 请求链标识。
  string request_id = 6;
}

// ListFileReferencesResponse 返回业务引用投影。
message ListFileReferencesResponse {
  // 引用项。
  repeated FileReference items = 1;
  // 总数。
  uint64 total = 2;
}

// FileReferenceFilter 定义 File Reference 观察条件。
message FileReferenceFilter {
  // file_id 标识关联的 File。
  uint64 file_id = 1;
  // source_context 限定 File Reference 所属的来源业务上下文。
  string source_context = 2;
  // resource_type 区分 FileReferenceFilter 的业务类型。
  string resource_type = 3;
  // resource_id 标识关联的 Resource。
  string resource_id = 4;
  // field_name 提供 FileReferenceFilter 面向展示或识别的名称。
  string field_name = 5;
  // status 表示 FileReferenceFilter 当前可观察的生命周期状态。
  FileReferenceStatus status = 6;
  // created_from 指定 FileReferenceFilter 查询或生效区间的起始边界。
  google.protobuf.Timestamp created_from = 7;
  // created_to 指定 FileReferenceFilter 查询或生效区间的结束边界。
  google.protobuf.Timestamp created_to = 8;
}

// ListFileReferencesRequest 查询业务引用投影。
message ListFileReferencesRequest {
  // filter 限定本次查询采用的筛选条件。
  FileReferenceFilter filter = 2;
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 3;
}

// ListFileEventsResponse 返回不可变审计事件。
message ListFileEventsResponse {
  // 事件项。
  repeated FileEvent items = 1;
  // 总数。
