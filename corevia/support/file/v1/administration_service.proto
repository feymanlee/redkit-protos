// FileAdministrationService 管理 File 配置、审计和治理任务。
service FileAdministrationService {
  // 查询 File 详情。
  rpc GetFile(GetFileRequest) returns (File);
  // 查询 File 列表。
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // 查询 Upload Session 列表。
  rpc ListUploadSessions(ListUploadSessionsRequest) returns (ListUploadSessionsResponse);
  // 独立发布 App 公共资源。
  rpc PublishStandaloneFile(PublishStandaloneFileRequest) returns (File);
  // 永久阻断 File 公共访问。
  rpc RevokeFile(RevokeFileRequest) returns (File);
  // 查询业务引用投影。
  rpc ListFileReferences(ListFileReferencesRequest) returns (ListFileReferencesResponse);
  // 查询不可变审计事件。
  rpc ListFileEvents(ListFileEventsRequest) returns (ListFileEventsResponse);
  // 查询只读历史 Review Attempt。
  rpc ListFileReviewAttempts(ListFileReviewAttemptsRequest) returns (ListFileReviewAttemptsResponse);
  // 创建不可变 Policy Draft Revision。
  rpc CreateFilePolicyDraft(CreateFilePolicyDraftRequest) returns (FilePolicyRevision);
  // 对 Policy Draft Revision 执行结构化预检。
  rpc PreflightFilePolicyDraft(PreflightFilePolicyDraftRequest) returns (FilePolicyPreflight);
  // 激活已通过预检的 Policy Draft Revision。
  rpc ActivateFilePolicyDraft(ActivateFilePolicyDraftRequest) returns (FilePolicyRevision);
  // 丢弃未使用的 Policy Draft Revision。
  rpc DiscardFilePolicyDraft(DiscardFilePolicyDraftRequest) returns (google.protobuf.Empty);
  // 查询不可变 Policy Revision 历史。
  rpc ListFilePolicyRevisions(ListFilePolicyRevisionsRequest) returns (ListFilePolicyRevisionsResponse);
  // 创建不可变 Provider Draft Revision。
  rpc CreateStorageProviderDraft(CreateStorageProviderDraftRequest) returns (StorageProviderRevision);
  // 对 Provider Draft 执行真实能力预检。
  rpc PreflightStorageProviderDraft(PreflightStorageProviderDraftRequest) returns (StorageProviderPreflight);
  // 激活已通过预检的 Provider Draft。
  rpc ActivateStorageProviderDraft(ActivateStorageProviderDraftRequest) returns (StorageProviderRevision);
  // 丢弃未使用的 Provider Draft。
  rpc DiscardStorageProviderDraft(DiscardStorageProviderDraftRequest) returns (google.protobuf.Empty);
  // 查询不可变 Provider Revision 历史。
  rpc ListStorageProviderRevisions(ListStorageProviderRevisionsRequest) returns (ListStorageProviderRevisionsResponse);
  // 创建只读存储对账批次。
  rpc CreateReconciliationBatch(CreateReconciliationBatchRequest) returns (ReconciliationBatch);
  // 查询对账批次。
  rpc ListReconciliationBatches(ListReconciliationBatchesRequest) returns (ListReconciliationBatchesResponse);
  // 查询对账差异。
  rpc ListReconciliationItems(ListReconciliationItemsRequest) returns (ListReconciliationItemsResponse);
  // 查询异步治理任务。
  rpc ListFileTasks(ListFileTasksRequest) returns (ListFileTasksResponse);
  // 重试失败任务。
  rpc RetryFileTask(RetryFileTaskRequest) returns (FileTask);
}
