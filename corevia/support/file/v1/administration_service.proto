  // failure_code 提供机器可判断的处理结果或失败分类。
  string failure_code = 5;
  // occurred_from 指定 FileEventFilter 查询或生效区间的起始边界。
  google.protobuf.Timestamp occurred_from = 6;
  // occurred_to 指定 FileEventFilter 查询或生效区间的结束边界。
  google.protobuf.Timestamp occurred_to = 7;
}

// ListFileEventsRequest 查询不可变 File Event。
message ListFileEventsRequest {
  // filter 限定本次查询采用的筛选条件。
  FileEventFilter filter = 2;
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 3;
}

// FileReviewAttemptFilter 定义历史 Review Attempt 观察条件。
message FileReviewAttemptFilter {
  // file_id 标识关联的 File。
  uint64 file_id = 1;
  // reviewer 标识触发或负责 FileReviewAttemptFilter 对应业务阶段的主体。
  string reviewer = 2;
  // status 表示 FileReviewAttemptFilter 当前可观察的生命周期状态。
  string status = 3;
  // created_from 指定 FileReviewAttemptFilter 查询或生效区间的起始边界。
  google.protobuf.Timestamp created_from = 4;
  // created_to 指定 FileReviewAttemptFilter 查询或生效区间的结束边界。
  google.protobuf.Timestamp created_to = 5;
}

// ListFileReviewAttemptsRequest 查询历史 Review Attempt。
message ListFileReviewAttemptsRequest {
