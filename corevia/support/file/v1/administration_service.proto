// CreateFilePolicyDraftRequest 创建一个不可变 Policy Draft Revision。
message CreateFilePolicyDraftRequest {
  // purpose 指定 CreateFilePolicyDraft 数据或能力的预期用途。
  common.file.v1.FilePurpose purpose = 2 [(google.api.field_behavior) = REQUIRED];
  // enabled 显式表示 CreateFilePolicyDraft 是否满足该条件。
  bool enabled = 3;
  // max_size_bytes 限定 CreateFilePolicyDraft 对应操作允许使用的数量或阈值。
  uint64 max_size_bytes = 4;
  // allowed_content_types 列出上传策略允许接受的 MIME Content-Type。
  repeated string allowed_content_types = 5;
  // remark 提供 CreateFilePolicyDraft 的补充说明。
  string remark = 6;
  // 后台操作员 ID。
  uint64 operator_id = 7 [(google.api.field_behavior) = REQUIRED];
  // 必填治理原因。
  string reason = 8 [(google.api.field_behavior) = REQUIRED];
  // 幂等操作号。
  string operation_no = 9 [(google.api.field_behavior) = REQUIRED];
  // 请求链标识。
  string request_id = 10 [(google.api.field_behavior) = REQUIRED];
}

// PreflightFilePolicyDraftRequest 对一个 Draft Revision 执行结构化预检。
message PreflightFilePolicyDraftRequest {
  // revision_id 标识关联的 Revision。
  uint64 revision_id = 2 [(google.api.field_behavior) = REQUIRED];
  // 后台操作员 ID。
  uint64 operator_id = 3 [(google.api.field_behavior) = REQUIRED];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 4 [(google.api.field_behavior) = REQUIRED];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 5 [(google.api.field_behavior) = REQUIRED];
  // 请求链标识。
  string request_id = 6 [(google.api.field_behavior) = REQUIRED];
}

// ActivateFilePolicyDraftRequest 激活一个已通过预检的 Draft Revision。
message ActivateFilePolicyDraftRequest {
  // revision_id 标识关联的 Revision。
  uint64 revision_id = 2 [(google.api.field_behavior) = REQUIRED];
  // operator_id 标识关联的后台 Operator。
  uint64 operator_id = 3 [(google.api.field_behavior) = REQUIRED];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 4 [(google.api.field_behavior) = REQUIRED];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 5 [(google.api.field_behavior) = REQUIRED];
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 6 [(google.api.field_behavior) = REQUIRED];
}

// DiscardFilePolicyDraftRequest 丢弃一个从未激活或使用的 Draft Revision。
message DiscardFilePolicyDraftRequest {
  // revision_id 标识关联的 Revision。
  uint64 revision_id = 2 [(google.api.field_behavior) = REQUIRED];
  // operator_id 标识关联的后台 Operator。
  uint64 operator_id = 3 [(google.api.field_behavior) = REQUIRED];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 4 [(google.api.field_behavior) = REQUIRED];
