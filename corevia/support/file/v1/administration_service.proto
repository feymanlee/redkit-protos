}

// ListFileReviewAttemptsResponse 返回历史 Review Attempt。
message ListFileReviewAttemptsResponse {
  // items 包含本次返回或处理的业务条目。
  repeated FileReviewAttempt items = 1;
  // total 表示当前查询条件下可见结果的总数。
  uint64 total = 2;
