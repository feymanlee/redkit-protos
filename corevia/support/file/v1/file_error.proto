syntax = "proto3";

package support.file.v1;

import "errors/errors.proto";

// FileErrorReason 定义 File 生命周期错误。
enum FileErrorReason {
  option (errors.default_code) = 500;

  // 请求参数错误。
  BAD_REQUEST = 0 [(errors.code) = 400];
  // File 或相关资源不存在。
  NOT_FOUND = 1 [(errors.code) = 404];
  // 状态、幂等摘要或引用版本冲突。
  CONFLICT = 2 [(errors.code) = 409];
  // 文件大小超过 Purpose 策略。
  FILE_TOO_LARGE = 3 [(errors.code) = 413];
  // 真实媒体格式不受 Purpose 支持。
  UNSUPPORTED_MEDIA_TYPE = 4 [(errors.code) = 415];
  // Upload Session 已过期。
  SESSION_EXPIRED = 5 [(errors.code) = 410];
  // 对象完整性或真实格式校验失败。
  VERIFICATION_FAILED = 6 [(errors.code) = 422];
  // File 尚未达到 READY 状态。
  FILE_NOT_READY = 7 [(errors.code) = 409];
  // App、Purpose 或 Owner 与业务预期不匹配。
  FILE_BINDING_MISMATCH = 8 [(errors.code) = 409];
  // 上传请求或字节额度已耗尽。
  UPLOAD_QUOTA_EXCEEDED = 9 [(errors.code) = 429];
  // 引用事件版本低于当前投影。
  STALE_REFERENCE_VERSION = 10 [(errors.code) = 409];
  // 当前调用没有执行操作所需权限。
  FORBIDDEN = 11 [(errors.code) = 403];
  // 当前 App/Purpose 缺少可用的 Active File Policy Revision。
  FILE_CONFIGURATION_NOT_READY = 12 [(errors.code) = 503];
  // Support 内部错误。
  INTERNAL_SERVER_ERROR = 2000 [(errors.code) = 500];
  // Provider、Redis 或依赖服务暂时不可用。
  SERVICE_UNAVAILABLE = 2300 [(errors.code) = 503];
}
