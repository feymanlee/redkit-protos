syntax = "proto3";

package support.file.v1;

import "common/file/v1/file.proto";
import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "support/file/v1/types.proto";

// GetFileViewRequest 解析一个可安全对外返回的 File View。
message GetFileViewRequest {
  // 具体业务 App。
  // File ID。
  uint64 file_id = 2;
}

// BatchGetFileViewsRequest 批量解析最多一百个 File View。
message BatchGetFileViewsRequest {
  // 具体业务 App。
  // File ID 列表。
  repeated uint64 file_ids = 2;
}

// FileViewResult 表示一个 File ID 的独立解析结果。
message FileViewResult {
  // File ID。
  uint64 file_id = 1;
  // 解析成功时的安全展示对象。
  common.file.v1.FileView view = 2;
  // 解析失败的标准错误原因。
  string error_reason = 3;
  // 适合调用方日志的简短错误信息。
  string error_message = 4;
}

// BatchGetFileViewsResponse 返回逐 File 独立结果。
message BatchGetFileViewsResponse {
  // 与输入 File ID 对应的结果。
  repeated FileViewResult results = 1;
}

// ValidateFileRequest 校验业务字段能否绑定指定 File。
message ValidateFileRequest {
  // 具体业务 App。
  // File ID。
  uint64 file_id = 2;
  // 业务字段要求的 Purpose。
  common.file.v1.FilePurpose expected_purpose = 3;
  // 业务字段要求的 Owner 类型。
  common.file.v1.FileOwnerType expected_owner_type = 4;
  // 业务字段要求的 Owner ID。
  uint64 expected_owner_id = 5;
}

// FileValidationItem 描述批量校验中的一个无身份绑定条件。
message FileValidationItem {
  // file_id 标识关联的 File。
  uint64 file_id = 1;
  // expected_purpose 指定 FileValidationItem 数据或能力的预期用途。
  common.file.v1.FilePurpose expected_purpose = 2;
  // expected_owner_type 区分 FileValidationItem 的业务类型。
  common.file.v1.FileOwnerType expected_owner_type = 3;
  // expected_owner_id 标识关联的 ExpectedOwner。
  uint64 expected_owner_id = 4;
}

// BatchValidateFilesRequest 批量校验最多一百个业务文件绑定。
message BatchValidateFilesRequest {
  // 校验项。
  repeated FileValidationItem items = 1;
}

// FileValidationResult 表示一个 File 的独立校验结果。
message FileValidationResult {
  // File ID。
  uint64 file_id = 1;
  // 是否满足全部绑定条件。
  bool valid = 2;
  // 校验成功时的内部文件描述。
  FileDescriptor descriptor = 3;
  // 校验失败的标准错误原因。
  string error_reason = 4;
  // 简短错误信息。
  string error_message = 5;
}

// BatchValidateFilesResponse 返回逐 File 独立校验结果。
message BatchValidateFilesResponse {
  // 校验结果。
  repeated FileValidationResult results = 1;
}

// CreateFileDownloadAuthorizationRequest requests one short-lived protected-file URL.
message CreateFileDownloadAuthorizationRequest {
  // file_id 标识关联的 File。
  uint64 file_id = 2;
  // expected_purpose 指定 CreateFileDownloadAuthorization 数据或能力的预期用途。
  common.file.v1.FilePurpose expected_purpose = 3;
}

// FileDownloadAuthorization is never persisted by the calling domain.
message FileDownloadAuthorization {
  // file_id 标识关联的 File。
  uint64 file_id = 1;
  // url 指定 FileDownloadAuthorization 访问或跳转使用的目标地址。
  string url = 2;
  // expires_at 指定 FileDownloadAuthorization 失效的时间点。
  google.protobuf.Timestamp expires_at = 3;
}

// IssueProtectedDownloadRequest 为一个已知绑定的受保护 File 签发短期下载地址。
message IssueProtectedDownloadRequest {
  // file_id 标识关联的 File。
  uint64 file_id = 2;
  // expected_purpose 指定 IssueProtectedDownload 数据或能力的预期用途。
  common.file.v1.FilePurpose expected_purpose = 3;
  // expected_owner_type 区分 IssueProtectedDownload 的业务类型。
  common.file.v1.FileOwnerType expected_owner_type = 4;
  // expected_owner_id 标识关联的 ExpectedOwner。
  uint64 expected_owner_id = 5;
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 6;
  // requester_id 标识关联的 Requester。
  uint64 requester_id = 7;
}

// IssueProtectedDownloadResponse 承载 IssueProtectedDownload 的返回结果。
message IssueProtectedDownloadResponse {
  // url 指定 IssueProtectedDownload 访问或跳转使用的目标地址。
  string url = 1;
  // expires_at 指定 IssueProtectedDownload 失效的时间点。
  google.protobuf.Timestamp expires_at = 2;
}

// FileAccessService 提供安全展示解析和业务写入校验。
service FileAccessService {
  // 解析一个 File View。
  rpc GetFileView(GetFileViewRequest) returns (common.file.v1.FileView);
  // 批量解析 File View。
  rpc BatchGetFileViews(BatchGetFileViewsRequest) returns (BatchGetFileViewsResponse);
  // 校验一个业务文件绑定。
  rpc ValidateFile(ValidateFileRequest) returns (FileDescriptor);
  // 批量校验业务文件绑定。
  rpc BatchValidateFiles(BatchValidateFilesRequest) returns (BatchValidateFilesResponse);
  // 为受保护文件签发短期下载地址。
  rpc CreateDownloadAuthorization(CreateFileDownloadAuthorizationRequest) returns (FileDownloadAuthorization);
  // 校验 Purpose、Owner 与状态后签发短期受保护下载地址。
  rpc IssueProtectedDownload(IssueProtectedDownloadRequest) returns (IssueProtectedDownloadResponse);
}
