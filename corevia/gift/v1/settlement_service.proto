syntax = "proto3";

package gift.v1;

import "gift/v1/settlement.proto";

// 礼物结算服务。
service GiftSettlementService {
  // 按 typed filter 分页查询 Settlement Record 快照；只读，不修改结算事实。
  rpc ListGiftSettlementRecords(ListGiftSettlementRecordsRequest) returns (ListGiftSettlementRecordResponse) {}
  // 查询 Settlement Reconciliation Issue。
  rpc ListGiftReconciliationIssues(ListGiftReconciliationIssuesRequest) returns (ListGiftReconciliationIssuesResponse) {}
  // 查询一个 Issue 的普通详情和证据。
  rpc GetGiftReconciliationIssue(GetGiftReconciliationIssueRequest) returns (GiftReconciliationIssue) {}
  // 查询一个 Issue 的完整 Operator 备注和审计详情。
  rpc GetGiftReconciliationIssueAuditDetails(GetGiftReconciliationIssueRequest) returns (GiftReconciliationIssueAuditDetails) {}
  // 确认一个 Issue 并追加调查备注。
  rpc AcknowledgeGiftReconciliationIssue(AcknowledgeGiftReconciliationIssueRequest) returns (GiftReconciliationIssueActionResponse) {}
  // 为一个 Issue 追加调查备注。
  rpc AddGiftReconciliationIssueNote(AddGiftReconciliationIssueNoteRequest) returns (GiftReconciliationIssueActionResponse) {}
  // 对一个 Issue 对应的单笔成功 Send 重新核验 Settlement。
  rpc ReconcileGiftSettlement(ReconcileGiftSettlementRequest) returns (ReconcileGiftSettlementResponse) {}
}
