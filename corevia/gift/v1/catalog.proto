syntax = "proto3";

package gift.v1;

import "gnostic/openapi/v3/annotations.proto";
import "common/v1/common.proto";
import "common/pagination/v1/pagination.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "common/file/v1/file.proto";
import "validate/validate.proto";

// 礼物分类。
message GiftCategory {
  // 分类 ID。
  optional uint32 id = 1;
  // 应用 ID。
  optional uint32 app_id = 2;
  // 分类名称。
  optional string name = 3;
  // 分类编码。
  optional string code = 4;
  // 排序值，越大越靠前。
  optional uint32 sort = 5;
  // 是否启用。
  optional bool enabled = 6;
  // 备注。
  optional string remark = 7;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// 礼物信息。
message Gift {
  // 礼物 ID。
  optional uint32 id = 1;
  // 应用 ID。
  optional uint32 app_id = 2;
  // 分类 ID。
  optional uint32 category_id = 3;
  // 礼物名称。
  optional string name = 4;
  // 礼物编码。
  optional string code = 5;
  // 图标文件 ID。
  optional uint64 icon_file_id = 6;
  // 虚拟币价格。
  optional int64 price = 7 [(gnostic.openapi.v3.property) = {description: "虚拟币价格"}];
  // 是否启用。
  optional bool enabled = 8;
  // 备注。
  optional string remark = 9;
  // 动画资源文件 ID。
  optional uint64 animation_file_id = 10;
  // 排序值，越大越靠前。
  optional uint32 sort = 11;
  // 标签，使用逗号分隔。
  optional string tags = 12;
  // 单次最大赠送数量，0 表示不限制。
  optional uint32 max_quantity = 13;
  // 单用户每日最大赠送数量，0 表示不限制。
  optional uint32 daily_limit = 14;
  // 平台分成比例，万分比。
  optional uint32 platform_rate = 15;
  // 收礼人分成比例，万分比。
  optional uint32 recipient_rate = 16;
  // 上架时间。
  optional google.protobuf.Timestamp online_at = 17;
  // 下架时间。
  optional google.protobuf.Timestamp offline_at = 18;
  // 图标安全展示对象。
  common.file.v1.FileView icon = 19;
  // 动画安全展示对象。
  common.file.v1.FileView animation = 20;
  // 当前非生产 Draft；没有 Draft 时为空。
  GiftDraft draft = 21;
  // 当前立即生效的不可变 Revision；未发布时为空。
  GiftRevision active_revision = 22;
  // Active Revision ID；未发布时为空。
  optional uint64 active_revision_id = 23;
  // 是否曾经发布过 Revision。
  bool has_published = 24;
  // 当前等待 Worker 激活的不可变 Revision；没有排期时为空。
  GiftRevision scheduled_revision = 25;
  // Scheduled Revision ID；没有排期时为空。
  optional uint64 scheduled_revision_id = 26;
  // 当前排期运行状态；没有排期时为空。
  GiftRevisionSchedule schedule = 27;
  // 稳定 Gift 身份当前生命周期，不替代 Revision 的 enabled/window 配置。
  GiftLifecycleStatus lifecycle_status = 28;
  // 当前紧急下线事实；恢复后为空，历史由 Operator Audit 保留。
  GiftEmergencyOffline emergency_offline = 29;
  // 不可逆归档事实；未归档时为空。
  GiftArchive archive = 30;
  // Active Revision 的结构化 Scene Type allowlist；空表示允许当前 App 所有已启用类型。
  repeated string scene_type_codes = 31;
  // 礼物展示等级，取值 COMMON、LUXURY 或 EFFECT。
  optional string gift_tier = 32 [(validate.rules).string = {in: ["COMMON", "LUXURY", "EFFECT"]}];
  // 结构化特效资源清单；空集合表示仅使用 animation 素材。
  repeated GiftEffect effects = 33;
  // App 级陈列位投放；不含房间 Scene ID。
  repeated GiftDisplayPlacement display_placements = 34;
  // 多语言名称与描述；默认 locale 在非空清单中必填。
  repeated GiftLocaleText locales = 35;
  // 礼物目录身份类型，取值 STANDARD 或 COMBO。
  optional string gift_kind = 36 [(validate.rules).string = {in: ["STANDARD", "COMBO"]}];
  // combo_items 列出 COMBO 礼物展开的既有 Gift 与数量；STANDARD 必须为空。
  repeated GiftComboItem combo_items = 37;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// GiftEffect is one structured presentation asset attached to a Gift Draft or immutable Revision.
message GiftEffect {
  // kind 标识特效类型，取值 ANIMATION、COMBO 或 FULL_SCREEN。
  string kind = 1 [(validate.rules).string = {in: ["ANIMATION", "COMBO", "FULL_SCREEN"]}];
  // file_id 标识关联的特效 File。
  uint64 file_id = 2 [(validate.rules).uint64.gt = 0];
  // file_reference_version 锁定本次快照采用的 File 引用版本。
  uint64 file_reference_version = 3;
}

// GiftDisplayPlacement is one App-level merchandising placement on a Gift Draft or immutable Revision.
message GiftDisplayPlacement {
  // slot_code 是稳定陈列位编码，例如 RECOMMENDED、HOT 或 NEW。
  string slot_code = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
  // sort 在同一陈列位内排序，越大越靠前。
  uint32 sort = 2;
  // online_at 是该投放生效时间；为空表示随 Revision 立即可见。
  optional google.protobuf.Timestamp online_at = 3;
  // offline_at 是该投放结束时间；为空表示不自动结束。
  optional google.protobuf.Timestamp offline_at = 4;
}

// GiftLocaleText is one locale-specific gift copy snapshot.
message GiftLocaleText {
  // locale 使用 BCP-47 语言标记，例如 zh-CN 或 en-US。
  string locale = 1 [(validate.rules).string = {min_len: 2, max_len: 35}];
  // name 是该 locale 下的展示名称。
  string name = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
  // description 是该 locale 下的展示描述。
  string description = 3 [(validate.rules).string = {max_len: 500}];
}

// GiftComboItem is one existing Gift identity and quantity inside a COMBO gift revision.
message GiftComboItem {
  // gift_id 标识被组合的既有 Gift。
  uint32 gift_id = 1 [(validate.rules).uint32.gt = 0];
  // quantity 是该组件在组合中的数量。
  uint32 quantity = 2 [(validate.rules).uint32.gt = 0];
}

// GiftLifecycleStatus 刻画对应资源的生命周期状态。
enum GiftLifecycleStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  GIFT_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  // 尚未发布，不对新的业务流量生效。
  GIFT_LIFECYCLE_STATUS_UNPUBLISHED = 1;
  // 当前已生效并可用于业务处理。
  GIFT_LIFECYCLE_STATUS_ACTIVE = 2;
  // GIFT_LIFECYCLE_STATUS_EMERGENCY_OFFLINE 表示资源处于对应业务阶段。
  GIFT_LIFECYCLE_STATUS_EMERGENCY_OFFLINE = 3;
  // 已退出使用，仅保留历史查询能力。
  GIFT_LIFECYCLE_STATUS_ARCHIVED = 4;
}

// GiftEmergencyOffline 记录 Gift 紧急下线操作及其审计信息。
message GiftEmergencyOffline {
  // occurred_at 记录 GiftEmergencyOffline 对应业务阶段的时间点。
  google.protobuf.Timestamp occurred_at = 1;
  // operator_id 标识关联的后台 Operator。
  uint32 operator_id = 2;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3;
  // active_revision_id 标识关联的 ActiveRevision。
  uint64 active_revision_id = 4;
}

// GiftArchive 记录一次 Gift Archive 操作及其审计信息。
message GiftArchive {
  // occurred_at 记录 GiftArchive 对应业务阶段的时间点。
  google.protobuf.Timestamp occurred_at = 1;
  // operator_id 标识关联的后台 Operator。
  uint32 operator_id = 2;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3;
}

// 礼物可编辑字段，不携带资源身份或服务端投影。
message GiftPatch {
  // category_id 标识关联的 Category。
  optional uint32 category_id = 1;
  // name 提供 GiftPatch 面向展示或识别的名称。
  optional string name = 2;
  // icon_file_id 标识关联的 IconFile。
  optional uint64 icon_file_id = 3;
  // price 以对应 currency 的最小货币单位表示，不使用浮点数。
  optional int64 price = 4 [(gnostic.openapi.v3.property) = {description: "虚拟币价格"}];
  // enabled 显式表示 GiftPatch 是否满足该条件。
  optional bool enabled = 5;
  // remark 提供 GiftPatch 的补充说明。
  optional string remark = 6;
  // animation_file_id 标识关联的 AnimationFile。
  optional uint64 animation_file_id = 7;
  // sort 指定结果排序规则。
  optional uint32 sort = 8;
  // tags 携带用于检索和治理的业务标签。
  optional string tags = 9;
  // scene_type_codes 列出 Gift 可使用的 Scene Type Code。
  repeated string scene_type_codes = 10;
  // max_quantity 限定 GiftPatch 对应操作允许使用的数量或阈值。
  optional uint32 max_quantity = 11;
  // daily_limit 限定 GiftPatch 对应操作允许使用的数量或阈值。
  optional uint32 daily_limit = 12;
  // platform_rate 以基点表示平台的结算比例，一万基点等于 100%。
  optional uint32 platform_rate = 13;
  // recipient_rate 以基点表示收礼方的结算比例，一万基点等于 100%。
  optional uint32 recipient_rate = 14;
  // online_at 记录 GiftPatch 对应业务阶段的时间点。
  optional google.protobuf.Timestamp online_at = 15;
  // offline_at 记录 GiftPatch 对应业务阶段的时间点。
  optional google.protobuf.Timestamp offline_at = 16;
  // gift_tier 设置礼物展示等级，取值 COMMON、LUXURY 或 EFFECT。
  optional string gift_tier = 17 [(validate.rules).string = {in: ["COMMON", "LUXURY", "EFFECT"]}];
  // effects 设置结构化特效资源清单；提供时整体替换 Draft 中的既有清单。
  repeated GiftEffect effects = 18;
  // display_placements 设置 App 级陈列位投放；提供时整体替换。
  repeated GiftDisplayPlacement display_placements = 19;
  // locales 设置多语言文案；提供时整体替换，默认 locale 必填。
  repeated GiftLocaleText locales = 20;
  // gift_kind 设置目录身份类型，取值 STANDARD 或 COMBO。
  optional string gift_kind = 21 [(validate.rules).string = {in: ["STANDARD", "COMBO"]}];
  // combo_items 设置 COMBO 组件清单；提供时整体替换。
  repeated GiftComboItem combo_items = 22;
}

// GiftCreateData creates one stable identity and its initial non-production Draft.
message GiftCreateData {
  // code 提供 GiftCreateData 对外稳定使用的业务编码。
  string code = 1;
  // draft 承载 GiftCreateData 关联的 GiftPatch。
  GiftPatch draft = 2;
}

// GiftDraft is the mutable, non-production catalog working state.
message GiftDraft {
  // gift_id 标识关联的 Gift。
  uint32 gift_id = 1;
  // app_id 限定 GiftDraft 所属 App；UNSPECIFIED 不表示跨 App。
  uint32 app_id = 2;
  // category_id 标识关联的 Category。
  uint32 category_id = 3;
  // name 提供 GiftDraft 面向展示或识别的名称。
  string name = 4;
  // icon_file_id 标识关联的 IconFile。
  uint64 icon_file_id = 5;
  // icon_reference_version 标识 GiftDraft 所采用的契约或资源版本。
  uint64 icon_reference_version = 6;
  // animation_file_id 标识关联的 AnimationFile。
  uint64 animation_file_id = 7;
  // animation_reference_version 标识 GiftDraft 所采用的契约或资源版本。
  uint64 animation_reference_version = 8;
  // price 以对应 currency 的最小货币单位表示，不使用浮点数。
  int64 price = 9;
  // enabled 显式表示 GiftDraft 是否满足该条件。
  bool enabled = 10;
  // sort 指定结果排序规则。
  uint32 sort = 11;
  // tags 携带用于检索和治理的业务标签。
  string tags = 12;
  // scene_type_codes 列出 Gift 可使用的 Scene Type Code。
  repeated string scene_type_codes = 13;
  // max_quantity 限定 GiftDraft 对应操作允许使用的数量或阈值。
  uint32 max_quantity = 14;
  // daily_limit 限定 GiftDraft 对应操作允许使用的数量或阈值。
  uint32 daily_limit = 15;
  // platform_rate 以基点表示平台的结算比例，一万基点等于 100%。
  uint32 platform_rate = 16;
  // recipient_rate 以基点表示收礼方的结算比例，一万基点等于 100%。
  uint32 recipient_rate = 17;
  // online_at 记录 GiftDraft 对应业务阶段的时间点。
  optional google.protobuf.Timestamp online_at = 18;
  // offline_at 记录 GiftDraft 对应业务阶段的时间点。
  optional google.protobuf.Timestamp offline_at = 19;
  // remark 提供 GiftDraft 的补充说明。
  string remark = 20;
  // icon 承载 GiftDraft 关联的 FileView。
  common.file.v1.FileView icon = 21;
  // animation 承载 GiftDraft 关联的 FileView。
  common.file.v1.FileView animation = 22;
  // 礼物展示等级，取值 COMMON、LUXURY 或 EFFECT。
  string gift_tier = 23 [(validate.rules).string = {in: ["COMMON", "LUXURY", "EFFECT"]}];
  // effects 列出 Draft 当前配置的结构化特效资源。
  repeated GiftEffect effects = 24;
  // display_placements 列出 Draft 当前配置的 App 级陈列位投放。
  repeated GiftDisplayPlacement display_placements = 25;
  // locales 列出 Draft 当前配置的多语言文案。
  repeated GiftLocaleText locales = 26;
  // 礼物目录身份类型，取值 STANDARD 或 COMBO。
  string gift_kind = 27 [(validate.rules).string = {in: ["STANDARD", "COMBO"]}];
  // combo_items 列出 COMBO 礼物的组件清单。
  repeated GiftComboItem combo_items = 28;
  // created_at 记录 GiftDraft 的创建时间。
  google.protobuf.Timestamp created_at = 200;
  // updated_at 记录 GiftDraft 最近一次更新的时间。
  google.protobuf.Timestamp updated_at = 201;
}

// GiftRevision is an immutable published configuration snapshot.
message GiftRevision {
  // id 标识关联的 GiftRevision。
  uint64 id = 1;
  // gift_id 标识关联的 Gift。
  uint32 gift_id = 2;
  // app_id 限定 GiftRevision 所属 App；UNSPECIFIED 不表示跨 App。
  uint32 app_id = 3;
  // revision_no 是 GiftRevision 对外关联与审计使用的业务编号。
  uint32 revision_no = 4;
  // category_id 标识关联的 Category。
  uint32 category_id = 5;
  // name 提供 GiftRevision 面向展示或识别的名称。
  string name = 6;
  // icon_file_id 标识关联的 IconFile。
  uint64 icon_file_id = 7;
  // icon_reference_version 标识 GiftRevision 所采用的契约或资源版本。
  uint64 icon_reference_version = 8;
  // animation_file_id 标识关联的 AnimationFile。
  uint64 animation_file_id = 9;
  // animation_reference_version 标识 GiftRevision 所采用的契约或资源版本。
  uint64 animation_reference_version = 10;
  // price 以对应 currency 的最小货币单位表示，不使用浮点数。
  int64 price = 11;
  // enabled 显式表示 GiftRevision 是否满足该条件。
  bool enabled = 12;
  // sort 指定结果排序规则。
  uint32 sort = 13;
  // tags 携带用于检索和治理的业务标签。
  string tags = 14;
  // scene_type_codes 列出 Gift 可使用的 Scene Type Code。
  repeated string scene_type_codes = 15;
  // max_quantity 限定 GiftRevision 对应操作允许使用的数量或阈值。
  uint32 max_quantity = 16;
  // daily_limit 限定 GiftRevision 对应操作允许使用的数量或阈值。
  uint32 daily_limit = 17;
  // platform_rate 以基点表示平台的结算比例，一万基点等于 100%。
  uint32 platform_rate = 18;
  // recipient_rate 以基点表示收礼方的结算比例，一万基点等于 100%。
  uint32 recipient_rate = 19;
  // online_at 记录 GiftRevision 对应业务阶段的时间点。
  optional google.protobuf.Timestamp online_at = 20;
  // offline_at 记录 GiftRevision 对应业务阶段的时间点。
  optional google.protobuf.Timestamp offline_at = 21;
  // remark 提供 GiftRevision 的补充说明。
  string remark = 22;
  // published_by 标识触发或负责 GiftRevision 对应业务阶段的主体。
  uint32 published_by = 23;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 24;
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 25;
  // request_id 用于关联同一次请求或异步处理链路。
  optional string request_id = 26;
  // published_at 记录 GiftRevision 对应业务阶段的时间点。
  google.protobuf.Timestamp published_at = 27;
  // icon 承载 GiftRevision 关联的 FileView。
  common.file.v1.FileView icon = 28;
  // animation 承载 GiftRevision 关联的 FileView。
  common.file.v1.FileView animation = 29;
  // 此 Revision 被要求生效的确定时间点；立即发布时等于 published_at。
  google.protobuf.Timestamp effective_at = 30;
  // 此 Revision 的排期历史；立即发布时为空。
  GiftRevisionSchedule schedule = 31;
  // 礼物展示等级，取值 COMMON、LUXURY 或 EFFECT；发布后不可变。
  string gift_tier = 32 [(validate.rules).string = {in: ["COMMON", "LUXURY", "EFFECT"]}];
  // effects 列出该不可变 Revision 快照中的结构化特效资源。
  repeated GiftEffect effects = 33;
  // display_placements 列出该不可变 Revision 快照中的 App 级陈列位投放。
  repeated GiftDisplayPlacement display_placements = 34;
  // locales 列出该不可变 Revision 快照中的多语言文案。
  repeated GiftLocaleText locales = 35;
  // 礼物目录身份类型，取值 STANDARD 或 COMBO；发布后不可变。
  string gift_kind = 36 [(validate.rules).string = {in: ["STANDARD", "COMBO"]}];
  // combo_items 列出该不可变 Revision 快照中的 COMBO 组件清单。
  repeated GiftComboItem combo_items = 37;
}

// GiftRevisionScheduleStatus 刻画对应资源的生命周期状态。
enum GiftRevisionScheduleStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  GIFT_REVISION_SCHEDULE_STATUS_UNSPECIFIED = 0;
  // 已安排在约定时间生效或执行。
  GIFT_REVISION_SCHEDULE_STATUS_SCHEDULED = 1;
  // 已经激活并进入生效状态。
  GIFT_REVISION_SCHEDULE_STATUS_ACTIVATED = 2;
  // 处理已取消，不再继续推进。
  GIFT_REVISION_SCHEDULE_STATUS_CANCELED = 3;
}

// GiftRevisionSchedule is the mutable execution fact around one immutable Revision.
message GiftRevisionSchedule {
  // id 标识关联的 GiftRevisionSchedule。
  uint64 id = 1;
  // app_id 限定 GiftRevisionSchedule 所属 App；UNSPECIFIED 不表示跨 App。
  uint32 app_id = 2;
  // gift_id 标识关联的 Gift。
  uint32 gift_id = 3;
  // revision_id 标识关联的 Revision。
  uint64 revision_id = 4;
  // status 表示 GiftRevisionSchedule 当前可观察的生命周期状态。
  GiftRevisionScheduleStatus status = 5;
  // effective_at 记录 GiftRevisionSchedule 对应业务阶段的时间点。
  google.protobuf.Timestamp effective_at = 6;
  // scheduled_by 标识触发或负责 GiftRevisionSchedule 对应业务阶段的主体。
  uint32 scheduled_by = 7;
  // scheduled_at 记录 GiftRevisionSchedule 对应业务阶段的时间点。
  google.protobuf.Timestamp scheduled_at = 8;
  // activated_at 记录 GiftRevisionSchedule 对应业务阶段的时间点。
  optional google.protobuf.Timestamp activated_at = 9;
  // canceled_by 标识触发或负责 GiftRevisionSchedule 对应业务阶段的主体。
  optional uint32 canceled_by = 10;
  // canceled_reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  optional string canceled_reason = 11;
  // cancel_operation_no 关联原始管理操作的审计编号，用于追踪与幂等收敛。
  optional string cancel_operation_no = 12;
  // cancel_request_id 标识关联的 CancelRequest。
  optional string cancel_request_id = 13;
  // canceled_at 记录 GiftRevisionSchedule 对应业务阶段的时间点。
  optional google.protobuf.Timestamp canceled_at = 14;
}

// 礼物分类可编辑字段，不携带资源身份。
message GiftCategoryPatch {
  // name 提供 GiftCategoryPatch 面向展示或识别的名称。
  optional string name = 1;
  // sort 指定结果排序规则。
  optional uint32 sort = 2;
  // remark 提供 GiftCategoryPatch 的补充说明。
  optional string remark = 3;
}

// GiftCategoryCreateData carries the stable identity fields accepted at creation.
message GiftCategoryCreateData {
  // name 提供 GiftCategoryCreateData 面向展示或识别的名称。
  string name = 1;
  // code 提供 GiftCategoryCreateData 对外稳定使用的业务编码。
  string code = 2;
  // sort 指定结果排序规则。
  optional uint32 sort = 3;
  // remark 提供 GiftCategoryCreateData 的补充说明。
  optional string remark = 4;
}

// GiftSceneType 表示 Gift Scene Type 的稳定身份与启用状态。
message GiftSceneType {
  // id 标识关联的 GiftSceneType。
  uint32 id = 1;
