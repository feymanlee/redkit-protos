  // 当前未生效，不用于新的业务处理。
  GIFT_OPERATOR_AUDIT_ACTION_CATEGORY_DISABLED = 1;
  // 已经发布并对约定作用域生效。
  GIFT_OPERATOR_AUDIT_ACTION_GIFT_PUBLISHED = 2;
  // 处理已取消，不再继续推进。
  GIFT_OPERATOR_AUDIT_ACTION_GIFT_SCHEDULE_CANCELED = 3;
  // 已经激活并进入生效状态。
  GIFT_OPERATOR_AUDIT_ACTION_GIFT_SCHEDULE_ACTIVATED = 4;
  // GIFT_OPERATOR_AUDIT_ACTION_GIFT_EMERGENCY_OFFLINE 执行 GIFT_EMERGENCY_OFFLINE 业务动作。
  GIFT_OPERATOR_AUDIT_ACTION_GIFT_EMERGENCY_OFFLINE = 5;
  // 已退出使用，仅保留历史查询能力。
  GIFT_OPERATOR_AUDIT_ACTION_GIFT_ARCHIVED = 6;
  // 当前未生效，不用于新的业务处理。
  GIFT_OPERATOR_AUDIT_ACTION_SCENE_TYPE_DISABLED = 7;
  // 当前已生效并可用于业务处理。
  GIFT_OPERATOR_AUDIT_ACTION_SCENE_TYPE_ENABLED = 8;
  // GIFT_OPERATOR_AUDIT_ACTION_BACKPACK_ADJUSTED 执行 BACKPACK_ADJUSTED 业务动作。
  GIFT_OPERATOR_AUDIT_ACTION_BACKPACK_ADJUSTED = 9;
  // GIFT_OPERATOR_AUDIT_ACTION_SEND_RECONCILED 执行 SEND_RECONCILED 业务动作。
  GIFT_OPERATOR_AUDIT_ACTION_SEND_RECONCILED = 10;
  // 相关人员已经确认知悉，事实本身仍保留。
  GIFT_OPERATOR_AUDIT_ACTION_RECONCILIATION_ISSUE_ACKNOWLEDGED = 11;
  // GIFT_OPERATOR_AUDIT_ACTION_RECONCILIATION_ISSUE_NOTE_ADDED 执行 RECONCILIATION_ISSUE_NOTE_ADDED 业务动作。
  GIFT_OPERATOR_AUDIT_ACTION_RECONCILIATION_ISSUE_NOTE_ADDED = 12;
  // GIFT_OPERATOR_AUDIT_ACTION_SETTLEMENT_RECONCILED 执行 SETTLEMENT_RECONCILED 业务动作。
  GIFT_OPERATOR_AUDIT_ACTION_SETTLEMENT_RECONCILED = 13;
