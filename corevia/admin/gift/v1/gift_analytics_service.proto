syntax = "proto3";

package admin.gift.v1;

import "common/pagination/v1/pagination.proto";
import "gift/v1/stats.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "validate/validate.proto";

// 礼物分析管理服务。
service GiftAnalyticsService {
  // 查询礼物运营概览。
  rpc GetGiftOverview(AdminGetGiftOverviewRequest) returns (.gift.v1.GiftOverviewResponse) {
    option (google.api.http) = {get: "/admin/v1/gift-overview"};
  }
  // 按 typed filter 分页查询 Gift Stat 读模型；不是账务事实。
  rpc ListGiftStats(AdminListGiftStatsRequest) returns (.gift.v1.ListGiftStatResponse) {
    option (google.api.http) = {get: "/admin/v1/gift-stats"};
  }
  // 按 typed filter 分页查询 Gift Event；只读，用于事故与目录变更调查。
  rpc ListGiftEvents(AdminListGiftEventsRequest) returns (.gift.v1.ListGiftEventResponse) {
    option (google.api.http) = {get: "/admin/v1/gift-events"};
  }
}

// AdminGetGiftOverviewRequest 标识待查询的 GiftOverview。
message AdminGetGiftOverviewRequest {
  // start_day 指定 GetGiftOverview 统计或结算周期的起点。
  string start_day = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {len: 10}];
  // end_day 指定 GetGiftOverview 统计或结算周期的终点。
  string end_day = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {len: 10}];
}

// AdminListGiftStatsRequest 定义 Gift Stats 的筛选与分页参数。
message AdminListGiftStatsRequest {
  // filter 限定本次查询采用的筛选条件。
  .gift.v1.GiftStatFilter filter = 1;
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 2;
}

// AdminListGiftEventsRequest 定义 Gift Events 的筛选与分页参数。
message AdminListGiftEventsRequest {
  // filter 限定本次查询采用的筛选条件。
  .gift.v1.GiftEventFilter filter = 1;
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 2;
}
