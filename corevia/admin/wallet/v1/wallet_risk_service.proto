syntax = "proto3";

package admin.wallet.v1;

import "common/pagination/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "wallet/v1/risk.proto";
import "wallet/v1/wallet_types.proto";

// 钱包风险服务。
service WalletRiskService {
  // 查询 RiskRule 列表。
  rpc ListRiskRules(.common.pagination.v1.PagingRequest) returns (.wallet.v1.ListWalletRiskRuleResponse) {
    option (google.api.http) = {get: "/admin/v1/wallet-risk-rules"};
  }
  // 查询 RiskRuleRevision 列表。
  rpc ListRiskRuleRevisions(AdminListWalletRiskRuleRevisionsRequest) returns (.wallet.v1.ListWalletRiskRuleRevisionResponse) {
    option (google.api.http) = {get: "/admin/v1/wallet-risk-rules/{rule_id}/revisions"};
  }
  // 创建 RiskRuleRevision。
  rpc CreateRiskRuleRevision(AdminCreateWalletRiskRuleRevisionRequest) returns (.wallet.v1.WalletRiskRuleRevision) {
    option (google.api.http) = {post: "/admin/v1/wallet-risk-rule-revisions" body: "*"};
  }
  // 批准 RiskRuleRevision。
  rpc ApproveRiskRuleRevision(AdminApproveWalletRiskRuleRevisionRequest) returns (.wallet.v1.WalletRiskRuleRevision) {
    option (google.api.http) = {post: "/admin/v1/wallet-risk-rule-revisions:approve" body: "*"};
  }
  // 查询 EmergencyWalletBlock 列表。
  rpc ListEmergencyWalletBlocks(.common.pagination.v1.PagingRequest) returns (.wallet.v1.ListEmergencyWalletBlockResponse) {
    option (google.api.http) = {get: "/admin/v1/emergency-wallet-blocks"};
  }
  // 创建 EmergencyWalletBlock。
  rpc CreateEmergencyWalletBlock(AdminCreateEmergencyWalletBlockRequest) returns (.wallet.v1.EmergencyWalletBlock) {
    option (google.api.http) = {post: "/admin/v1/emergency-wallet-blocks" body: "*"};
  }
  // 结束 EmergencyWalletBlock。
  rpc EndEmergencyWalletBlock(AdminEndEmergencyWalletBlockRequest) returns (.wallet.v1.EmergencyWalletBlock) {
    option (google.api.http) = {post: "/admin/v1/emergency-wallet-blocks:end" body: "*"};
  }
}

// AdminListWalletRiskRuleRevisionsRequest 定义 WalletRiskRuleRevisions 的筛选与分页参数。
message AdminListWalletRiskRuleRevisionsRequest {
  // rule_id 标识关联的 Rule。
  uint32 rule_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint32.gt = 0];
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 2;
}

// AdminCreateWalletRiskRuleRevisionRequest 定义创建 WalletRiskRuleRevision 的幂等命令参数。
message AdminCreateWalletRiskRuleRevisionRequest {
  // rule_id 标识关联的 Rule。
  optional uint32 rule_id = 1 [(validate.rules).uint32.gt = 0];
  // currency 指定相关金额使用的币种或计量单位。
  .wallet.v1.WalletCurrency currency = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // single_debit_limit 限定 CreateWalletRiskRuleRevision 对应操作允许使用的数量或阈值。
  int64 single_debit_limit = 3 [(validate.rules).int64.gte = 0];
  // daily_debit_limit 限定 CreateWalletRiskRuleRevision 对应操作允许使用的数量或阈值。
  int64 daily_debit_limit = 4 [(validate.rules).int64.gte = 0];
  // single_adjustment_limit 限定 CreateWalletRiskRuleRevision 对应操作允许使用的数量或阈值。
  int64 single_adjustment_limit = 5 [(validate.rules).int64.gte = 0];
  // enabled 显式表示 CreateWalletRiskRuleRevision 是否满足该条件。
  bool enabled = 6;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 7 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 500}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 8 [(validate.rules).string.max_len = 128];
}

// AdminApproveWalletRiskRuleRevisionRequest 定义批准 WalletRiskRuleRevision 的幂等管理命令参数。
message AdminApproveWalletRiskRuleRevisionRequest {
  // revision_id 标识关联的 Revision。
  uint64 revision_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // effective_at 记录 ApproveWalletRiskRuleRevision 对应业务阶段的时间点。
  google.protobuf.Timestamp effective_at = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).timestamp.required = true];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 500}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 4 [(validate.rules).string.max_len = 128];
}

// AdminCreateEmergencyWalletBlockRequest 定义创建 EmergencyWalletBlock 的幂等命令参数。
message AdminCreateEmergencyWalletBlockRequest {
  // currency 指定相关金额使用的币种或计量单位。
  .wallet.v1.WalletCurrency currency = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // user_id 标识关联的 User。
  optional uint64 user_id = 2 [(validate.rules).uint64.gt = 0];
  // operation_scope 限定 CreateEmergencyWalletBlock 的生效或授权范围。
  .wallet.v1.EmergencyWalletBlockScope operation_scope = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // expires_at 指定 CreateEmergencyWalletBlock 失效的时间点。
  google.protobuf.Timestamp expires_at = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).timestamp.required = true];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 500}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 6 [(validate.rules).string.max_len = 128];
}

// AdminEndEmergencyWalletBlockRequest 定义执行 EndEmergencyWalletBlock 的幂等管理命令参数。
message AdminEndEmergencyWalletBlockRequest {
  // block_id 标识关联的 Block。
  uint64 block_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 500}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 3 [(validate.rules).string.max_len = 128];
}
