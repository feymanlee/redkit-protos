syntax = "proto3";

package admin.wallet.v1;

import "common/pagination/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "validate/validate.proto";
import "wallet/v1/intervention.proto";

// 钱包干预服务。
service WalletInterventionService {
  // 创建 Intervention。
  rpc CreateIntervention(AdminCreateWalletInterventionRequest) returns (.wallet.v1.WalletIntervention) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-interventions"
      body: "*"
    };
  }
  // 批准 Intervention。
  rpc ApproveIntervention(AdminReviewWalletInterventionRequest) returns (.wallet.v1.WalletIntervention) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-interventions:approve"
      body: "*"
    };
  }
  // 拒绝 Intervention。
  rpc RejectIntervention(AdminReviewWalletInterventionRequest) returns (.wallet.v1.WalletIntervention) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-interventions:reject"
      body: "*"
    };
  }
  // 查询 Intervention 列表。
  rpc ListInterventions(AdminListWalletInterventionsRequest) returns (.wallet.v1.ListWalletInterventionResponse) {
    option (google.api.http) = {get: "/admin/v1/wallet-interventions"};
  }
}

// AdminCreateWalletInterventionRequest 定义创建 WalletIntervention 的幂等命令参数。
message AdminCreateWalletInterventionRequest {
  // type 区分 CreateWalletIntervention 的业务类型。
  .wallet.v1.WalletIntervention.Type type = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // target_freeze_no 是 CreateWalletIntervention 对外关联与审计使用的业务编号。
  optional string target_freeze_no = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 128
  }];
  // target_transaction_id 标识关联的 TargetTransaction。
  optional uint64 target_transaction_id = 3 [(validate.rules).uint64.gt = 0];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 4 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 500
    }
  ];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 128
    }
  ];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 6 [(validate.rules).string.max_len = 128];
}

// AdminReviewWalletInterventionRequest 定义审核 WalletIntervention 的幂等管理命令参数。
message AdminReviewWalletInterventionRequest {
  // intervention_id 标识关联的 Intervention。
  uint64 intervention_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).uint64.gt = 0
  ];
  // review_note 记录人工判断的补充说明，供审计与复核。
  optional string review_note = 2 [(validate.rules).string.max_len = 1000];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 500
    }
  ];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 4 [(validate.rules).string.max_len = 128];
}

// AdminListWalletInterventionsRequest 定义 WalletInterventions 的筛选与分页参数。
message AdminListWalletInterventionsRequest {
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 1;
  // filter 限定本次查询采用的筛选条件。
  optional AdminWalletInterventionFilter filter = 2;
}

// AdminWalletInterventionFilter 定义可组合的查询筛选条件。
message AdminWalletInterventionFilter {
  // type 区分 WalletInterventionFilter 的业务类型。
  optional .wallet.v1.WalletIntervention.Type type = 1 [(validate.rules).enum = {
    defined_only: true
    not_in: [0]
  }];
  // status 表示 WalletInterventionFilter 当前可观察的生命周期状态。
  optional .wallet.v1.WalletIntervention.Status status = 2 [(validate.rules).enum = {
    defined_only: true
    not_in: [0]
  }];
  // requester_id 标识关联的 Requester。
  optional uint32 requester_id = 3 [(validate.rules).uint32.gt = 0];
  // user_id 标识当前 App 内关联的 User。
  optional uint64 user_id = 4 [(validate.rules).uint64.gt = 0];
  // minimum_age_seconds 以秒表示对应流程的持续时间或上限。
  optional uint64 minimum_age_seconds = 5;
}
