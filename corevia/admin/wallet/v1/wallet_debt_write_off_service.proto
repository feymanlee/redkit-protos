syntax = "proto3";

package admin.wallet.v1;

import "common/pagination/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "validate/validate.proto";
import "wallet/v1/debt_write_off.proto";

// 钱包欠款核销服务。
service WalletDebtWriteOffService {
  // 创建 WriteOff。
  rpc CreateWriteOff(AdminCreateWalletDebtWriteOffRequest) returns (.wallet.v1.WalletDebtWriteOff) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-debt-write-offs"
      body: "*"
    };
  }
  // 批准 WriteOff。
  rpc ApproveWriteOff(AdminReviewWalletDebtWriteOffRequest) returns (.wallet.v1.WalletDebtWriteOff) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-debt-write-offs:approve"
      body: "*"
    };
  }
  // 拒绝 WriteOff。
  rpc RejectWriteOff(AdminReviewWalletDebtWriteOffRequest) returns (.wallet.v1.WalletDebtWriteOff) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-debt-write-offs:reject"
      body: "*"
    };
  }
  // 查询 WriteOff 列表。
  rpc ListWriteOffs(AdminListWalletDebtWriteOffsRequest) returns (.wallet.v1.ListWalletDebtWriteOffsResponse) {
    option (google.api.http) = {get: "/admin/v1/wallet-debt-write-offs"};
  }
}

// AdminCreateWalletDebtWriteOffRequest 定义创建 WalletDebtWriteOff 的幂等命令参数。
message AdminCreateWalletDebtWriteOffRequest {
  // debt_id 标识关联的 Debt。
  uint64 debt_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // amount 以对应 WalletCurrency 的最小计量单位表示，不使用浮点数。
  int64 amount = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).int64.gt = 0];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 500}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 5 [(validate.rules).string.max_len = 128];
}

// AdminReviewWalletDebtWriteOffRequest 定义审核 WalletDebtWriteOff 的幂等管理命令参数。
message AdminReviewWalletDebtWriteOffRequest {
  // write_off_id 标识关联的 WriteOff。
  uint64 write_off_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // review_note 记录人工判断的补充说明，供审计与复核。
  optional string review_note = 2 [(validate.rules).string.max_len = 1000];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 500}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 4 [(validate.rules).string.max_len = 128];
}

// AdminListWalletDebtWriteOffsRequest 定义 WalletDebtWriteOffs 的筛选与分页参数。
message AdminListWalletDebtWriteOffsRequest {
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 1;
  // filter 限定本次查询采用的筛选条件。
  optional AdminWalletDebtWriteOffFilter filter = 2;
}

// AdminWalletDebtWriteOffFilter 定义可组合的查询筛选条件。
message AdminWalletDebtWriteOffFilter {
  // status 表示 WalletDebtWriteOffFilter 当前可观察的生命周期状态。
  optional .wallet.v1.WalletDebtWriteOff.Status status = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
  // requester_id 标识关联的 Requester。
  optional uint32 requester_id = 2 [(validate.rules).uint32.gt = 0];
  // user_id 标识关联的 User。
  optional uint64 user_id = 3 [(validate.rules).uint64.gt = 0];
  // debt_id 标识关联的 Debt。
  optional uint64 debt_id = 4 [(validate.rules).uint64.gt = 0];
  // minimum_age_seconds 以秒表示对应流程的持续时间或上限。
  optional uint64 minimum_age_seconds = 5;
}
