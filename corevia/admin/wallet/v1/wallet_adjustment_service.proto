syntax = "proto3";

package admin.wallet.v1;

import "common/pagination/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "validate/validate.proto";
import "wallet/v1/adjustment.proto";
import "wallet/v1/reconciliation.proto";
import "wallet/v1/wallet_types.proto";

// 钱包人工调账管理服务。
service WalletAdjustmentService {
  // 创建人工调账申请。
  rpc CreateAdjustment(AdminCreateWalletAdjustmentRequest) returns (.wallet.v1.WalletAdjustment) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-adjustments"
      body: "*"
    };
  }
  // 审批人工调账申请。
  rpc ApproveAdjustment(AdminReviewWalletAdjustmentRequest) returns (.wallet.v1.WalletAdjustment) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-adjustments:approve"
      body: "*"
    };
  }
  // 拒绝人工调账申请。
  rpc RejectAdjustment(AdminReviewWalletAdjustmentRequest) returns (.wallet.v1.WalletAdjustment) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-adjustments:reject"
      body: "*"
    };
  }
  // 撤回 Adjustment。
  rpc WithdrawAdjustment(AdminWithdrawWalletAdjustmentRequest) returns (.wallet.v1.WalletAdjustment) {
    option (google.api.http) = {
      post: "/admin/v1/wallet-adjustments:withdraw"
      body: "*"
    };
  }
  // 查询人工调账申请。
  rpc ListAdjustments(AdminListWalletAdjustmentsRequest) returns (.wallet.v1.ListWalletAdjustmentResponse) {
    option (google.api.http) = {get: "/admin/v1/wallet-adjustments"};
  }
}

// AdminCreateWalletAdjustmentRequest 定义创建 WalletAdjustment 的幂等命令参数。
message AdminCreateWalletAdjustmentRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).uint64.gt = 0
  ];
  // currency 指定相关金额使用的币种或计量单位。
  optional .wallet.v1.WalletCurrency currency = 2 [(validate.rules).enum.defined_only = true];
  // amount 以对应 WalletCurrency 的最小计量单位表示，不使用浮点数。
  int64 amount = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).int64 = {not_in: [0]}
  ];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 4 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 1000
    }
  ];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 128
    }
  ];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 6 [(validate.rules).string.max_len = 128];
}
// AdminReviewWalletAdjustmentRequest 定义审核 WalletAdjustment 的幂等管理命令参数。
message AdminReviewWalletAdjustmentRequest {
  // adjustment_id 标识关联的 Adjustment。
  uint64 adjustment_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).uint64.gt = 0
  ];
  // review_note 记录人工判断的补充说明，供审计与复核。
  optional string review_note = 2 [(validate.rules).string.max_len = 1000];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 500
    }
  ];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 4 [(validate.rules).string.max_len = 128];
}

// AdminWithdrawWalletAdjustmentRequest 定义撤回 WalletAdjustment 的幂等管理命令参数。
message AdminWithdrawWalletAdjustmentRequest {
  // adjustment_id 标识关联的 Adjustment。
  uint64 adjustment_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).uint64.gt = 0
  ];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 500
    }
  ];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  optional string operation_no = 3 [(validate.rules).string.max_len = 128];
}

// AdminListWalletAdjustmentsRequest 定义 WalletAdjustments 的筛选与分页参数。
message AdminListWalletAdjustmentsRequest {
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 1;
  // filter 限定本次查询采用的筛选条件。
  optional AdminWalletAdjustmentFilter filter = 2;
}

// AdminWalletAdjustmentFilter 定义可组合的查询筛选条件。
message AdminWalletAdjustmentFilter {
  // status 表示 WalletAdjustmentFilter 当前可观察的生命周期状态。
  optional .wallet.v1.WalletAdjustment.Status status = 1 [(validate.rules).enum = {
    defined_only: true
    not_in: [0]
  }];
  // requester_id 标识关联的 Requester。
  optional uint32 requester_id = 2 [(validate.rules).uint32.gt = 0];
  // user_id 标识关联的 User。
  optional uint64 user_id = 3 [(validate.rules).uint64.gt = 0];
  // minimum_age_seconds 以秒表示对应流程的持续时间或上限。
  optional uint64 minimum_age_seconds = 4;
}
