  // display_name 提供 UpdateRewardPackageDraft 面向展示或识别的名称。
  string display_name = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // coin_amount 以 Coin 的最小计量单位表示，不使用浮点数。
  int64 coin_amount = 3 [deprecated = true];
  // daily_grant_limit 限定 UpdateRewardPackageDraft 对应操作允许使用的数量或阈值。
  uint32 daily_grant_limit = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint32.gt = 0];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 512}];
  // items 包含本次返回或处理的业务条目。
  repeated .ops.reward.v1.RewardPackageItemInput items = 6;
}

// AdminPreflightRewardPackageDraftRequest 定义执行 PreflightRewardPackageDraft 的命令参数。
message AdminPreflightRewardPackageDraftRequest {
