// AdminDiscardRewardPackageDraftRequest 定义执行 DiscardRewardPackageDraft 的幂等管理命令参数。
message AdminDiscardRewardPackageDraftRequest {
  // package_id 标识关联的 Package。
  uint64 package_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // revision_id 标识关联的 Revision。
  uint64 revision_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
