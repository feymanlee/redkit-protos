// AdminListRewardPackagesRequest 定义 RewardPackages 的筛选与分页参数。
message AdminListRewardPackagesRequest {}

// AdminGetRewardPackageRequest 标识待查询的 RewardPackage。
message AdminGetRewardPackageRequest {
  // package_id 标识关联的 Package。
  uint64 package_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
}

// AdminCreateRewardPackageRequest 定义创建 RewardPackage 的幂等命令参数。
message AdminCreateRewardPackageRequest {
  // package_code 提供 CreateRewardPackage 对外稳定使用的业务编码。
  string package_code = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 3, max_len: 64}];
  // display_name 提供 CreateRewardPackage 面向展示或识别的名称。
  string display_name = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // coin_amount 以 Coin 的最小计量单位表示，不使用浮点数。
  int64 coin_amount = 3 [deprecated = true];
  // daily_grant_limit 限定 CreateRewardPackage 对应操作允许使用的数量或阈值。
  uint32 daily_grant_limit = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint32.gt = 0];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 512}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 6 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // items 包含本次返回或处理的业务条目。
  repeated .ops.reward.v1.RewardPackageItemInput items = 7;
}

