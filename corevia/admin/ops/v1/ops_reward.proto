syntax = "proto3";

package admin.ops.v1;

import "common/pagination/v1/pagination.proto";
import "ops/reward/v1/reward_package.proto";
import "ops/reward/v1/reward.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "validate/validate.proto";

// OpsRewardPackageService exposes App-scoped Reward Package governance.
service OpsRewardPackageService {
  // 查询 RewardPackage 列表。
  rpc ListRewardPackages(AdminListRewardPackagesRequest) returns (.ops.reward.v1.ListRewardPackagesResponse) {
    option (google.api.http) = {get: "/admin/v1/ops/reward-packages"};
  }
  // 查询 RewardPackage。
  rpc GetRewardPackage(AdminGetRewardPackageRequest) returns (.ops.reward.v1.RewardPackage) {
    option (google.api.http) = {get: "/admin/v1/ops/reward-packages/{package_id}"};
  }
  // 创建 RewardPackage。
  rpc CreateRewardPackage(AdminCreateRewardPackageRequest) returns (.ops.reward.v1.RewardPackage) {
    option (google.api.http) = {post: "/admin/v1/ops/reward-packages" body: "*"};
  }
  // 创建 RewardPackageRevisionDraft。
  rpc CreateRewardPackageRevisionDraft(AdminCreateRewardPackageRevisionDraftRequest) returns (.ops.reward.v1.RewardPackage) {
    option (google.api.http) = {post: "/admin/v1/ops/reward-packages/{package_id}/revisions" body: "*"};
  }
  // 更新 RewardPackageDraft。
  rpc UpdateRewardPackageDraft(AdminUpdateRewardPackageDraftRequest) returns (.ops.reward.v1.RewardPackage) {
    option (google.api.http) = {put: "/admin/v1/ops/reward-packages/{package_id}/draft" body: "*"};
  }
  // 预检 RewardPackageDraft。
  rpc PreflightRewardPackageDraft(AdminPreflightRewardPackageDraftRequest) returns (.ops.reward.v1.RewardPackagePreflight) {
    option (google.api.http) = {post: "/admin/v1/ops/reward-packages/{package_id}:preflight" body: "*"};
  }
  // 发布 RewardPackage。
  rpc PublishRewardPackage(AdminPublishRewardPackageRequest) returns (.ops.reward.v1.RewardPackage) {
    option (google.api.http) = {post: "/admin/v1/ops/reward-packages/{package_id}:publish" body: "*"};
  }
  // 停用 RewardPackage。
  rpc DisableRewardPackage(AdminDisableRewardPackageRequest) returns (.ops.reward.v1.RewardPackage) {
    option (google.api.http) = {post: "/admin/v1/ops/reward-packages/{package_id}:disable" body: "*"};
  }
  // 废弃 RewardPackageDraft。
  rpc DiscardRewardPackageDraft(AdminDiscardRewardPackageDraftRequest) returns (.ops.reward.v1.RewardPackage) {
    option (google.api.http) = {post: "/admin/v1/ops/reward-packages/{package_id}/draft/{revision_id}:discard" body: "*"};
  }
}

// OpsRewardGrantService exposes App-scoped Reward observation and Manual Reward review.
service OpsRewardGrantService {
  // 查询 RewardGrant 列表。
  rpc ListRewardGrants(AdminListRewardGrantsRequest) returns (.ops.reward.v1.ListRewardGrantsResponse) {
    option (google.api.http) = {get: "/admin/v1/ops/reward-grants"};
  }
  // 查询 RewardGrantObservation。
  rpc GetRewardGrantObservation(AdminGetRewardGrantObservationRequest) returns (.ops.reward.v1.RewardGrantObservation) {
    option (google.api.http) = {get: "/admin/v1/ops/reward-grants/{grant_id}"};
  }
  // 查询 ActionRequiredRewardItem 列表。
  rpc ListActionRequiredRewardItems(AdminListActionRequiredRewardItemsRequest) returns (.ops.reward.v1.ListActionRequiredRewardItemsResponse) {
    option (google.api.http) = {get: "/admin/v1/ops/action-required-reward-items"};
  }
  // 重放 RewardItem。
  rpc ReplayRewardItem(AdminReplayRewardItemRequest) returns (.ops.reward.v1.ReplayRewardItemResponse) {
    option (google.api.http) = {post: "/admin/v1/ops/action-required-reward-items/{item_id}:replay" body: "*"};
  }
  // 查询 PendingManualRewardGrant 列表。
  rpc ListPendingManualRewardGrants(AdminListPendingManualRewardGrantsRequest) returns (.ops.reward.v1.ListPendingManualRewardGrantsResponse) {
    option (google.api.http) = {get: "/admin/v1/ops/manual-reward-grants"};
  }
  // 创建 ManualRewardGrant。
  rpc CreateManualRewardGrant(AdminCreateManualRewardGrantRequest) returns (.ops.reward.v1.CreateManualRewardGrantResponse) {
    option (google.api.http) = {post: "/admin/v1/ops/manual-reward-grants" body: "*"};
  }
  // 批准 ManualRewardGrant。
  rpc ApproveManualRewardGrant(AdminApproveManualRewardGrantRequest) returns (.ops.reward.v1.ManualRewardGrant) {
    option (google.api.http) = {post: "/admin/v1/ops/manual-reward-grants/{manual_grant_id}:approve" body: "*"};
  }
  // 拒绝 ManualRewardGrant。
  rpc RejectManualRewardGrant(AdminRejectManualRewardGrantRequest) returns (.ops.reward.v1.ManualRewardGrant) {
    option (google.api.http) = {post: "/admin/v1/ops/manual-reward-grants/{manual_grant_id}:reject" body: "*"};
  }
  // 撤回 ManualRewardGrant。
  rpc WithdrawManualRewardGrant(AdminWithdrawManualRewardGrantRequest) returns (.ops.reward.v1.ManualRewardGrant) {
    option (google.api.http) = {post: "/admin/v1/ops/manual-reward-grants/{manual_grant_id}:withdraw" body: "*"};
  }
}

// AdminListRewardGrantsRequest 定义 RewardGrants 的筛选与分页参数。
message AdminListRewardGrantsRequest {
  // filter 限定本次查询采用的筛选条件。
  .ops.reward.v1.RewardGrantFilter filter = 1;
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 2;
}

// AdminGetRewardGrantObservationRequest 标识待查询的 RewardGrantObservation。
message AdminGetRewardGrantObservationRequest {
  // grant_id 标识关联的 Grant。
  uint64 grant_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
}

// AdminListActionRequiredRewardItemsRequest 定义 ActionRequiredRewardItems 的筛选与分页参数。
message AdminListActionRequiredRewardItemsRequest {
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 1;
}

// AdminReplayRewardItemRequest 定义重放 RewardItem 的幂等管理命令参数。
message AdminReplayRewardItemRequest {
  // item_id 标识关联的 Item。
  uint64 item_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 512}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// AdminListPendingManualRewardGrantsRequest 定义 PendingManualRewardGrants 的筛选与分页参数。
message AdminListPendingManualRewardGrantsRequest {}

// AdminCreateManualRewardGrantRequest 定义创建 ManualRewardGrant 的幂等命令参数。
message AdminCreateManualRewardGrantRequest {
