// AdminWithdrawManualRewardGrantRequest 定义撤回 ManualRewardGrant 的命令参数。
message AdminWithdrawManualRewardGrantRequest {
  // manual_grant_id 标识关联的 ManualGrant。
  uint64 manual_grant_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 512}];
