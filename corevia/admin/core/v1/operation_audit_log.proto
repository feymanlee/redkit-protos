syntax = "proto3";

package admin.core.v1;

import "google/api/annotations.proto";

import "common/pagination/v1/pagination.proto";

import "core/audit/v1/operation_audit_log.proto";

// 操作审计日志管理服务
service OperationAuditLogService {
  // 查询操作审计日志列表
  rpc List (.common.pagination.v1.PagingRequest) returns (.core.audit.v1.ListOperationAuditLogResponse) {
    option (google.api.http) = {
      get: "/admin/v1/operation-audit-logs"
    };
  }

  // 查询操作审计日志详情
  rpc Get (.core.audit.v1.GetOperationAuditLogRequest) returns (.core.audit.v1.OperationAuditLog) {
    option (google.api.http) = {
      get: "/admin/v1/operation-audit-logs/{id}"
    };
  }
}
