syntax = "proto3";

package admin.core.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "common/pagination/v1/pagination.proto";

import "core/permission/v1/menu.proto";

// 后台菜单管理服务
service MenuService {
  // 查询菜单列表
  rpc List (.common.pagination.v1.PagingRequest) returns (.core.permission.v1.ListMenuResponse) {
    option (google.api.http) = {
      get: "/admin/v1/menus"
    };
  }

  // 查询菜单详情
  rpc Get (.core.permission.v1.GetMenuRequest) returns (.core.permission.v1.Menu) {
    option (google.api.http) = {
      get: "/admin/v1/menus/{id}"
    };
  }

  // 创建菜单
  rpc Create (.core.permission.v1.CreateMenuRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/menus"
      body: "*"
    };
  }

  // 更新菜单
  rpc Update (.core.permission.v1.UpdateMenuRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/menus/{id}"
      body: "*"
    };
  }

  // 删除菜单
  rpc Delete (.core.permission.v1.DeleteMenuRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/menus/{id}"
    };
  }
}
