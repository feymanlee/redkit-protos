syntax = "proto3";

package admin.core.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "common/pagination/v1/pagination.proto";

import "core/permission/v1/permission_group.proto";


// 权限组管理服务
service PermissionGroupService {
  // 查询权限组列表
  rpc List (.common.pagination.v1.PagingRequest) returns (.core.permission.v1.ListPermissionGroupResponse) {
    option (google.api.http) = {
      get: "/admin/v1/permission-groups"
    };
  }

  // 查询权限组详情
  rpc Get (.core.permission.v1.GetPermissionGroupRequest) returns (.core.permission.v1.PermissionGroup) {
    option (google.api.http) = {
      get: "/admin/v1/permission-groups/{id}"
    };
  }

  // 创建权限组
  rpc Create (.core.permission.v1.CreatePermissionGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/permission-groups"
      body: "*"
    };
  }

  // 更新权限组
  rpc Update (.core.permission.v1.UpdatePermissionGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/permission-groups/{id}"
      body: "*"
    };
  }

  // 删除权限组
  rpc Delete (.core.permission.v1.DeletePermissionGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/permission-groups/{id}"
    };
  }
}
