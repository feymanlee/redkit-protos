syntax = "proto3";

package admin.core.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "common/pagination/v1/pagination.proto";

import "core/permission/v1/role.proto";

// 角色管理服务
service RoleService {
  // 查询角色列表
  rpc List (.common.pagination.v1.PagingRequest) returns (.core.permission.v1.ListRoleResponse) {
    option (google.api.http) = {
      get: "/admin/v1/roles"
    };
  }

  // 查询角色详情
  rpc Get (.core.permission.v1.GetRoleRequest) returns (.core.permission.v1.Role) {
    option (google.api.http) = {
      get: "/admin/v1/roles/{id}"
    };
  }

  // 创建角色
  rpc Create (.core.permission.v1.CreateRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/roles"
      body: "*"
    };
  }

  // 更新角色
  rpc Update (.core.permission.v1.UpdateRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/roles/{id}"
      body: "*"
    };
  }

  // 删除角色
  rpc Delete (.core.permission.v1.DeleteRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/roles/{id}"
    };
  }
}
