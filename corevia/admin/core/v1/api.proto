syntax = "proto3";

package admin.core.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "common/pagination/v1/pagination.proto";
import "core/permission/v1/api.proto";


// API资源管理服务
service ApiService {
  // 查询API资源列表
  rpc List (.common.pagination.v1.PagingRequest) returns (.core.permission.v1.ListApiResponse) {
    option (google.api.http) = {
      get: "/admin/v1/apis"
    };
  }

  // 查询API资源详情
  rpc Get (.core.permission.v1.GetApiRequest) returns (.core.permission.v1.Api) {
    option (google.api.http) = {
      get: "/admin/v1/apis/{id}"
    };
  }

  // 创建API资源
  rpc Create (.core.permission.v1.CreateApiRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/apis"
      body: "*"
    };
  }

  // 更新API资源
  rpc Update (.core.permission.v1.UpdateApiRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/apis/{id}"
      body: "*"
    };
  }

  // 删除API资源
  rpc Delete (.core.permission.v1.DeleteApiRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/apis/{id}"
    };
  }

  // 同步API资源
  rpc SyncApis (google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/apis/sync"
      body: "*"
    };
  }

  // 查询路由数据
  rpc GetWalkRouteData (google.protobuf.Empty) returns (.core.permission.v1.ListApiResponse) {
    option (google.api.http) = {
      get: "/admin/v1/apis/walk-route"
    };
  }
}
