syntax = "proto3";

package admin.core.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "common/pagination/v1/pagination.proto";

import "core/permission/v1/permission.proto";


// 权限点管理服务
service PermissionService {
  // 查询权限点列表
  rpc List (.common.pagination.v1.PagingRequest) returns (.core.permission.v1.ListPermissionResponse) {
    option (google.api.http) = {
      get: "/admin/v1/permissions"
    };
  }

  // 查询权限点详情
  rpc Get (.core.permission.v1.GetPermissionRequest) returns (.core.permission.v1.Permission) {
    option (google.api.http) = {
      get: "/admin/v1/permissions/{id}"
    };
  }

  // 创建权限点
  rpc Create (.core.permission.v1.CreatePermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/permissions"
      body: "*"
    };
  }

  // 更新权限点
  rpc Update (.core.permission.v1.UpdatePermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/permissions/{id}"
      body: "*"
    };
  }

  // 删除权限点
  rpc Delete (.core.permission.v1.DeletePermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/permissions/{id}"
    };
  }

  // 同步权限点
  rpc SyncPermissions (google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/permissions/sync:perms"
      body: "*"
    };
  }
}
