syntax = "proto3";

package admin.support.v1;

import "google/api/annotations.proto";
import "common/pagination/v1/pagination.proto";
import "support/messaging/v1/messaging.proto";

// SupportSmsService 提供后台短信投递审计。
service SupportSmsService {
  // 查询短信消息。
  rpc ListSmsMessages(AdminListSmsMessagesRequest) returns (.support.messaging.v1.ListSmsMessagesResponse) {
    option (google.api.http) = {get: "/admin/v1/support/sms-messages"};
  }
  // 查询渠道投递明细。
  rpc ListSmsDeliveryAttempts(AdminListSmsDeliveryAttemptsRequest) returns (.support.messaging.v1.ListSmsDeliveryAttemptsResponse) {
    option (google.api.http) = {get: "/admin/v1/support/sms-delivery-attempts"};
  }
  // 显式读取完整 Recipient Phone；路由使用独立敏感数据权限。
  rpc RevealSmsRecipientPhone(AdminRevealSmsRecipientPhoneRequest) returns (.support.messaging.v1.RevealSmsRecipientPhoneResponse) {
    option (google.api.http) = {
      post: "/admin/v1/support/sms-messages/{message_no}:reveal-recipient-phone"
      body: "*"
    };
  }
}

// AdminListSmsMessagesRequest selects the authenticated App's SMS observations.
message AdminListSmsMessagesRequest {
  // filter 限定本次查询采用的筛选条件。
  .support.messaging.v1.SmsMessageFilter filter = 1;
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 2;
}

// AdminListSmsDeliveryAttemptsRequest selects attempts for one logical SMS Message.
message AdminListSmsDeliveryAttemptsRequest {
  // message_no 是 ListSmsDeliveryAttempts 对外关联与审计使用的业务编号。
  string message_no = 1;
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 2;
}

// AdminRevealSmsRecipientPhoneRequest selects one SMS Message for audited FULL display.
message AdminRevealSmsRecipientPhoneRequest {
  // message_no 是 RevealSmsRecipientPhone 对外关联与审计使用的业务编号。
  string message_no = 1;
}
