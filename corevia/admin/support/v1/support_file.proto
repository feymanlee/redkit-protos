// SupportFileUploadService 提供后台客户端直传控制面。
service SupportFileUploadService {
  // 创建上传会话。
  rpc CreateUploadSession(AdminCreateUploadSessionRequest) returns (.support.file.v1.CreateUploadSessionResponse) {
    option (google.api.http) = {
      post: "/admin/v1/file-upload-sessions"
      body: "*"
    };
  }
  // 完成上传并创建 File。
  rpc CompleteUploadSession(AdminCompleteUploadSessionRequest) returns (.support.file.v1.CompleteUploadSessionResponse) {
    option (google.api.http) = {
      post: "/admin/v1/file-upload-sessions/{session_no}:complete"
      body: "*"
    };
  }
  // 查询上传会话。
  rpc GetUploadSession(AdminGetUploadSessionRequest) returns (.support.file.v1.UploadSession) {
    option (google.api.http) = {get: "/admin/v1/file-upload-sessions/{session_no}"};
  }
}

// SupportFileAccessService 提供后台 File View 与绑定校验调试入口。
service SupportFileAccessService {
  // 查询一个 File View。
  rpc GetFileView(AdminGetFileViewRequest) returns (.common.file.v1.FileView) {
    option (google.api.http) = {get: "/admin/v1/files/{file_id}/view"};
  }
  // 批量查询 File View。
  rpc BatchGetFileViews(AdminBatchGetFileViewsRequest) returns (.support.file.v1.BatchGetFileViewsResponse) {
    option (google.api.http) = {
      post: "/admin/v1/files:batch-get-views"
      body: "*"
    };
  }
}

// SupportFileAdministrationService 提供后台 File 治理能力。
service SupportFileAdministrationService {
  // 查询 File 详情。
  rpc GetFile(AdminGetFileRequest) returns (.support.file.v1.File) {
    option (google.api.http) = {get: "/admin/v1/files/{id}"};
  }
  // 查询 File 列表。
  rpc ListFiles(AdminListFilesRequest) returns (.support.file.v1.ListFilesResponse) {
    option (google.api.http) = {get: "/admin/v1/files"};
  }
  // 查询 Upload Session 列表。
  rpc ListUploadSessions(AdminListUploadSessionsRequest) returns (.support.file.v1.ListUploadSessionsResponse) {
    option (google.api.http) = {get: "/admin/v1/file-upload-sessions"};
  }
  // 独立发布 App 公共资源。
  rpc PublishStandaloneFile(AdminPublishStandaloneFileRequest) returns (.support.file.v1.File) {
    option (google.api.http) = {
      post: "/admin/v1/files/{file_id}:publish-standalone"
      body: "*"
    };
  }
  // 永久阻断 File 公共访问。
  rpc RevokeFile(AdminRevokeFileRequest) returns (.support.file.v1.File) {
    option (google.api.http) = {
      post: "/admin/v1/files/{file_id}:revoke"
      body: "*"
    };
  }
  // 查询 File Reference。
  rpc ListFileReferences(AdminListFileReferencesRequest) returns (.support.file.v1.ListFileReferencesResponse) {
    option (google.api.http) = {get: "/admin/v1/file-references"};
  }
  // 查询 File Event。
  rpc ListFileEvents(AdminListFileEventsRequest) returns (.support.file.v1.ListFileEventsResponse) {
    option (google.api.http) = {get: "/admin/v1/file-events"};
  }
  // 查询历史 File Review Attempt。
  rpc ListFileReviewAttempts(AdminListFileReviewAttemptsRequest) returns (.support.file.v1.ListFileReviewAttemptsResponse) {
    option (google.api.http) = {get: "/admin/v1/file-review-attempts"};
  }
  // 创建不可变 Policy Draft Revision。
  rpc CreateFilePolicyDraft(AdminCreateFilePolicyDraftRequest) returns (.support.file.v1.FilePolicyRevision) {
    option (google.api.http) = {
      post: "/admin/v1/file-policy-revisions"
      body: "*"
    };
  }
  // 对 Policy Draft Revision 执行结构化预检。
  rpc PreflightFilePolicyDraft(AdminPreflightFilePolicyDraftRequest) returns (.support.file.v1.FilePolicyPreflight) {
    option (google.api.http) = {
      post: "/admin/v1/file-policy-revisions/{revision_id}:preflight"
      body: "*"
    };
  }
  // 激活已通过预检的 Policy Draft Revision。
  rpc ActivateFilePolicyDraft(AdminActivateFilePolicyDraftRequest) returns (.support.file.v1.FilePolicyRevision) {
    option (google.api.http) = {
      post: "/admin/v1/file-policy-revisions/{revision_id}:activate"
      body: "*"
    };
  }
  // 丢弃未使用的 Policy Draft Revision。
  rpc DiscardFilePolicyDraft(AdminDiscardFilePolicyDraftRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/file-policy-revisions/{revision_id}:discard"
      body: "*"
    };
  }
  // 查询不可变 Policy Revision 历史。
  rpc ListFilePolicyRevisions(AdminListFilePolicyRevisionsRequest) returns (.support.file.v1.ListFilePolicyRevisionsResponse) {
    option (google.api.http) = {get: "/admin/v1/file-policy-revisions"};
  }
  // 创建不可变 Provider Draft Revision。
  rpc CreateStorageProviderDraft(AdminCreateStorageProviderDraftRequest) returns (.support.file.v1.StorageProviderRevision) {
    option (google.api.http) = {
      post: "/admin/v1/file-provider-revisions"
      body: "*"
    };
  }
  // 对 Provider Draft 执行真实能力预检。
  rpc PreflightStorageProviderDraft(AdminPreflightStorageProviderDraftRequest) returns (.support.file.v1.StorageProviderPreflight) {
    option (google.api.http) = {
      post: "/admin/v1/file-provider-revisions/{revision_id}:preflight"
      body: "*"
    };
  }
  // 激活已通过预检的 Provider Draft。
  rpc ActivateStorageProviderDraft(AdminActivateStorageProviderDraftRequest) returns (.support.file.v1.StorageProviderRevision) {
    option (google.api.http) = {
      post: "/admin/v1/file-provider-revisions/{revision_id}:activate"
      body: "*"
    };
  }
  // 丢弃未使用的 Provider Draft。
  rpc DiscardStorageProviderDraft(AdminDiscardStorageProviderDraftRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/file-provider-revisions/{revision_id}:discard"
      body: "*"
    };
  }
  // 查询不可变 Provider Revision 历史。
  rpc ListStorageProviderRevisions(AdminListStorageProviderRevisionsRequest) returns (.support.file.v1.ListStorageProviderRevisionsResponse) {
    option (google.api.http) = {get: "/admin/v1/file-provider-revisions"};
  }
  // 创建存储对账批次。
  rpc CreateReconciliationBatch(AdminCreateReconciliationBatchRequest) returns (.support.file.v1.ReconciliationBatch) {
    option (google.api.http) = {
      post: "/admin/v1/file-reconciliation-batches"
      body: "*"
    };
  }
  // 查询存储对账批次。
  rpc ListReconciliationBatches(AdminListReconciliationBatchesRequest) returns (.support.file.v1.ListReconciliationBatchesResponse) {
    option (google.api.http) = {get: "/admin/v1/file-reconciliation-batches"};
  }
  // 查询存储对账明细。
  rpc ListReconciliationItems(AdminListReconciliationItemsRequest) returns (.support.file.v1.ListReconciliationItemsResponse) {
    option (google.api.http) = {get: "/admin/v1/file-reconciliation-items"};
  }
  // 查询异步治理任务。
  rpc ListFileTasks(AdminListFileTasksRequest) returns (.support.file.v1.ListFileTasksResponse) {
    option (google.api.http) = {get: "/admin/v1/file-tasks"};
  }
  // 重试失败任务。
  rpc RetryFileTask(AdminRetryFileTaskRequest) returns (.support.file.v1.FileTask) {
    option (google.api.http) = {
      post: "/admin/v1/file-tasks/{task_id}:retry"
      body: "*"
    };
  }
}

// AdminCreateUploadSessionRequest creates an Operator-created direct-upload intent.
message AdminCreateUploadSessionRequest {
  // purpose 指定 CreateUploadSession 数据或能力的预期用途。
  .common.file.v1.FilePurpose purpose = 1;
  // owner_type 区分 CreateUploadSession 的业务类型。
  .common.file.v1.FileOwnerType owner_type = 2;
  // owner_id 标识关联的 Owner。
  uint64 owner_id = 3;
  // source_filename 保留上传方提供的原始文件名，仅用于展示和审计。
  string source_filename = 4;
  // content_type 区分 CreateUploadSession 的业务类型。
  string content_type = 5;
  // size_bytes 以字节表示 CreateUploadSession 对应数据的大小。
  uint64 size_bytes = 6;
  // checksum_algorithm 指定 CreateUploadSession 采用的校验或计算算法。
  string checksum_algorithm = 7;
  // checksum 用于校验 CreateUploadSession 对应内容或版本的一致性。
  string checksum = 8;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 9;
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 10;
}

// AdminCompleteUploadSessionRequest 定义完成 UploadSession 的命令参数。
message AdminCompleteUploadSessionRequest {
  // session_no 是 CompleteUploadSession 对外关联与审计使用的业务编号。
  string session_no = 1;
  // etag 用于校验 CompleteUploadSession 对应内容或版本的一致性。
  string etag = 2;
  // checksum 用于校验 CompleteUploadSession 对应内容或版本的一致性。
  string checksum = 3;
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 4;
}

// AdminGetUploadSessionRequest 标识待查询的 UploadSession。
message AdminGetUploadSessionRequest {
  // session_no 是 GetUploadSession 对外关联与审计使用的业务编号。
  string session_no = 1;
}

