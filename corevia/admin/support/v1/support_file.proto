// AdminListReconciliationItemsRequest 定义 ReconciliationItems 的筛选与分页参数。
message AdminListReconciliationItemsRequest {
  // filter 限定本次查询采用的筛选条件。
  .support.file.v1.ReconciliationItemFilter filter = 1;
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 2;
}

// AdminListFileTasksRequest 定义 FileTasks 的筛选与分页参数。
message AdminListFileTasksRequest {
  // filter 限定本次查询采用的筛选条件。
  .support.file.v1.FileTaskFilter filter = 1;
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 2;
}

// AdminRetryFileTaskRequest 定义重试 FileTask 的幂等管理命令参数。
message AdminRetryFileTaskRequest {
  // task_id 标识关联的 Task。
  uint64 task_id = 1;
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 2;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3;
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 4;
}
