// AdminCreateStorageProviderDraftRequest 定义创建 StorageProviderDraft 的幂等命令参数。
message AdminCreateStorageProviderDraftRequest {
  // source_revision_id 标识关联的 SourceRevision。
  uint64 source_revision_id = 1;
  // provider 标识本次能力使用的外部 Provider。
  .support.file.v1.StorageProvider provider = 2 [(google.api.field_behavior) = REQUIRED];
  // is_default 显式表示 CreateStorageProviderDraft 是否满足该条件。
  bool is_default = 3;
  // enabled 显式表示 CreateStorageProviderDraft 是否满足该条件。
  bool enabled = 4;
  // region 指定号码、服务或业务规则采用的地区。
  string region = 5;
  // endpoint 指定 CreateStorageProviderDraft 访问或跳转使用的目标地址。
  string endpoint = 6;
  // upload_endpoint 指定 CreateStorageProviderDraft 访问或跳转使用的目标地址。
  string upload_endpoint = 7;
  // bucket 标识 Storage Provider 中承载对象的 Bucket。
  string bucket = 8 [(google.api.field_behavior) = REQUIRED];
  // cdn_base_url 指定 CreateStorageProviderDraft 访问或跳转使用的目标地址。
  string cdn_base_url = 9 [(google.api.field_behavior) = REQUIRED];
  // secret_ref 仅引用外部 Secret，不在契约中承载明文密钥。
  string secret_ref = 10 [(google.api.field_behavior) = REQUIRED];
  // provider_options 承载 Provider 的非敏感扩展配置；密钥仅通过 secret reference 提供。
  string provider_options = 11;
  // remark 提供 CreateStorageProviderDraft 的补充说明。
  string remark = 12;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 13 [(google.api.field_behavior) = REQUIRED];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 14 [(google.api.field_behavior) = REQUIRED];
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 15 [(google.api.field_behavior) = REQUIRED];
}

