  .common.file.v1.FilePurpose purpose = 1 [(google.api.field_behavior) = REQUIRED];
  // enabled 显式表示 CreateFilePolicyDraft 是否满足该条件。
  bool enabled = 2;
  // max_size_bytes 限定 CreateFilePolicyDraft 对应操作允许使用的数量或阈值。
  uint64 max_size_bytes = 3;
  // allowed_content_types 列出上传策略允许接受的 MIME Content-Type。
  repeated string allowed_content_types = 4;
  // remark 提供 CreateFilePolicyDraft 的补充说明。
  string remark = 5;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 6 [(google.api.field_behavior) = REQUIRED];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 7 [(google.api.field_behavior) = REQUIRED];
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 8 [(google.api.field_behavior) = REQUIRED];
}

