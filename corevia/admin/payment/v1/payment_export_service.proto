syntax = "proto3";

package admin.payment.v1;

import "common/pagination/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "payment/v1/export.proto";
import "payment/v1/payment_administration.proto";
import "validate/validate.proto";

// 支付导出服务。
service PaymentExportService {
  // 创建 PaymentExportJob。
  rpc CreatePaymentExportJob(AdminCreatePaymentExportJobRequest) returns (.payment.v1.PaymentExportJob) {
    option (google.api.http) = { post: "/admin/v1/payment-exports" body: "*" };
  }
  // 查询 PaymentExportJob。
  rpc GetPaymentExportJob(AdminGetPaymentExportJobRequest) returns (.payment.v1.PaymentExportJob) {
    option (google.api.http) = { get: "/admin/v1/payment-exports/{job_no}" };
  }
  // 查询 PaymentExportJob 列表。
  rpc ListPaymentExportJobs(.common.pagination.v1.PagingRequest) returns (.payment.v1.ListPaymentExportJobsResponse) {
    option (google.api.http) = { get: "/admin/v1/payment-exports" };
  }
  // 创建 PaymentExportDownload。
  rpc CreatePaymentExportDownload(AdminCreatePaymentExportDownloadRequest) returns (.payment.v1.PaymentExportDownload) {
    option (google.api.http) = { post: "/admin/v1/payment-exports/{job_no}:download" body: "*" };
  }
}

// AdminCreatePaymentExportJobRequest 定义创建 PaymentExportJob 的幂等命令参数。
message AdminCreatePaymentExportJobRequest {
  // filter 限定本次查询采用的筛选条件。
  .payment.v1.PaymentSearchFilter filter = 1;
  // fields 列出 CreatePaymentExportJob 关联的 PaymentExportField。
  repeated .payment.v1.PaymentExportField fields = 2 [(validate.rules).repeated = {min_items: 1, max_items: 13, unique: true}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// AdminGetPaymentExportJobRequest 标识待查询的 PaymentExportJob。
message AdminGetPaymentExportJobRequest {
  // job_no 是 GetPaymentExportJob 对外关联与审计使用的业务编号。
  string job_no = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// AdminCreatePaymentExportDownloadRequest 定义创建 PaymentExportDownload 的命令参数。
message AdminCreatePaymentExportDownloadRequest {
  // job_no 是 CreatePaymentExportDownload 对外关联与审计使用的业务编号。
  string job_no = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}
