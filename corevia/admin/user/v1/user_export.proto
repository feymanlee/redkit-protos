syntax = "proto3";

package admin.user.v1;

import "common/pagination/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "user/administration/v1/administration.proto";
import "user/administration/v1/export.proto";
import "validate/validate.proto";

// 用户导出服务。
service UserExportService {
  // 创建 UserExportJob。
  rpc CreateUserExportJob(AdminCreateUserExportJobRequest) returns (.user.administration.v1.UserExportJob) {
    option (google.api.http) = {post: "/admin/v1/user-exports" body: "*"};
  }
  // 查询 UserExportJob 列表。
  rpc ListUserExportJobs(AdminListUserExportJobsRequest) returns (.user.administration.v1.ListUserExportJobsResponse) {
    option (google.api.http) = {get: "/admin/v1/user-exports"};
  }
  // 查询 UserExportDownload。
  rpc GetUserExportDownload(AdminGetUserExportDownloadRequest) returns (.user.administration.v1.UserExportDownload) {
    option (google.api.http) = {post: "/admin/v1/user-exports/{job_id}:download" body: "*"};
  }
}

// AdminCreateUserExportJobRequest 定义创建 UserExportJob 的幂等命令参数。
message AdminCreateUserExportJobRequest {
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 512}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // search 承载 CreateUserExportJob 关联的 UserSearchQuery。
  .user.administration.v1.UserSearchQuery search = 3;
  // filter 限定本次查询采用的筛选条件。
  .user.administration.v1.UserSearchFilter filter = 4;
}

// AdminListUserExportJobsRequest 定义 UserExportJobs 的筛选与分页参数。
message AdminListUserExportJobsRequest {
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 1;
}

// AdminGetUserExportDownloadRequest 标识待查询的 UserExportDownload。
message AdminGetUserExportDownloadRequest {
  // job_id 标识关联的 Job。
  uint64 job_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
}
