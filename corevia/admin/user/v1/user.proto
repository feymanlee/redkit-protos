// AdminRevealUserPIIRequest 定义执行 RevealUserPII 的命令参数。
message AdminRevealUserPIIRequest {
  // user_id 标识当前 App 内关联的 User。
  uint64 user_id = 1;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 2;
