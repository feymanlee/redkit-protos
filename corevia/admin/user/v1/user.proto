  ];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 128
    }
  ];
}
// AdminBeginAccountClosureRequest 定义开始 AccountClosure 的幂等管理命令参数。
