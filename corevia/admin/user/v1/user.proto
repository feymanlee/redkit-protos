message AdminListUserSecurityNoticesRequest {
  // user_id 标识当前 App 内关联的 User。
  uint64 user_id = 1;
  // paging 指定分页大小和游标等查询参数。
  .common.pagination.v1.PagingRequest paging = 2;
}
// AdminResendUserSecurityNoticeRequest 定义执行 ResendUserSecurityNotice 的幂等管理命令参数。
message AdminResendUserSecurityNoticeRequest {
  // user_id 标识当前 App 内关联的 User。
  uint64 user_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).uint64.gt = 0
  ];
  // notice_no 是 ResendUserSecurityNotice 对外关联与审计使用的业务编号。
  string notice_no = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 64
    }
  ];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 512
    }
  ];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 4 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 128
    }
  ];
}
