syntax = "proto3";

package ops.reward.v1;

import "errors/errors.proto";

// Reward 管理错误原因。
enum RewardErrorReason {
  option (errors.default_code) = 500;

  // BAD_REQUEST 表示因 BAD_REQUEST 条件导致流程无法按原路径继续。
  BAD_REQUEST = 0 [(errors.code) = 400];
  // UNAUTHORIZED 表示因 UNAUTHORIZED 条件导致流程无法按原路径继续。
  UNAUTHORIZED = 100 [(errors.code) = 401];
  // FORBIDDEN 表示因 FORBIDDEN 条件导致流程无法按原路径继续。
  FORBIDDEN = 300 [(errors.code) = 403];
  // NOT_FOUND 表示因 NOT_FOUND 条件导致流程无法按原路径继续。
  NOT_FOUND = 400 [(errors.code) = 404];
  // CONFLICT 表示因 CONFLICT 条件导致流程无法按原路径继续。
  CONFLICT = 900 [(errors.code) = 409];
  // 当前不可供业务流程选择或使用。
  SAFETY_BASELINE_UNAVAILABLE = 901 [(errors.code) = 409];
  // 处理失败；是否可重试由具体失败原因决定。
  PREFLIGHT_FAILED = 902 [(errors.code) = 409];
  // IMMUTABLE_REVISION 表示因 IMMUTABLE_REVISION 条件导致流程无法按原路径继续。
  IMMUTABLE_REVISION = 903 [(errors.code) = 409];
  // USER_NOT_ELIGIBLE 表示因 USER_NOT_ELIGIBLE 条件导致流程无法按原路径继续。
  USER_NOT_ELIGIBLE = 904 [(errors.code) = 403];
  // 已超过契约允许的数量、额度或处理上限。
  DAILY_QUOTA_EXCEEDED = 905 [(errors.code) = 409];
  // SELF_REVIEW_FORBIDDEN 表示因 SELF_REVIEW_FORBIDDEN 条件导致流程无法按原路径继续。
  SELF_REVIEW_FORBIDDEN = 906 [(errors.code) = 403];
  // MANUAL_GRANT_STALE 表示因 MANUAL_GRANT_STALE 条件导致流程无法按原路径继续。
  MANUAL_GRANT_STALE = 907 [(errors.code) = 409];
  // INTERNAL_SERVER_ERROR 表示因 INTERNAL_SERVER_ERROR 条件导致流程无法按原路径继续。
  INTERNAL_SERVER_ERROR = 2000 [(errors.code) = 500];
  // 当前不可供业务流程选择或使用。
  SERVICE_UNAVAILABLE = 2300 [(errors.code) = 503];
}
