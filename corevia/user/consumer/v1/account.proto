syntax = "proto3";

package user.consumer.v1;

import "common/v1/common.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "user/consumer/v1/authentication.proto";
import "user/types/v1/types.proto";

// C 端账号服务，负责当前 App 内需要 step-up 证明的账号标识和生命周期操作。
service ConsumerAccountService {
  // 使用 step_up_token 幂等变更 UserCode，并返回更新后的账号与 TokenPair。
  rpc ChangeUserCode(ChangeUserCodeRequest) returns (ChangeUserCodeResponse);
  // 使用 step_up_token 幂等发起带冷静期的 AccountClosure。
  rpc BeginAccountClosure(BeginAccountClosureRequest) returns (AccountClosureAccess);
  // 查询当前账号可见的 AccountClosure 状态、阻塞原因及参与方进度。
  rpc GetAccountClosure(GetAccountClosureRequest) returns (AccountClosure);
  // 使用 closure_access_token 和强证明幂等取消尚未进入不可逆阶段的 AccountClosure。
  rpc CancelAccountClosure(CancelAccountClosureRequest) returns (AccountClosure);
}

// ChangeUserCodeRequest 定义执行 ChangeUserCode 的幂等管理命令参数。
message ChangeUserCodeRequest {
  // app_id 限定 ChangeUserCode 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // user_code 提供 ChangeUserCode 对外稳定使用的业务编码。
  string user_code = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 3, max_len: 20}];
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// ChangeUserCodeResponse 承载 ChangeUserCode 的返回结果。
message ChangeUserCodeResponse {
  // account 承载 ChangeUserCode 关联的 Account。
  user.types.v1.Account account = 1;
  // tokens 承载 ChangeUserCode 关联的 TokenPair。
  user.types.v1.TokenPair tokens = 2;
}

// AccountClosureStatus 刻画对应资源的生命周期状态。
enum AccountClosureStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  ACCOUNT_CLOSURE_STATUS_UNSPECIFIED = 0;
  // ACCOUNT_CLOSURE_STATUS_COOLING 表示资源处于对应业务阶段。
  ACCOUNT_CLOSURE_STATUS_COOLING = 1;
  // 正在处理中，尚未形成终态。
  ACCOUNT_CLOSURE_STATUS_PREPARING = 2;
  // ACCOUNT_CLOSURE_STATUS_CANCELING 表示资源处于对应业务阶段。
  ACCOUNT_CLOSURE_STATUS_CANCELING = 3;
  // 正在处理中，尚未形成终态。
  ACCOUNT_CLOSURE_STATUS_RUNNING = 4;
  // 处理被阻塞，需要外部处置后才能继续。
  ACCOUNT_CLOSURE_STATUS_BLOCKED = 5;
  // 处理被阻塞，需要外部处置后才能继续。
  ACCOUNT_CLOSURE_STATUS_STALLED = 6;
  // 处理已成功完成。
  ACCOUNT_CLOSURE_STATUS_COMPLETED = 7;
  // 处理已取消，不再继续推进。
  ACCOUNT_CLOSURE_STATUS_CANCELED = 8;
}

// AccountClosureParticipantType 区分对应资源的业务类型。
enum AccountClosureParticipantType {
  // 未提供有效取值；调用方不得据此推断业务状态。
  ACCOUNT_CLOSURE_PARTICIPANT_TYPE_UNSPECIFIED = 0;
  // ACCOUNT_CLOSURE_PARTICIPANT_TYPE_ENGAGEMENT 选择 ENGAGEMENT 业务类型。
  ACCOUNT_CLOSURE_PARTICIPANT_TYPE_ENGAGEMENT = 1;
  // ACCOUNT_CLOSURE_PARTICIPANT_TYPE_WALLET 选择 WALLET 业务类型。
  ACCOUNT_CLOSURE_PARTICIPANT_TYPE_WALLET = 2;
  // ACCOUNT_CLOSURE_PARTICIPANT_TYPE_GIFT 选择 GIFT 业务类型。
  ACCOUNT_CLOSURE_PARTICIPANT_TYPE_GIFT = 3;
  // ACCOUNT_CLOSURE_PARTICIPANT_TYPE_PAYMENT 选择 PAYMENT 业务类型。
  ACCOUNT_CLOSURE_PARTICIPANT_TYPE_PAYMENT = 4;
}

// AccountClosureParticipantStatus 刻画对应资源的生命周期状态。
enum AccountClosureParticipantStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_UNSPECIFIED = 0;
  // 已受理并等待后续处理。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_PENDING = 1;
  // ACCOUNT_CLOSURE_PARTICIPANT_STATUS_PREPARED 表示资源处于对应业务阶段。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_PREPARED = 2;
  // 正在处理中，尚未形成终态。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_APPLYING = 3;
  // 处理已成功完成。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_SUCCEEDED = 4;
  // 处理被阻塞，需要外部处置后才能继续。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_BLOCKED = 5;
  // 处理失败；是否可重试由具体失败原因决定。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_FAILED = 6;
  // 处理已取消，不再继续推进。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_CANCELED = 7;
}

// AccountClosureBlockerCode 区分调用方可判断的业务原因。
enum AccountClosureBlockerCode {
  // 未提供有效取值；调用方不得据此推断业务状态。
  ACCOUNT_CLOSURE_BLOCKER_CODE_UNSPECIFIED = 0;
  // ACCOUNT_CLOSURE_BLOCKER_CODE_OUTSTANDING_DEBT 表示 OUTSTANDING_DEBT 条件阻止当前流程继续。
  ACCOUNT_CLOSURE_BLOCKER_CODE_OUTSTANDING_DEBT = 1;
  // ACCOUNT_CLOSURE_BLOCKER_CODE_ACTIVE_SUBSCRIPTION 表示 ACTIVE_SUBSCRIPTION 条件阻止当前流程继续。
  ACCOUNT_CLOSURE_BLOCKER_CODE_ACTIVE_SUBSCRIPTION = 2;
  // ACCOUNT_CLOSURE_BLOCKER_CODE_PENDING_SETTLEMENT 表示 PENDING_SETTLEMENT 条件阻止当前流程继续。
  ACCOUNT_CLOSURE_BLOCKER_CODE_PENDING_SETTLEMENT = 3;
  // ACCOUNT_CLOSURE_BLOCKER_CODE_PENDING_REWARD 表示 PENDING_REWARD 条件阻止当前流程继续。
  ACCOUNT_CLOSURE_BLOCKER_CODE_PENDING_REWARD = 4;
  // ACCOUNT_CLOSURE_BLOCKER_CODE_ACTIVE_BENEFIT 表示 ACTIVE_BENEFIT 条件阻止当前流程继续。
  ACCOUNT_CLOSURE_BLOCKER_CODE_ACTIVE_BENEFIT = 5;
}

// AccountClosureParticipant 记录一个 bounded context 对 Account Closure 的处理状态。
message AccountClosureParticipant {
  // type 区分 AccountClosureParticipant 的业务类型。
  AccountClosureParticipantType type = 1;
  // status 表示 AccountClosureParticipant 当前可观察的生命周期状态。
  AccountClosureParticipantStatus status = 2;
  // blocker_codes 列出 AccountClosureParticipant 关联的 AccountClosureBlockerCode。
  repeated AccountClosureBlockerCode blocker_codes = 3;
}

// AccountClosure 表示一次 Account Closure 流程及其参与者状态。
message AccountClosure {
  // closure_no 是 AccountClosure 对外关联与审计使用的业务编号。
  string closure_no = 1;
  // status 表示 AccountClosure 当前可观察的生命周期状态。
  AccountClosureStatus status = 2;
  // cancelable 显式表示 AccountClosure 是否满足该条件。
  bool cancelable = 3;
  // irreversible_started 显式表示 AccountClosure 是否满足该条件。
  bool irreversible_started = 4;
  // cooling_until 指定 AccountClosure 查询或生效区间的结束边界。
  google.protobuf.Timestamp cooling_until = 5;
  // participants 列出 AccountClosure 关联的 AccountClosureParticipant。
  repeated AccountClosureParticipant participants = 6;
  // created_at 记录 AccountClosure 的创建时间。
  google.protobuf.Timestamp created_at = 7;
  // updated_at 记录 AccountClosure 最近一次更新的时间。
  google.protobuf.Timestamp updated_at = 8;
  // completed_at 记录 AccountClosure 对应业务阶段的时间点。
  google.protobuf.Timestamp completed_at = 9;
}

// BeginAccountClosureRequest 定义开始 AccountClosure 的幂等管理命令参数。
message BeginAccountClosureRequest {
  // app_id 限定 BeginAccountClosure 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// AccountClosureAccess 承载 BeginAccountClosure 调用的返回结果。
message AccountClosureAccess {
  // closure 承载 AccountClosureAccess 关联的 AccountClosure。
  AccountClosure closure = 1;
  // closure_access_token 承载敏感凭据或校验材料，不得写入普通日志。
  string closure_access_token = 2;
  // expires_at 指定 AccountClosureAccess 失效的时间点。
  google.protobuf.Timestamp expires_at = 3;
}

// GetAccountClosureRequest 标识待查询的 AccountClosure。
message GetAccountClosureRequest {
  // app_id 限定 GetAccountClosure 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // closure_no 是 GetAccountClosure 对外关联与审计使用的业务编号。
  string closure_no = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // closure_access_token 承载敏感凭据或校验材料，不得写入普通日志。
  string closure_access_token = 3 [(validate.rules).string.max_len = 512];
}

// CancelAccountClosureRequest 定义取消 AccountClosure 的幂等管理命令参数。
message CancelAccountClosureRequest {
  // app_id 限定 CancelAccountClosure 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // closure_no 是 CancelAccountClosure 对外关联与审计使用的业务编号。
  string closure_no = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // closure_access_token 承载敏感凭据或校验材料，不得写入普通日志。
  string closure_access_token = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // CancelAccountClosureRequest 在以下身份或安全证明中选择一种。
  oneof strong_proof {
    option (validate.required) = true;
    // password 承载敏感凭据或校验材料，不得写入普通日志。
    string password = 5 [(validate.rules).string = {min_len: 1, max_len: 256}];
    // totp_code 承载一次性认证因子，不得写入普通日志。
    string totp_code = 6 [(validate.rules).string = {pattern: "^[0-9]{6}$"}];
    // recovery_code 承载一次性认证因子，不得写入普通日志。
    string recovery_code = 7 [(validate.rules).string = {min_len: 8, max_len: 128}];
    // external_identity 记录外部或上游系统用于稳定关联 CancelAccountClosure 的身份。
    ExternalIdentityProof external_identity = 8 [(validate.rules).message = {required: true}];
  }
}
