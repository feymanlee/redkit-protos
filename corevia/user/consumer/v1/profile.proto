syntax = "proto3";

package user.consumer.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "validate/validate.proto";
import "user/types/v1/types.proto";

// C 端用户资料服务。
service ConsumerProfileService {
  // 查询 CurrentUser。
  rpc GetCurrentUser(GetCurrentUserRequest) returns (CurrentUser);
  // 更新 Profile。
  rpc UpdateProfile(UpdateProfileRequest) returns (user.types.v1.Profile);
  // 查询 PublicProfile。
  rpc GetPublicProfile(GetPublicProfileRequest) returns (user.types.v1.PublicProfile);
  // 使用 step_up_token 幂等变更 UserCode，并返回更新后的 User 与 TokenPair。
  rpc ChangeUserCode(ChangeUserCodeRequest) returns (ChangeUserCodeResponse);
}

// ChangeUserCodeRequest 定义执行 ChangeUserCode 的幂等管理命令参数。
message ChangeUserCodeRequest {
  // user_code 提供 ChangeUserCode 对外稳定使用的业务编码。
  string user_code = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 3, max_len: 20}];
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// ChangeUserCodeResponse 承载 ChangeUserCode 的返回结果。
message ChangeUserCodeResponse {
  // user 承载 ChangeUserCode 关联的 User。
  user.types.v1.User user = 1;
  // tokens 承载 ChangeUserCode 关联的 TokenPair。
  user.types.v1.TokenPair tokens = 2;
}

// GetCurrentUserRequest 标识待查询的 CurrentUser。
message GetCurrentUserRequest {
}

// CurrentUser 承载 GetCurrentUser 调用的返回结果。
message CurrentUser {
  // user 承载 CurrentUser 关联的 User。
  user.types.v1.User user = 1;
  // profile 承载 CurrentUser 关联的 Profile。
  user.types.v1.Profile profile = 2;
  // security 承载 CurrentUser 关联的 SecurityOverview。
  user.types.v1.SecurityOverview security = 3;
  // capabilities 承载 CurrentUser 关联的 ConsumerUserCapabilities。
  user.types.v1.ConsumerUserCapabilities capabilities = 4;
}

// ProfilePatch 承载 User Profile 的局部更新；presence 表示是否修改。
message ProfilePatch {
  // nickname 承载用户资料或其脱敏展示值，按个人信息保护。
  string nickname = 1;
  // avatar_file_id 标识关联的 AvatarFile。
  uint64 avatar_file_id = 2;
  // gender 承载用户资料或其脱敏展示值，按个人信息保护。
  string gender = 3;
  // region 指定号码、服务或业务规则采用的地区。
  string region = 4;
  // description 提供 ProfilePatch 的补充说明。
  string description = 5;
}

// UpdateProfileRequest 定义更新 Profile 的命令参数。
message UpdateProfileRequest {
  // data 承载 UpdateProfile 对应阶段的结构化业务内容。
  ProfilePatch data = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).message.required = true];
  // update_mask 指定本次请求允许局部更新的字段路径。
  google.protobuf.FieldMask update_mask = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).message.required = true];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// GetPublicProfileRequest 标识待查询的 PublicProfile。
message GetPublicProfileRequest {
  // GetPublicProfileRequest 使用以下一种查询表达式。
  oneof query {
    option (validate.required) = true;
    // user_id 标识关联的 User。
    uint64 user_id = 2 [(validate.rules).uint64.gt = 0];
    // user_code 提供 GetPublicProfile 对外稳定使用的业务编码。
    string user_code = 3 [(validate.rules).string = {min_len: 1, max_len: 20}];
  }
}
