syntax = "proto3";

package user.consumer.v1;

import "common/v1/common.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "user/types/v1/types.proto";

// C 端认证服务，负责当前 App 的注册、登录、Token 换取和密码重置流程。
service ConsumerAuthenticationService {
  // 查询当前 App 公开的注册、登录和认证策略，不返回密钥或内部风控配置。
  rpc GetAuthenticationOptions(GetAuthenticationOptionsRequest) returns (AuthenticationOptions);
  // 注册当前 App 的用户，并返回认证结果或仍需完成的账号动作。
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 验证登录凭据，并返回认证结果、二次挑战或仍需完成的账号动作。
  rpc Login(LoginRequest) returns (LoginResponse);
  // 在既有 LoginChallenge 下幂等请求重新发送允许的验证因子。
  rpc ResendLoginChallenge(ResendLoginChallengeRequest) returns (LoginChallenge);
  // 验证 LoginChallenge 的一个允许因子，并返回认证结果或后续账号动作。
  rpc CompleteLoginChallenge(CompleteLoginChallengeRequest) returns (LoginResponse);
  // 使用当前 App 与安装实例绑定的 refresh_token 幂等换取 TokenPair。
  rpc RefreshToken(RefreshTokenRequest) returns (user.types.v1.TokenPair);
  // 幂等撤销当前会话。
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);
  // 使用已验证手机号发起密码重置，并返回短期 continuation_token。
  rpc StartPasswordReset(StartPasswordResetRequest) returns (StartPasswordResetResponse);
  // 验证 TOTP 或 recovery code，并签发短期 password_reset_token。
  rpc CompletePasswordResetChallenge(CompletePasswordResetChallengeRequest) returns (PasswordResetAuthorization);
  // 使用 password_reset_token 幂等设置新密码并完成密码重置。
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (google.protobuf.Empty);
  // 使用登录流程签发的 action_token 设置新密码并恢复认证态。
  rpc CompleteRequiredPasswordReset(CompleteRequiredPasswordResetRequest) returns (AuthenticationResult);
}

// GetAuthenticationOptionsRequest 标识待查询的 AuthenticationOptions。
message GetAuthenticationOptionsRequest {
  // app_id 限定 GetAuthenticationOptions 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
}

// AuthenticationOptions 承载 GetAuthenticationOptions 调用的返回结果。
message AuthenticationOptions {
  // registration_enabled 显式表示 AuthenticationOptions 是否满足该条件。
  bool registration_enabled = 1;
  // registration_methods 列出 AuthenticationOptions 关联的 AuthenticationMethod。
  repeated user.types.v1.AuthenticationMethod registration_methods = 2;
  // login_methods 列出 AuthenticationOptions 关联的 AuthenticationMethod。
  repeated user.types.v1.AuthenticationMethod login_methods = 3;
  // phone_binding_requirement 承载 AuthenticationOptions 关联的 PhoneBindingRequirement。
  user.types.v1.PhoneBindingRequirement phone_binding_requirement = 4;
  // totp_required 显式表示 AuthenticationOptions 是否满足该条件。
  bool totp_required = 5;
  // password_min_length 限定可接受密码的最小字符数。
  uint32 password_min_length = 6;
  // password_max_length 限定可接受密码的最大字符数。
  uint32 password_max_length = 7;
  // access_token_ttl_seconds 以秒表示对应流程的持续时间或上限。
  uint32 access_token_ttl_seconds = 8;
  // refresh_token_ttl_seconds 以秒表示对应流程的持续时间或上限。
  uint32 refresh_token_ttl_seconds = 9;
}

// PhoneOtpProof 承载手机号与一次性验证票据组成的敏感认证证明。
message PhoneOtpProof {
  // phone 承载按约定地区规则规范化的手机号码。
  string phone = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {pattern: "^\\+[1-9][0-9]{7,14}$"}];
  // verification_ticket 承载流程继续所需的短期校验凭据，不得写入普通日志。
  string verification_ticket = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 16, max_len: 2048}];
}

// PhonePasswordProof 承载手机号与密码组成的敏感认证证明。
message PhonePasswordProof {
  // phone 承载按约定地区规则规范化的手机号码。
  string phone = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {pattern: "^\\+[1-9][0-9]{7,14}$"}];
  // password 承载敏感凭据或校验材料，不得写入普通日志。
  string password = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 256}];
}

// ExternalIdentityProof 承载外部身份 Provider 提供的敏感认证证明。
message ExternalIdentityProof {
  // provider 标识本次能力使用的外部 Provider。
  user.types.v1.ExternalIdentityProvider provider = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // provider_token 承载敏感凭据或校验材料，不得写入普通日志。
  string provider_token = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 16, max_len: 8192}];
}

// RegisterRequest 定义执行 Register 的幂等管理命令参数。
message RegisterRequest {
  // app_id 限定 Register 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // RegisterRequest 在以下身份或安全证明中选择一种。
  oneof proof {
    option (validate.required) = true;
    // phone_otp 承载 Register 关联的 PhoneOtpProof。
    PhoneOtpProof phone_otp = 2;
    // external_identity 记录外部或上游系统用于稳定关联 Register 的身份。
    ExternalIdentityProof external_identity = 3;
  }
  // client 承载 Register 关联的 ConsumerClientContext。
  user.types.v1.ConsumerClientContext client = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).message.required = true];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// AuthenticationResult 承载 CompleteRequiredPasswordReset 调用的返回结果。
message AuthenticationResult {
  // user 承载 AuthenticationResult 关联的 User。
  user.types.v1.User user = 1;
  // session 承载 AuthenticationResult 关联的 Session。
  user.types.v1.Session session = 2;
  // tokens 承载 AuthenticationResult 关联的 TokenPair。
  user.types.v1.TokenPair tokens = 3;
}

// UserActionType 区分对应资源的业务类型。
enum UserActionType {
  // 未提供有效取值；调用方不得据此推断业务状态。
  USER_ACTION_TYPE_UNSPECIFIED = 0;
  // USER_ACTION_TYPE_PHONE_BINDING_REQUIRED 表示该业务条件为必需。
  USER_ACTION_TYPE_PHONE_BINDING_REQUIRED = 1;
  // USER_ACTION_TYPE_TOTP_ENROLLMENT_REQUIRED 表示该业务条件为必需。
  USER_ACTION_TYPE_TOTP_ENROLLMENT_REQUIRED = 2;
  // USER_ACTION_TYPE_PASSWORD_RESET_REQUIRED 表示该业务条件为必需。
  USER_ACTION_TYPE_PASSWORD_RESET_REQUIRED = 3;
  // 4 曾是 USER_ACTION_TYPE_USER_MERGE_IN_PROGRESS；账号合并已下线，编号与名称保持保留，不得复用。
  reserved 4;
  reserved "USER_ACTION_TYPE_USER_MERGE_IN_PROGRESS";
  // USER_ACTION_TYPE_USER_DELETION_IN_PROGRESS 选择 USER_DELETION_IN_PROGRESS 业务类型。
  USER_ACTION_TYPE_USER_DELETION_IN_PROGRESS = 5;
}

// UserAction 描述 User 状态要求调用方继续执行的动作。
message UserAction {
  // type 区分 UserAction 的业务类型。
  UserActionType type = 1;
  // action_token 承载敏感凭据或校验材料，不得写入普通日志。
  string action_token = 2;
  // user 承载 UserAction 关联的 User。
  user.types.v1.User user = 3;
  // expires_at 指定 UserAction 失效的时间点。
  google.protobuf.Timestamp expires_at = 4;
}

// RegisterResponse 承载 Register 的返回结果。
message RegisterResponse {
  // RegisterResponse 仅承载以下一种可观察结果。
  oneof outcome {
    // authenticated 承载 Register 关联的 AuthenticationResult。
    AuthenticationResult authenticated = 1;
    // action_required 承载 Register 关联的 UserAction。
    UserAction action_required = 2;
  }
}

// LoginRequest 定义执行 Login 的幂等管理命令参数。
message LoginRequest {
  // app_id 限定 Login 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // LoginRequest 在以下身份或安全证明中选择一种。
  oneof proof {
    option (validate.required) = true;
    // phone_otp 承载 Login 关联的 PhoneOtpProof。
    PhoneOtpProof phone_otp = 2;
    // phone_password 承载敏感凭据或校验材料，不得写入普通日志。
    PhonePasswordProof phone_password = 3;
    // external_identity 记录外部或上游系统用于稳定关联 Login 的身份。
    ExternalIdentityProof external_identity = 4;
  }
  // client 承载 Login 关联的 ConsumerClientContext。
  user.types.v1.ConsumerClientContext client = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).message.required = true];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 6 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// LoginChallengeFactor 定义对应业务维度允许使用的离散取值。
enum LoginChallengeFactor {
  // 未提供有效取值；调用方不得据此推断业务状态。
  LOGIN_CHALLENGE_FACTOR_UNSPECIFIED = 0;
  // LOGIN_CHALLENGE_FACTOR_PHONE_OTP 使用 PHONE_OTP 作为认证或 Step-up 因子。
  LOGIN_CHALLENGE_FACTOR_PHONE_OTP = 1;
  // LOGIN_CHALLENGE_FACTOR_TOTP 使用 TOTP 作为认证或 Step-up 因子。
  LOGIN_CHALLENGE_FACTOR_TOTP = 2;
  // LOGIN_CHALLENGE_FACTOR_RECOVERY_CODE 使用 RECOVERY_CODE 作为认证或 Step-up 因子。
  LOGIN_CHALLENGE_FACTOR_RECOVERY_CODE = 3;
}

// LoginChallenge 承载 ResendLoginChallenge 调用的返回结果。
message LoginChallenge {
  // challenge_token 承载敏感凭据或校验材料，不得写入普通日志。
  string challenge_token = 1;
  // allowed_factors 列出 LoginChallenge 关联的 LoginChallengeFactor。
  repeated LoginChallengeFactor allowed_factors = 2;
  // masked_target 承载用户资料或其脱敏展示值，按个人信息保护。
  string masked_target = 3;
  // expires_at 指定 LoginChallenge 失效的时间点。
  google.protobuf.Timestamp expires_at = 4;
  // resend_at 指定 LoginChallenge 生效或查询区间的结束时间。
  google.protobuf.Timestamp resend_at = 5;
}

// LoginResponse 承载 Login 的返回结果。
message LoginResponse {
  // LoginResponse 仅承载以下一种可观察结果。
  oneof outcome {
    // authenticated 承载 Login 关联的 AuthenticationResult。
    AuthenticationResult authenticated = 1;
    // challenge 承载 Login 关联的 LoginChallenge。
    LoginChallenge challenge = 2;
    // action_required 承载 Login 关联的 UserAction。
    UserAction action_required = 3;
  }
}

// ResendLoginChallengeRequest 定义执行 ResendLoginChallenge 的幂等管理命令参数。
message ResendLoginChallengeRequest {
  // app_id 限定 ResendLoginChallenge 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // challenge_token 承载敏感凭据或校验材料，不得写入普通日志。
  string challenge_token = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // client 承载 ResendLoginChallenge 关联的 ConsumerClientContext。
  user.types.v1.ConsumerClientContext client = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).message.required = true];
}

