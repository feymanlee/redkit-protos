  // CompleteLoginChallengeRequest 在以下身份或安全证明中选择一种。
  oneof proof {
    option (validate.required) = true;
    // phone_code 承载一次性认证因子，不得写入普通日志。
    string phone_code = 3;
    // totp_code 承载一次性认证因子，不得写入普通日志。
    string totp_code = 4;
    // recovery_code 承载一次性认证因子，不得写入普通日志。
    string recovery_code = 5;
  }
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 6 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // client 承载 CompleteLoginChallenge 关联的 ConsumerClientContext。
  user.types.v1.ConsumerClientContext client = 7 [(google.api.field_behavior) = REQUIRED, (validate.rules).message.required = true];
