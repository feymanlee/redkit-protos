syntax = "proto3";

package user.consumer.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "validate/validate.proto";
import "user/types/v1/types.proto";

// C 端会话服务，管理已认证用户的会话、设备和设备恢复公钥。
service ConsumerSessionService {
  // 分页查询当前用户的 Session 列表。
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // 按 session_id 幂等撤销当前用户的一条 Session。
  rpc RevokeSession(RevokeSessionRequest) returns (google.protobuf.Empty);
  // 使用 step_up_token 撤销当前会话之外的全部 Session，并返回当前会话的新 TokenPair。
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (user.types.v1.TokenPair);
  // 使用 step_up_token 幂等撤销当前用户的全部 Session，包括当前会话。
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (google.protobuf.Empty);
  // 分页查询当前用户登记的 Device 列表。
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // 使用 step_up_token 幂等撤销指定 Device 及其会话，并说明当前会话是否同时失效。
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // 校验当前设备的 proof_signature 和 step_up_token，幂等登记恢复公钥。
  rpc RegisterCurrentDeviceRecoveryKey(RegisterCurrentDeviceRecoveryKeyRequest) returns (user.types.v1.Device);
  // 使用 step_up_token 幂等移除当前设备的恢复公钥。
  rpc RemoveCurrentDeviceRecoveryKey(RemoveCurrentDeviceRecoveryKeyRequest) returns (user.types.v1.Device);
}

// ListSessionsRequest 定义 Sessions 的筛选与分页参数。
message ListSessionsRequest {
  // page 返回继续分页所需的游标和结果规模信息。
  user.types.v1.CursorPageRequest page = 2;
}

// ListSessionsResponse 返回 Sessions 结果集合及分页信息。
message ListSessionsResponse {
  // items 包含本次返回或处理的业务条目。
  repeated user.types.v1.Session items = 1;
  // page 返回继续分页所需的游标和结果规模信息。
  user.types.v1.CursorPageResponse page = 2;
}

// RevokeSessionRequest 定义撤销 Session 的幂等管理命令参数。
message RevokeSessionRequest {
  // session_id 标识关联的 Session。
  string session_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 64}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// RevokeOtherSessionsRequest 定义撤销 OtherSessions 的幂等管理命令参数。
message RevokeOtherSessionsRequest {
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// RevokeAllSessionsRequest 定义撤销 AllSessions 的幂等管理命令参数。
message RevokeAllSessionsRequest {
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// ListDevicesRequest 定义 Devices 的筛选与分页参数。
message ListDevicesRequest {
  // page 返回继续分页所需的游标和结果规模信息。
  user.types.v1.CursorPageRequest page = 2;
}

// ListDevicesResponse 返回 Devices 结果集合及分页信息。
message ListDevicesResponse {
  // items 包含本次返回或处理的业务条目。
  repeated user.types.v1.Device items = 1;
  // page 返回继续分页所需的游标和结果规模信息。
  user.types.v1.CursorPageResponse page = 2;
}

// RevokeDeviceRequest 定义撤销 Device 的幂等管理命令参数。
message RevokeDeviceRequest {
  // device_id 标识关联的 Device。
  uint64 device_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// RevokeDeviceResponse 承载 RevokeDevice 的返回结果。
message RevokeDeviceResponse {
  // current_session_revoked 显式表示 RevokeDevice 是否满足该条件。
  bool current_session_revoked = 1;
  // tokens 承载 RevokeDevice 关联的 TokenPair。
  user.types.v1.TokenPair tokens = 2;
}

// RegisterCurrentDeviceRecoveryKeyRequest 定义执行 RegisterCurrentDeviceRecoveryKey 的幂等管理命令参数。
message RegisterCurrentDeviceRecoveryKeyRequest {
  // public_key 在约定作用域内稳定定位 RegisterCurrentDeviceRecoveryKey。
  bytes public_key = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).bytes = {min_len: 32, max_len: 32}];
  // proof_signature 承载敏感凭据或校验材料，不得写入普通日志。
  bytes proof_signature = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).bytes = {min_len: 64, max_len: 64}];
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// RemoveCurrentDeviceRecoveryKeyRequest 定义删除 CurrentDeviceRecoveryKey 的命令参数。
message RemoveCurrentDeviceRecoveryKeyRequest {
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}
