syntax = "proto3";

package user.consumer.v1;

import "errors/errors.proto";

// ConsumerUserErrorReason 区分调用方可判断的业务原因。
enum ConsumerUserErrorReason {
  option (errors.default_code) = 500;
  // INVALID_ARGUMENT 表示因 INVALID_ARGUMENT 条件导致流程无法按原路径继续。
  INVALID_ARGUMENT = 0 [(errors.code) = 400];
  // 处理失败；是否可重试由具体失败原因决定。
  AUTHENTICATION_FAILED = 100 [(errors.code) = 401];
  // CALLER_FORBIDDEN 表示因 CALLER_FORBIDDEN 条件导致流程无法按原路径继续。
  CALLER_FORBIDDEN = 300 [(errors.code) = 403];
  // RESOURCE_NOT_FOUND 表示因 RESOURCE_NOT_FOUND 条件导致流程无法按原路径继续。
  RESOURCE_NOT_FOUND = 400 [(errors.code) = 404];
  // CREDENTIAL_NOT_FOUND 表示因 CREDENTIAL_NOT_FOUND 条件导致流程无法按原路径继续。
  CREDENTIAL_NOT_FOUND = 401 [(errors.code) = 404];
  // SESSION_NOT_FOUND 表示因 SESSION_NOT_FOUND 条件导致流程无法按原路径继续。
  SESSION_NOT_FOUND = 402 [(errors.code) = 404];
  // DEVICE_NOT_FOUND 表示因 DEVICE_NOT_FOUND 条件导致流程无法按原路径继续。
  DEVICE_NOT_FOUND = 403 [(errors.code) = 404];
  // CREDENTIAL_ALREADY_BOUND 表示因 CREDENTIAL_ALREADY_BOUND 条件导致流程无法按原路径继续。
  CREDENTIAL_ALREADY_BOUND = 600 [(errors.code) = 409];
  // 当前不可供业务流程选择或使用。
  USER_CODE_UNAVAILABLE = 601 [(errors.code) = 409];
  // INVALID_USER_STATE 表示因 INVALID_USER_STATE 条件导致流程无法按原路径继续。
  INVALID_USER_STATE = 700 [(errors.code) = 412];
  // INVALID_RECOVERY_STATE 表示因 INVALID_RECOVERY_STATE 条件导致流程无法按原路径继续。
  INVALID_RECOVERY_STATE = 701 [(errors.code) = 412];
  // 702 曾是 INVALID_MERGE_STATE；账号合并已下线，编号与名称保持保留，不得复用。
  reserved 702;
  reserved "INVALID_MERGE_STATE";
  // INVALID_DELETION_STATE 表示因 INVALID_DELETION_STATE 条件导致流程无法按原路径继续。
  INVALID_DELETION_STATE = 703 [(errors.code) = 412];
  // LAST_CREDENTIAL 表示因 LAST_CREDENTIAL 条件导致流程无法按原路径继续。
  LAST_CREDENTIAL = 704 [(errors.code) = 412];
  // POLICY_VIOLATION 表示因 POLICY_VIOLATION 条件导致流程无法按原路径继续。
  POLICY_VIOLATION = 705 [(errors.code) = 412];
  // IDEMPOTENCY_CONFLICT 表示因 IDEMPOTENCY_CONFLICT 条件导致流程无法按原路径继续。
  IDEMPOTENCY_CONFLICT = 900 [(errors.code) = 409];
  // 正在处理中，尚未形成终态。
  OPERATION_PROCESSING = 901 [(errors.code) = 409];
  // RATE_LIMITED 表示因 RATE_LIMITED 条件导致流程无法按原路径继续。
  RATE_LIMITED = 1200 [(errors.code) = 429];
  // SESSION_LIMIT 表示因 SESSION_LIMIT 条件导致流程无法按原路径继续。
  SESSION_LIMIT = 1201 [(errors.code) = 429];
  // INTERNAL_SERVER_ERROR 表示因 INTERNAL_SERVER_ERROR 条件导致流程无法按原路径继续。
  INTERNAL_SERVER_ERROR = 2000 [(errors.code) = 500];
  // 当前不可供业务流程选择或使用。
  DEPENDENCY_UNAVAILABLE = 2300 [(errors.code) = 503];
}
