// LinkExternalIdentityRequest 定义执行 LinkExternalIdentity 的幂等管理命令参数。
message LinkExternalIdentityRequest {
  // provider 标识本次能力使用的外部 Provider。
  user.types.v1.ExternalIdentityProvider provider = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // provider_token 承载敏感凭据或校验材料，不得写入普通日志。
  string provider_token = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 16, max_len: 8192}];
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
