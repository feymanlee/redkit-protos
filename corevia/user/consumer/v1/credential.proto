syntax = "proto3";

package user.consumer.v1;

import "google/api/field_behavior.proto";
import "validate/validate.proto";
import "user/consumer/v1/authentication.proto";
import "user/types/v1/types.proto";

// C 端凭证服务。
service ConsumerCredentialService {
  // 查询 Credential 列表。
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // 绑定 Phone。
  rpc BindPhone(BindPhoneRequest) returns (CredentialMutationResponse);
  // 完成 RequiredPhoneBinding。
  rpc CompleteRequiredPhoneBinding(CompleteRequiredPhoneBindingRequest) returns (RegisterResponse);
  // 变更 Phone。
  rpc ChangePhone(ChangePhoneRequest) returns (CredentialMutationResponse);
  // 解绑 Phone。
  rpc UnbindPhone(UnbindPhoneRequest) returns (CredentialMutationResponse);
  // 设置 Password。
  rpc SetPassword(SetPasswordRequest) returns (CredentialMutationResponse);
  // 变更 Password。
  rpc ChangePassword(ChangePasswordRequest) returns (CredentialMutationResponse);
  // 关联 ExternalIdentity。
  rpc LinkExternalIdentity(LinkExternalIdentityRequest) returns (CredentialMutationResponse);
  // 解除关联 ExternalIdentity。
  rpc UnlinkExternalIdentity(UnlinkExternalIdentityRequest) returns (CredentialMutationResponse);
}

// ListCredentialsRequest 定义 Credentials 的筛选与分页参数。
message ListCredentialsRequest {
}

// ListCredentialsResponse 返回 Credentials 结果集合及分页信息。
message ListCredentialsResponse {
  // items 包含本次返回或处理的业务条目。
  repeated user.types.v1.Credential items = 1;
  // usable_count 记录 ListCredentials 中符合对应条件的数量。
  uint32 usable_count = 2;
}

// CredentialMutationResponse 承载 CredentialMutation 的返回结果。
message CredentialMutationResponse {
  // credentials 列出 CredentialMutation 关联的 Credential。
  repeated user.types.v1.Credential credentials = 1;
  // tokens 承载 CredentialMutation 关联的 TokenPair。
  user.types.v1.TokenPair tokens = 2;
  // current_session_revoked 显式表示 CredentialMutation 是否满足该条件。
  bool current_session_revoked = 3;
}

// BindPhoneRequest 定义绑定 Phone 的幂等管理命令参数。
message BindPhoneRequest {
  // phone 承载按约定地区规则规范化的手机号码。
  string phone = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {pattern: "^\\+[1-9][0-9]{7,14}$"}];
  // verification_ticket 承载流程继续所需的短期校验凭据，不得写入普通日志。
  string verification_ticket = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 16, max_len: 2048}];
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// CompleteRequiredPhoneBindingRequest 定义完成 RequiredPhoneBinding 的幂等管理命令参数。
message CompleteRequiredPhoneBindingRequest {
  // action_token 承载敏感凭据或校验材料，不得写入普通日志。
  string action_token = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // phone 承载按约定地区规则规范化的手机号码。
  string phone = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {pattern: "^\\+[1-9][0-9]{7,14}$"}];
  // verification_ticket 承载流程继续所需的短期校验凭据，不得写入普通日志。
  string verification_ticket = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 16, max_len: 2048}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// ChangePhoneRequest 定义执行 ChangePhone 的幂等管理命令参数。
message ChangePhoneRequest {
  // new_phone 承载按约定地区规则规范化的手机号码。
  string new_phone = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {pattern: "^\\+[1-9][0-9]{7,14}$"}];
  // verification_ticket 承载流程继续所需的短期校验凭据，不得写入普通日志。
  string verification_ticket = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 16, max_len: 2048}];
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// UnbindPhoneRequest 定义解绑 Phone 的幂等管理命令参数。
message UnbindPhoneRequest {
  // step_up_token 承载敏感凭据或校验材料，不得写入普通日志。
  string step_up_token = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 512}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
