syntax = "proto3";

package user.administration.v1;

import "google/protobuf/field_mask.proto";
import "user/administration/v1/types.proto";

// UserPolicyService 管理平台的用户与认证策略。
service UserPolicyService {
  // 查询 UserAppPolicy。
  rpc GetUserAppPolicy(GetUserAppPolicyRequest) returns (UserAppPolicy);
  // 更新 UserAppPolicy。
  rpc UpdateUserAppPolicy(UpdateUserAppPolicyRequest) returns (UserAppPolicy);
}
// GetUserAppPolicyRequest 标识待查询的 UserAppPolicy。
message GetUserAppPolicyRequest {
}
// UserAppPolicyPatch 描述对应能力的配置与约束。
message UserAppPolicyPatch {
  // enabled_credentials 列出 UserAppPolicyPatch 关联的 CredentialType。
  repeated CredentialType enabled_credentials = 1;
  // registration_enabled 显式表示 UserAppPolicyPatch 是否满足该条件。
  bool registration_enabled = 2;
  // auto_registration_enabled 显式表示 UserAppPolicyPatch 是否满足该条件。
  bool auto_registration_enabled = 3;
  // access_token_ttl_seconds 以秒表示对应流程的持续时间或上限。
  uint32 access_token_ttl_seconds = 4;
  // refresh_token_ttl_seconds 以秒表示对应流程的持续时间或上限。
  uint32 refresh_token_ttl_seconds = 5;
  // max_active_sessions 限定 UserAppPolicyPatch 对应操作允许使用的数量或阈值。
  uint32 max_active_sessions = 6;
  // max_login_attempts 记录 UserAppPolicyPatch 中符合对应条件的数量。
  uint32 max_login_attempts = 7;
  // lock_seconds 以秒表示对应流程的持续时间或上限。
  uint32 lock_seconds = 8;
  // mfa_required 显式表示 UserAppPolicyPatch 是否满足该条件。
  bool mfa_required = 9;
  // deletion_cooling_days 以天为单位指定 User Deletion 的冷静期。
  uint32 deletion_cooling_days = 10;
  // user_code_change_interval_days 以天为单位限定两次 User Code 变更之间的最短间隔。
  uint32 user_code_change_interval_days = 11;
  // password_min_length 限定可接受密码的最小字符数。
  uint32 password_min_length = 12;
  // password_max_length 限定可接受密码的最大字符数。
  uint32 password_max_length = 13;
  // password_history_count 记录 UserAppPolicyPatch 中符合对应条件的数量。
  uint32 password_history_count = 14;
}
// UpdateUserAppPolicyRequest 定义更新 UserAppPolicy 的命令参数。
message UpdateUserAppPolicyRequest {
  // data 承载 UpdateUserAppPolicy 对应阶段的结构化业务内容。
  UserAppPolicyPatch data = 2;
  // update_mask 指定本次请求允许局部更新的字段路径。
  google.protobuf.FieldMask update_mask = 3;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 4;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5;
}
