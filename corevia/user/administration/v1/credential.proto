syntax = "proto3";

package user.administration.v1;

import "common/pagination/v1/pagination.proto";
import "common/v1/common.proto";
import "google/protobuf/empty.proto";
import "user/administration/v1/types.proto";

// UserCredentialService 管理用户登录凭据。
service UserCredentialService {
  // 查询 Credential 列表。
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // 绑定 Credential。
  rpc BindCredential(BindCredentialRequest) returns (Credential);
  // 解绑 Credential。
  rpc UnbindCredential(UnbindCredentialRequest) returns (google.protobuf.Empty);
  // 变更 Password。
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);
  // 重置 Password。
  rpc ResetPassword(ResetPasswordRequest) returns (google.protobuf.Empty);
  // 查询 CredentialPII 列表。
  rpc ListCredentialPII(ListCredentialPIIRequest) returns (ListCredentialPIIResponse);
}
// ListCredentialsRequest 定义 Credentials 的筛选与分页参数。
message ListCredentialsRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2;
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 3;
}
// ListCredentialsResponse 返回 Credentials 结果集合及分页信息。
message ListCredentialsResponse {
  // items 包含本次返回或处理的业务条目。
  repeated Credential items = 1;
  // total 表示当前查询条件下可见结果的总数。
  uint64 total = 2;
  // usable_count 记录 ListCredentials 中符合对应条件的数量。
  uint64 usable_count = 3;
  // usable_item_ids 标识当前分页 items 中受 App Policy 允许且状态有效的 Credential。
  repeated uint64 usable_item_ids = 4;
}
// BindCredentialRequest 定义绑定 Credential 的幂等管理命令参数。
message BindCredentialRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2;
  // type 区分 BindCredential 的业务类型。
  CredentialType type = 3;
  // identifier 记录外部系统用于定位当前资源的稳定标识。
  string identifier = 4;
  // secret 承载敏感凭据或校验材料，不得写入普通日志。
  string secret = 5;
  // verification_ticket 承载流程继续所需的短期校验凭据，不得写入普通日志。
  string verification_ticket = 6;
  // provider_token 承载敏感凭据或校验材料，不得写入普通日志。
  string provider_token = 7;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 8;
}
// UnbindCredentialRequest 定义解绑 Credential 的幂等管理命令参数。
message UnbindCredentialRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2;
  // credential_id 标识关联的 Credential。
  uint64 credential_id = 3;
  // verification_ticket 承载流程继续所需的短期校验凭据，不得写入普通日志。
  string verification_ticket = 4;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5;
}
// ChangePasswordRequest 定义执行 ChangePassword 的幂等管理命令参数。
message ChangePasswordRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2;
  // old_password 承载敏感凭据或校验材料，不得写入普通日志。
  string old_password = 3;
  // new_password 承载敏感凭据或校验材料，不得写入普通日志。
  string new_password = 4;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5;
}
// ResetPasswordRequest 定义重置 Password 的幂等管理命令参数。
message ResetPasswordRequest {
  // identifier 记录外部系统用于定位当前资源的稳定标识。
  string identifier = 2;
  // new_password 承载敏感凭据或校验材料，不得写入普通日志。
  string new_password = 3;
  // verification_ticket 承载流程继续所需的短期校验凭据，不得写入普通日志。
  string verification_ticket = 4;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5;
}
// ListCredentialPIIRequest 定义 CredentialPII 的筛选与分页参数。
message ListCredentialPIIRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3;
}
// ListCredentialPIIResponse 返回 CredentialPII 结果集合及分页信息。
message ListCredentialPIIResponse {
  // items 包含本次返回或处理的业务条目。
  repeated CredentialPII items = 1;
}
