syntax = "proto3";

package user.administration.v1;

import "common/pagination/v1/pagination.proto";
import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/api/field_behavior.proto";
import "user/administration/v1/administration.proto";
import "validate/validate.proto";

// UserExportStatus is the durable asynchronous masked-export lifecycle.
enum UserExportStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  USER_EXPORT_STATUS_UNSPECIFIED = 0;
  // 已进入处理队列，尚未开始执行。
  USER_EXPORT_STATUS_QUEUED = 1;
  // 正在处理中，尚未形成终态。
  USER_EXPORT_STATUS_RUNNING = 2;
  // 处理已成功完成。
  USER_EXPORT_STATUS_COMPLETED = 3;
  // 处理失败；是否可重试由具体失败原因决定。
  USER_EXPORT_STATUS_FAILED = 4;
}

// UserExportJob exposes progress without exposing the Support File identity.
message UserExportJob {
  // id 标识关联的 UserExportJob。
  uint64 id = 1;
  // operator_id 标识关联的后台 Operator。
  uint32 operator_id = 3;
  // export_no 是 UserExportJob 对外关联与审计使用的业务编号。
  string export_no = 4;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 5;
  // search 承载 UserExportJob 关联的 UserSearchQuery。
  UserSearchQuery search = 6;
  // filter 限定本次查询采用的筛选条件。
  UserSearchFilter filter = 7;
  // status 表示 UserExportJob 当前可观察的生命周期状态。
  UserExportStatus status = 8;
  // row_count 记录 UserExportJob 中符合对应条件的数量。
  uint64 row_count = 9;
  // failure_reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string failure_reason = 10;
  // attempt_count 记录 UserExportJob 中符合对应条件的数量。
  uint32 attempt_count = 11;
  // created_at 记录 UserExportJob 的创建时间。
  google.protobuf.Timestamp created_at = 200;
  // updated_at 记录 UserExportJob 最近一次更新的时间。
  google.protobuf.Timestamp updated_at = 201;
  // completed_at 记录 UserExportJob 对应业务阶段的时间点。
  google.protobuf.Timestamp completed_at = 202;
  // result_expires_at 指定 UserExportJob 失效的时间点。
  google.protobuf.Timestamp result_expires_at = 203;
}

// CreateUserExportJobRequest 定义创建 UserExportJob 的幂等命令参数。
message CreateUserExportJobRequest {
  // operator_id 标识关联的后台 Operator。
  uint32 operator_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint32.gt = 0];
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 512}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 5 [(validate.rules).string.max_len = 128];
  // search 承载 CreateUserExportJob 关联的 UserSearchQuery。
  UserSearchQuery search = 6;
  // filter 限定本次查询采用的筛选条件。
  UserSearchFilter filter = 7;
  // ip_hash 用于校验 CreateUserExportJob 对应内容或版本的一致性。
  string ip_hash = 8 [(validate.rules).string.max_len = 128];
}

// ListUserExportJobsRequest 定义 UserExportJobs 的筛选与分页参数。
message ListUserExportJobsRequest {
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 2;
}

// ListUserExportJobsResponse 返回 UserExportJobs 结果集合及分页信息。
message ListUserExportJobsResponse {
  // items 包含本次返回或处理的业务条目。
  repeated UserExportJob items = 1;
  // total 表示当前查询条件下可见结果的总数。
  uint64 total = 2;
}

// GetUserExportDownloadRequest 标识待查询的 UserExportDownload。
message GetUserExportDownloadRequest {
  // job_id 标识关联的 Job。
  uint64 job_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // operator_id 标识关联的后台 Operator。
  uint32 operator_id = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint32.gt = 0];
  // request_id 用于关联同一次请求或异步处理链路。
  string request_id = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
  // ip_hash 用于校验 GetUserExportDownload 对应内容或版本的一致性。
  string ip_hash = 5 [(validate.rules).string.max_len = 128];
}

// UserExportDownload 提供一次性 User Export 下载授权及失效时间。
message UserExportDownload {
  // url 指定 UserExportDownload 访问或跳转使用的目标地址。
  string url = 1;
  // expires_at 指定 UserExportDownload 失效的时间点。
  google.protobuf.Timestamp expires_at = 2;
}
