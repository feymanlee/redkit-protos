syntax = "proto3";

package user.administration.v1;

import "common/pagination/v1/pagination.proto";
import "common/v1/common.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "user/administration/v1/types.proto";
import "validate/validate.proto";

// UserDeviceService 管理用于账号安全的设备记录。
service UserDeviceService {
  // 查询 Device 列表。
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // 信任 Device。
  rpc TrustDevice(TrustDeviceRequest) returns (Device);
  // RegisterRecoveryDeviceKey 只允许当前 User 为已 TRUSTED Device 显式登记 Ed25519 公钥和持有证明；legacy installation ID 不自动成为 Recovery Evidence。
  rpc RegisterRecoveryDeviceKey(RegisterRecoveryDeviceKeyRequest) returns (Device);
  // 撤销 DeviceSessions。
  rpc RevokeDeviceSessions(RevokeDeviceSessionsRequest) returns (google.protobuf.Empty);
}
// ListDevicesRequest 定义 Devices 的筛选与分页参数。
message ListDevicesRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2;
  // paging 指定分页大小和游标等查询参数。
  common.pagination.v1.PagingRequest paging = 3;
}
// ListDevicesResponse 返回 Devices 结果集合及分页信息。
message ListDevicesResponse {
  // items 包含本次返回或处理的业务条目。
  repeated Device items = 1;
  // total 表示当前查询条件下可见结果的总数。
  uint64 total = 2;
}
// TrustDeviceRequest 定义执行 TrustDevice 的幂等管理命令参数。
message TrustDeviceRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2;
  // device_id 标识关联的 Device。
  uint64 device_id = 3;
  // verification_ticket 承载流程继续所需的短期校验凭据，不得写入普通日志。
  string verification_ticket = 4;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5;
}
// RegisterRecoveryDeviceKeyRequest 定义执行 RegisterRecoveryDeviceKey 的幂等管理命令参数。
message RegisterRecoveryDeviceKeyRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).uint64.gt = 0
  ];
  // device_id 标识关联的 Device。
  uint64 device_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).uint64.gt = 0
  ];
  // public_key 在约定作用域内稳定定位 RegisterRecoveryDeviceKey。
  bytes public_key = 4 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).bytes = {
      min_len: 32
      max_len: 32
    }
  ];
  // proof_signature 是 Ed25519 对以下 UTF-8 规范消息的签名（字段间使用单个 LF，末尾无换行）：
  // corevia:user:recovery-device-key:v1\nuser_id=<decimal>\ndevice_id=<decimal>\nidempotency_key=<value>
  // 签名不得写入日志或持久化。
  bytes proof_signature = 5 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).bytes = {
      min_len: 64
      max_len: 64
    }
  ];
  // verification_ticket 承载流程继续所需的短期校验凭据，不得写入普通日志。
  string verification_ticket = 6 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 2048
    }
  ];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 7 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      min_len: 1
      max_len: 128
    }
  ];
}
// RevokeDeviceSessionsRequest 定义撤销 DeviceSessions 的幂等管理命令参数。
message RevokeDeviceSessionsRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2;
  // device_id 标识关联的 Device。
  uint64 device_id = 3;
  // reason 记录触发本次状态变化或管理操作的原因，供审计与复核。
  string reason = 4;
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 5;
}
