syntax = "proto3";

package user.administration.v1;

import "errors/errors.proto";

// UserErrorReason 定义用户上下文的稳定错误类别。
enum UserErrorReason {
  option (errors.default_code) = 500;
  // BAD_REQUEST 表示因 BAD_REQUEST 条件导致流程无法按原路径继续。
  BAD_REQUEST = 0 [(errors.code) = 400];
  // 已超过契约允许的数量、额度或处理上限。
  EXPORT_ROW_LIMIT_EXCEEDED = 1 [(errors.code) = 400];
  // UNAUTHORIZED 表示因 UNAUTHORIZED 条件导致流程无法按原路径继续。
  UNAUTHORIZED = 100 [(errors.code) = 401];
  // FORBIDDEN 表示因 FORBIDDEN 条件导致流程无法按原路径继续。
  FORBIDDEN = 300 [(errors.code) = 403];
  // MFA_REQUIRED 表示该业务条件为必需。
  MFA_REQUIRED = 301 [(errors.code) = 403];
  // 主凭据已通过，但新设备登录仍需完成二次验证。
  STEP_UP_REQUIRED = 302 [(errors.code) = 403];
  // 密码凭据已通过，但必须先完成由用户发起的密码重设。
  PASSWORD_RESET_REQUIRED = 303 [(errors.code) = 403];
  // NOT_FOUND 表示因 NOT_FOUND 条件导致流程无法按原路径继续。
  NOT_FOUND = 400 [(errors.code) = 404];
  // ACCOUNT_NOT_FOUND 表示因 ACCOUNT_NOT_FOUND 条件导致流程无法按原路径继续。
  ACCOUNT_NOT_FOUND = 401 [(errors.code) = 404];
  // CREDENTIAL_NOT_FOUND 表示因 CREDENTIAL_NOT_FOUND 条件导致流程无法按原路径继续。
  CREDENTIAL_NOT_FOUND = 402 [(errors.code) = 404];
  // SESSION_NOT_FOUND 表示因 SESSION_NOT_FOUND 条件导致流程无法按原路径继续。
  SESSION_NOT_FOUND = 403 [(errors.code) = 404];
  // CONFLICT 表示因 CONFLICT 条件导致流程无法按原路径继续。
  CONFLICT = 900 [(errors.code) = 409];
  // IDEMPOTENCY_CONFLICT 表示因 IDEMPOTENCY_CONFLICT 条件导致流程无法按原路径继续。
  IDEMPOTENCY_CONFLICT = 901 [(errors.code) = 409];
  // CREDENTIAL_ALREADY_BOUND 表示因 CREDENTIAL_ALREADY_BOUND 条件导致流程无法按原路径继续。
  CREDENTIAL_ALREADY_BOUND = 902 [(errors.code) = 409];
  // INVALID_ACCOUNT_STATE 表示因 INVALID_ACCOUNT_STATE 条件导致流程无法按原路径继续。
  INVALID_ACCOUNT_STATE = 903 [(errors.code) = 409];
  // 当前不可供业务流程选择或使用。
  USER_CODE_UNAVAILABLE = 904 [(errors.code) = 409];
  // 正在处理中，尚未形成终态。
  OPERATION_PROCESSING = 905 [(errors.code) = 409];
  // INVALID_RECOVERY_STATE 表示因 INVALID_RECOVERY_STATE 条件导致流程无法按原路径继续。
  INVALID_RECOVERY_STATE = 906 [(errors.code) = 409];
  // TOO_MANY_REQUESTS 表示因 TOO_MANY_REQUESTS 条件导致流程无法按原路径继续。
  TOO_MANY_REQUESTS = 1200 [(errors.code) = 429];
  // INTERNAL_SERVER_ERROR 表示因 INTERNAL_SERVER_ERROR 条件导致流程无法按原路径继续。
  INTERNAL_SERVER_ERROR = 2000 [(errors.code) = 500];
  // 当前不可供业务流程选择或使用。
  SERVICE_UNAVAILABLE = 2300 [(errors.code) = 503];
}
