import "google/protobuf/timestamp.proto";
import "user/administration/v1/types.proto";
import "validate/validate.proto";

// UserAdministrationService 提供后台专用的 User 查询与处置，不承担后台权限校验。
service UserAdministrationService {
  // SearchUsers 在具体 App 内执行结构化用户搜索和筛选。
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  // SuspendUser 执行后台专用的限时或无限期 Account Suspension。
  rpc SuspendUser(SuspendUserRequest) returns (Account);
  // ReactivateUser 执行后台专用的人工 Account 恢复。
  rpc ReactivateUser(ReactivateUserRequest) returns (Account);
  // ModerateUserProfile 清理违规公开资料，不允许 Operator 写入替代内容。
  rpc ModerateUserProfile(ModerateUserProfileRequest) returns (Profile);
  // ResetUserCode 使用系统生成器替换公开身份并永久保留旧 Code。
  rpc ResetUserCode(ResetUserCodeRequest) returns (Account);
  // BeginAdministrativeAccountClosure 由可信 Operator 发起现有 Account Closure 冷静期。
  rpc BeginAdministrativeAccountClosure(BeginAdministrativeAccountClosureRequest) returns (Account);
  // GetAccountClosure 返回 User-owned Saga 与 participant 进度，不复制 Reward 明细。
  rpc GetAccountClosure(GetAccountClosureRequest) returns (AccountClosure);
  // CancelAdministrativeAccountClosure 在冷静期直接恢复 Account，或请求 Worker 撤销首个 Apply 前的可逆 preparation。
  rpc CancelAdministrativeAccountClosure(CancelAdministrativeAccountClosureRequest) returns (AccountClosure);
  // RetryAdministrativeAccountClosure 只重新排队明确 STALLED 的 Closure Saga。
  rpc RetryAdministrativeAccountClosure(RetryAdministrativeAccountClosureRequest) returns (AccountClosure);
  // RequirePasswordReset 撤销现有认证状态并要求 User 自行更换密码。
  rpc RequirePasswordReset(RequirePasswordResetRequest) returns (google.protobuf.Empty);
  // RevokeCredential 撤销一个已失陷的登录方式，但保留至少一个可用 Credential。
  rpc RevokeCredential(RevokeCredentialRequest) returns (google.protobuf.Empty);
  // ResetMFA 撤销现有 MFA 因子、恢复码和认证状态，不创建替代因子。
  rpc ResetMFA(ResetMFARequest) returns (google.protobuf.Empty);
  // RevokeDeviceTrust 撤销设备信任以及该设备的全部认证状态。
  rpc RevokeDeviceTrust(RevokeDeviceTrustRequest) returns (google.protobuf.Empty);
}

// GetAccountClosureRequest 标识待查询的 AccountClosure。
message GetAccountClosureRequest {
  // app_id 限定 GetAccountClosure 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // user_id 标识当前 App 内关联的 User。
  uint64 user_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
}

// AccountClosureStatus 刻画对应资源的生命周期状态。
enum AccountClosureStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  ACCOUNT_CLOSURE_STATUS_UNSPECIFIED = 0;
  // 正在处理中，尚未形成终态。
  ACCOUNT_CLOSURE_STATUS_PREPARING = 1;
  // 正在处理中，尚未形成终态。
  ACCOUNT_CLOSURE_STATUS_RUNNING = 2;
  // 处理被阻塞，需要外部处置后才能继续。
  ACCOUNT_CLOSURE_STATUS_BLOCKED = 3;
  // 处理被阻塞，需要外部处置后才能继续。
  ACCOUNT_CLOSURE_STATUS_STALLED = 4;
  // 处理已成功完成。
  ACCOUNT_CLOSURE_STATUS_COMPLETED = 5;
  // 处理已取消，不再继续推进。
  ACCOUNT_CLOSURE_STATUS_CANCELED = 6;
  // ACCOUNT_CLOSURE_STATUS_CANCELING 表示资源处于对应业务阶段。
  ACCOUNT_CLOSURE_STATUS_CANCELING = 7;
}

// AccountClosureParticipantStatus 刻画对应资源的生命周期状态。
enum AccountClosureParticipantStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_UNSPECIFIED = 0;
  // 已受理并等待后续处理。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_PENDING = 1;
  // 正在处理中，尚未形成终态。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_RUNNING = 2;
  // 处理被阻塞，需要外部处置后才能继续。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_BLOCKED = 3;
  // 处理已成功完成。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_SUCCEEDED = 4;
  // 处理被阻塞，需要外部处置后才能继续。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_STALLED = 5;
  // 处理已取消，不再继续推进。
  ACCOUNT_CLOSURE_PARTICIPANT_STATUS_CANCELED = 6;
}

// AccountClosureParticipant 记录一个 bounded context 对 Account Closure 的处理状态。
message AccountClosureParticipant {
  // participant 标识参与 Account Merge 或 Account Closure 的 bounded context。
  string participant = 1;
  // status 表示 AccountClosureParticipant 当前可观察的生命周期状态。
  AccountClosureParticipantStatus status = 2;
  // attempt 记录当前流程已经执行的尝试次数。
  uint32 attempt = 3;
  // blocker_count 记录 AccountClosureParticipant 中符合对应条件的数量。
  uint32 blocker_count = 4;
  // failure_category 对失败进行稳定分类，供调用方决定重试或终止。
  string failure_category = 5;
  // safe_error 记录 AccountClosureParticipant 最近一次可诊断的失败信息。
  string safe_error = 6;
  // owning_reference 记录外部系统或关联流程提供的引用标识。
  string owning_reference = 7;
  // lease_until 指定 AccountClosureParticipant 查询或生效区间的结束边界。
  google.protobuf.Timestamp lease_until = 8;
  // completed_at 记录 AccountClosureParticipant 对应业务阶段的时间点。
  google.protobuf.Timestamp completed_at = 9;
  // updated_at 记录 AccountClosureParticipant 最近一次更新的时间。
  google.protobuf.Timestamp updated_at = 10;
  // blockers 列出 AccountClosureParticipant 关联的 AccountClosureParticipantBlocker。
  repeated AccountClosureParticipantBlocker blockers = 11;
  // order 指定查询结果采用的排序方向或优先级。
  uint32 order = 12;
}

// AccountClosureParticipantBlocker 描述阻止 Account Closure 继续推进的业务条件。
message AccountClosureParticipantBlocker {
  // category 指定记录归属的稳定业务分类。
  string category = 1;
  // count 记录 AccountClosureParticipantBlocker 中符合对应条件的数量。
  uint32 count = 2;
  // owning_reference 记录外部系统或关联流程提供的引用标识。
  string owning_reference = 3;
}

// AccountClosure 表示一次 Account Closure 流程及其参与者状态。
message AccountClosure {
  // closure_no 是 AccountClosure 对外关联与审计使用的业务编号。
  string closure_no = 1;
  // app_id 限定 AccountClosure 所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 2;
  // user_id 标识当前 App 内关联的 User。
  uint64 user_id = 3;
  // status 表示 AccountClosure 当前可观察的生命周期状态。
  AccountClosureStatus status = 4;
  // attempt 记录当前流程已经执行的尝试次数。
  uint32 attempt = 5;
  // failure_category 对失败进行稳定分类，供调用方决定重试或终止。
  string failure_category = 6;
  // safe_error 记录 AccountClosure 最近一次可诊断的失败信息。
  string safe_error = 7;
  // participants 列出 AccountClosure 关联的 AccountClosureParticipant。
  repeated AccountClosureParticipant participants = 8;
  // completed_at 记录 AccountClosure 对应业务阶段的时间点。
  google.protobuf.Timestamp completed_at = 9;
  // created_at 记录 AccountClosure 的创建时间。
  google.protobuf.Timestamp created_at = 10;
  // updated_at 记录 AccountClosure 最近一次更新的时间。
  google.protobuf.Timestamp updated_at = 11;
  // cancellation_allowed 显式表示 AccountClosure 是否满足该条件。
  bool cancellation_allowed = 12;
  // irreversible_started_at 指定 AccountClosure 生效或查询区间的起始时间。
  google.protobuf.Timestamp irreversible_started_at = 13;
  // canceled_at 记录 AccountClosure 对应业务阶段的时间点。
  google.protobuf.Timestamp canceled_at = 14;
  // participant_order 按关闭编排顺序列出参与的 bounded context。
  repeated string participant_order = 15;
  // closed_at 记录 AccountClosure 对应业务阶段的时间点。
  google.protobuf.Timestamp closed_at = 16;
}

