syntax = "proto3";

package payment.v1;

import "common/pagination/v1/pagination.proto";
import "common/v1/common.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "payment/v1/payment_contract.proto";
import "payment/v1/payment_types.proto";
import "payment/v1/refund.proto";

// 订阅计划的计费模式。
enum SubscriptionMode {
  // 未提供有效取值；调用方不得据此推断业务状态。
  SUBSCRIPTION_MODE_UNSPECIFIED = 0;
  // SUBSCRIPTION_MODE_FIXED_TERM 选择 FIXED_TERM 作为对应业务维度的有效取值。
  SUBSCRIPTION_MODE_FIXED_TERM = 1;
  // SUBSCRIPTION_MODE_AUTO_RENEWING 选择 AUTO_RENEWING 作为对应业务维度的有效取值。
  SUBSCRIPTION_MODE_AUTO_RENEWING = 2;
}

// 不可变订阅计划版本的发布状态。
enum SubscriptionPlanRevisionStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  SUBSCRIPTION_PLAN_REVISION_STATUS_UNSPECIFIED = 0;
  // 仍处于草稿阶段，尚未对业务生效。
  SUBSCRIPTION_PLAN_REVISION_STATUS_DRAFT = 1;
  // 已经发布并对约定作用域生效。
  SUBSCRIPTION_PLAN_REVISION_STATUS_PUBLISHED = 2;
  // 已退出使用，仅保留历史查询能力。
  SUBSCRIPTION_PLAN_REVISION_STATUS_RETIRED = 3;
}

// 人工订阅权益处置类型。
enum SubscriptionAdjustmentType {
  // 未提供有效取值；调用方不得据此推断业务状态。
  SUBSCRIPTION_ADJUSTMENT_TYPE_UNSPECIFIED = 0;
  // SUBSCRIPTION_ADJUSTMENT_TYPE_GRANT 选择 GRANT 业务类型。
  SUBSCRIPTION_ADJUSTMENT_TYPE_GRANT = 1;
  // SUBSCRIPTION_ADJUSTMENT_TYPE_EXTEND 选择 EXTEND 业务类型。
  SUBSCRIPTION_ADJUSTMENT_TYPE_EXTEND = 2;
  // SUBSCRIPTION_ADJUSTMENT_TYPE_REVOKE 选择 REVOKE 业务类型。
  SUBSCRIPTION_ADJUSTMENT_TYPE_REVOKE = 3;
}

// 人工订阅权益处置状态。
enum SubscriptionAdjustmentStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  SUBSCRIPTION_ADJUSTMENT_STATUS_UNSPECIFIED = 0;
  // SUBSCRIPTION_ADJUSTMENT_STATUS_PENDING_REVIEW 表示资源处于对应业务阶段。
  SUBSCRIPTION_ADJUSTMENT_STATUS_PENDING_REVIEW = 1;
  // 审核已通过，可以继续后续流程。
  SUBSCRIPTION_ADJUSTMENT_STATUS_APPROVED = 2;
  // 审核已拒绝，不再按原请求继续。
  SUBSCRIPTION_ADJUSTMENT_STATUS_REJECTED = 3;
  // 变更已经应用并形成可查询结果。
  SUBSCRIPTION_ADJUSTMENT_STATUS_APPLIED = 4;
}

// 人工处置风险结论。
enum SubscriptionAdjustmentRiskResult {
  // 未提供有效取值；调用方不得据此推断业务状态。
  SUBSCRIPTION_ADJUSTMENT_RISK_RESULT_UNSPECIFIED = 0;
  // 审核已通过，可以继续后续流程。
  SUBSCRIPTION_ADJUSTMENT_RISK_RESULT_AUTO_APPROVED = 1;
  // 需要人工审核、补充材料或执行明确处置后才能继续。
  SUBSCRIPTION_ADJUSTMENT_RISK_RESULT_REVIEW_REQUIRED = 2;
}

// 人工处置命中的风险原因。
enum SubscriptionAdjustmentRiskHit {
  // 未提供有效取值；调用方不得据此推断业务状态。
  SUBSCRIPTION_ADJUSTMENT_RISK_HIT_UNSPECIFIED = 0;
  // SUBSCRIPTION_ADJUSTMENT_RISK_HIT_RULE_NOT_CONFIGURED 表示风险规则命中 RULE_NOT_CONFIGURED 条件。
  SUBSCRIPTION_ADJUSTMENT_RISK_HIT_RULE_NOT_CONFIGURED = 1;
  // SUBSCRIPTION_ADJUSTMENT_RISK_HIT_VALUE_THRESHOLD 表示风险规则命中 VALUE_THRESHOLD 条件。
  SUBSCRIPTION_ADJUSTMENT_RISK_HIT_VALUE_THRESHOLD = 2;
  // SUBSCRIPTION_ADJUSTMENT_RISK_HIT_DURATION_THRESHOLD 表示风险规则命中 DURATION_THRESHOLD 条件。
  SUBSCRIPTION_ADJUSTMENT_RISK_HIT_DURATION_THRESHOLD = 3;
  // SUBSCRIPTION_ADJUSTMENT_RISK_HIT_PERMANENT_ENTITLEMENT 表示风险规则命中 PERMANENT_ENTITLEMENT 条件。
  SUBSCRIPTION_ADJUSTMENT_RISK_HIT_PERMANENT_ENTITLEMENT = 4;
  // SUBSCRIPTION_ADJUSTMENT_RISK_HIT_PAID_PERIOD_REVOKE 表示风险规则命中 PAID_PERIOD_REVOKE 条件。
  SUBSCRIPTION_ADJUSTMENT_RISK_HIT_PAID_PERIOD_REVOKE = 5;
}

// 标准化人工权益处置原因。
enum SubscriptionAdjustmentReasonCode {
  // 未提供有效取值；调用方不得据此推断业务状态。
  SUBSCRIPTION_ADJUSTMENT_REASON_CODE_UNSPECIFIED = 0;
  // SUBSCRIPTION_ADJUSTMENT_REASON_CODE_CUSTOMER_SUPPORT 表示流程因 CUSTOMER_SUPPORT 业务原因触发。
  SUBSCRIPTION_ADJUSTMENT_REASON_CODE_CUSTOMER_SUPPORT = 1;
  // SUBSCRIPTION_ADJUSTMENT_REASON_CODE_SERVICE_RECOVERY 表示流程因 SERVICE_RECOVERY 业务原因触发。
  SUBSCRIPTION_ADJUSTMENT_REASON_CODE_SERVICE_RECOVERY = 2;
  // SUBSCRIPTION_ADJUSTMENT_REASON_CODE_PROMOTION 表示流程因 PROMOTION 业务原因触发。
  SUBSCRIPTION_ADJUSTMENT_REASON_CODE_PROMOTION = 3;
  // SUBSCRIPTION_ADJUSTMENT_REASON_CODE_DATA_CORRECTION 表示流程因 DATA_CORRECTION 业务原因触发。
  SUBSCRIPTION_ADJUSTMENT_REASON_CODE_DATA_CORRECTION = 4;
  // SUBSCRIPTION_ADJUSTMENT_REASON_CODE_FRAUD_RESPONSE 表示流程因 FRAUD_RESPONSE 业务原因触发。
  SUBSCRIPTION_ADJUSTMENT_REASON_CODE_FRAUD_RESPONSE = 5;
  // SUBSCRIPTION_ADJUSTMENT_REASON_CODE_OTHER 表示流程因 OTHER 业务原因触发。
  SUBSCRIPTION_ADJUSTMENT_REASON_CODE_OTHER = 6;
}

// Provider 自动续订协议的标准化当前状态。
enum ProviderSubscriptionStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  PROVIDER_SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  // 当前已生效并可用于业务处理。
  PROVIDER_SUBSCRIPTION_STATUS_ACTIVE = 1;
  // PROVIDER_SUBSCRIPTION_STATUS_GRACE_PERIOD 表示资源处于对应业务阶段。
  PROVIDER_SUBSCRIPTION_STATUS_GRACE_PERIOD = 2;
  // PROVIDER_SUBSCRIPTION_STATUS_BILLING_RETRY 表示资源处于对应业务阶段。
  PROVIDER_SUBSCRIPTION_STATUS_BILLING_RETRY = 3;
  // 处理已取消，不再继续推进。
  PROVIDER_SUBSCRIPTION_STATUS_CANCELLED = 4;
  // 有效期已结束，不再接受后续使用。
  PROVIDER_SUBSCRIPTION_STATUS_EXPIRED = 5;
  // 相关授权或凭据已撤销，不能继续使用。
  PROVIDER_SUBSCRIPTION_STATUS_REVOKED = 6;
}

// Provider 周期的财务/权益处理状态。
enum ProviderSubscriptionPeriodStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  PROVIDER_SUBSCRIPTION_PERIOD_STATUS_UNSPECIFIED = 0;
  // PROVIDER_SUBSCRIPTION_PERIOD_STATUS_PAID 表示资源处于对应业务阶段。
  PROVIDER_SUBSCRIPTION_PERIOD_STATUS_PAID = 1;
  // 相关金额已经全部退款。
  PROVIDER_SUBSCRIPTION_PERIOD_STATUS_REFUNDED = 2;
  // 相关授权或凭据已撤销，不能继续使用。
  PROVIDER_SUBSCRIPTION_PERIOD_STATUS_REVOKED = 3;
}

// Provider 状态事实的来源。
enum ProviderSubscriptionEventSource {
  // 未提供有效取值；调用方不得据此推断业务状态。
  PROVIDER_SUBSCRIPTION_EVENT_SOURCE_UNSPECIFIED = 0;
  // PROVIDER_SUBSCRIPTION_EVENT_SOURCE_PURCHASE 表示业务事实或请求来自 PURCHASE 来源。
  PROVIDER_SUBSCRIPTION_EVENT_SOURCE_PURCHASE = 1;
  // PROVIDER_SUBSCRIPTION_EVENT_SOURCE_CALLBACK 表示业务事实或请求来自 CALLBACK 来源。
  PROVIDER_SUBSCRIPTION_EVENT_SOURCE_CALLBACK = 2;
  // PROVIDER_SUBSCRIPTION_EVENT_SOURCE_REFRESH 表示业务事实或请求来自 REFRESH 来源。
  PROVIDER_SUBSCRIPTION_EVENT_SOURCE_REFRESH = 3;
  // PROVIDER_SUBSCRIPTION_EVENT_SOURCE_CANCELLATION 表示业务事实或请求来自 CANCELLATION 来源。
  PROVIDER_SUBSCRIPTION_EVENT_SOURCE_CANCELLATION = 4;
}

// 一个 Provider 商品与 Plan Revision 的不可变映射。
message SubscriptionProviderSku {
  // provider 标识本次能力使用的外部 Provider。
  PaymentProvider provider = 1;
  // sku 是外部商店或商品目录使用的稳定商品编码。
  string sku = 2;
  // Apple/Google Store 商品所属的 Bundle ID 或 package name；非 Store Provider 必须为空。
  string store_app_id = 3;
}

// 订阅计划。
message SubscriptionPlan {
  // 计划 ID。
  optional uint32 id = 1;
  // 计划名称。
  optional string name = 3;
  // 计划编码。
  optional string code = 4;
  // 价格。
  optional int64 price = 5;
  // 币种代码。
  optional string currency = 6;
  // 有效期天数。
  optional uint32 duration_days = 7;
  // 是否启用。
  optional bool enabled = 8;
  // 备注。
  optional string remark = 9;
  // 当前发布版本；不存在已发布版本时为空。
  optional uint64 active_revision_id = 10;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// 订阅计划的一次不可变交易版本。
message SubscriptionPlanRevision {
  // id 标识关联的 SubscriptionPlanRevision。
  optional uint64 id = 1;
  // plan_id 标识关联的 Plan。
  optional uint32 plan_id = 3;
  // revision_no 是 SubscriptionPlanRevision 对外关联与审计使用的业务编号。
  optional uint32 revision_no = 4;
  // status 表示 SubscriptionPlanRevision 当前可观察的生命周期状态。
  optional SubscriptionPlanRevisionStatus status = 5;
  // price 以对应 currency 的最小货币单位表示，不使用浮点数。
  optional int64 price = 6;
  // currency 指定相关金额使用的币种或计量单位。
  optional string currency = 7;
  // duration_days 以契约字段约定的单位表示对应流程的持续时间或上限。
  optional uint32 duration_days = 8;
  // mode 指定 SubscriptionPlanRevision 使用的 SubscriptionMode。
  optional SubscriptionMode mode = 9;
  // provider_skus 列出 SubscriptionPlanRevision 关联的 SubscriptionProviderSku。
  repeated SubscriptionProviderSku provider_skus = 10;
  // created_by_operator_id 标识关联的后台 Operator。
  optional uint32 created_by_operator_id = 11;
  // published_by_operator_id 标识关联的后台 Operator。
  optional uint32 published_by_operator_id = 12;
  // published_at 记录 SubscriptionPlanRevision 对应业务阶段的时间点。
  optional google.protobuf.Timestamp published_at = 13;
  // created_at 记录 SubscriptionPlanRevision 的创建时间。
  optional google.protobuf.Timestamp created_at = 200;
}

// 用户订阅。
message UserSubscription {
  // 订阅 ID。
  optional uint64 id = 1;
  // 用户 ID。
  optional uint64 user_id = 3;
  // 计划 ID。
  optional uint32 plan_id = 4;
  // 业务订单号。
  optional string order_no = 5;
  // 生效时间。
  optional google.protobuf.Timestamp started_at = 6;
  // 过期时间。
  optional google.protobuf.Timestamp expired_at = 7;
  // 是否有效。
  optional bool active = 8;
  // 当前权益绑定的不可变 Plan Revision。
  optional uint64 plan_revision_id = 9;
  // 当前权益对应的 Provider Subscription；固定期限权益为空。
  optional uint64 provider_subscription_id = 10;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// 用户订阅明细。
message UserSubscriptionDetail {
  // 明细 ID。
  optional uint64 id = 1;
  // 用户 ID。
  optional uint64 user_id = 3;
  // 用户订阅 ID。
  optional uint64 subscription_id = 4;
  // 计划 ID。
  optional uint32 plan_id = 5;
  // 计划名称快照。
  optional string plan_name = 6;
  // 计划编码快照。
  optional string plan_code = 7;
  // 价格快照，分。
  optional int64 price = 8;
  // 币种代码快照。
  optional string currency = 9;
  // 有效期天数快照。
  optional uint32 duration_days = 10;
  // 明细类型：GRANT、RENEWAL、REFUND。
  optional string detail_type = 11;
  // 明细状态。
  optional string status = 12;
  // 业务订单号。
  optional string order_no = 13;
  // 支付单号。
  optional string payment_no = 14;
  // 退款单号。
  optional string refund_no = 15;
  // 周期开始时间。
  optional google.protobuf.Timestamp period_started_at = 16;
  // 周期结束时间。
  optional google.protobuf.Timestamp period_expired_at = 17;
  // 支付时间。
  optional google.protobuf.Timestamp paid_at = 18;
  // 退款时间。
  optional google.protobuf.Timestamp refunded_at = 19;
  // 支付渠道。
  optional PaymentProvider provider = 20;
  // 支付方式。
  optional PaymentMethod method = 21;
  // 支付金额，分。
  optional int64 amount = 22;
  // 退款金额，分。
  optional int64 refund_amount = 23;
  // 扩展元数据，JSON 字符串。
  optional string metadata = 24;
  // 本次权益事实绑定的不可变 Plan Revision。
  optional uint64 plan_revision_id = 25;
  // 人工处置 operation no；支付驱动的明细为空。
  optional string operation_no = 26;
  // 人工处置 Operator；支付驱动的明细为空。
  optional uint32 operator_id = 27;
  // 标准化人工处置原因。
  optional SubscriptionAdjustmentReasonCode reason_code = 28;
  // 人工处置备注。
  optional string note = 29;
  // 本次权益事实对应的 Provider Subscription。
  optional uint64 provider_subscription_id = 30;
  // 本次权益事实对应的唯一 Provider 周期。
  optional uint64 provider_subscription_period_id = 31;
  // 创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // 更新时间。
  optional google.protobuf.Timestamp updated_at = 201;
}
// 创建订阅请求。
message CreateSubscriptionRequest {
  // 用户 ID。
  uint64 user_id = 2;
  // 计划 ID。
  uint32 plan_id = 3;
  // 业务订单号。
  optional string order_no = 4;
}

// 用户订阅列表响应。
message ListUserSubscriptionResponse {
  // 列表项。
  repeated UserSubscription items = 1;
  // 总数。
  uint64 total = 2;
}

// 查询用户订阅详情请求。
message GetUserSubscriptionDetailRequest {
  // 用户订阅 ID。
  uint64 id = 1;
}

// 用户订阅详情响应。
message GetUserSubscriptionDetailResponse {
  // 当前订阅权益。
  UserSubscription subscription = 1;
  // 当前订阅计划。
  SubscriptionPlan plan = 2;
  // 订阅历史明细。
  repeated UserSubscriptionDetail details = 3;
  // 关联支付单。
  repeated Payment payments = 4;
  // 关联退款单。
  repeated Refund refunds = 5;
  // 关联支付事件。
  repeated PaymentEvent events = 6;
  // 当前权益绑定的不可变计划版本。
  SubscriptionPlanRevision plan_revision = 7;
  // 关联人工权益处置。
  repeated SubscriptionAdjustment adjustments = 8;
  // 当前权益关联的 Provider 自动续订协议。
  repeated ProviderSubscription provider_subscriptions = 9;
}

// Provider 拥有的自动续订协议当前快照。
message ProviderSubscription {
  // id 标识关联的 ProviderSubscription。
  optional uint64 id = 1;
  // user_id 标识关联的 User。
  optional uint64 user_id = 3;
  // original_user_id 标识关联的 User。
  optional uint64 original_user_id = 4;
  // user_subscription_id 标识关联的 UserSubscription。
  optional uint64 user_subscription_id = 5;
  // plan_id 标识关联的 Plan。
  optional uint32 plan_id = 6;
  // plan_revision_id 标识关联的 PlanRevision。
  optional uint64 plan_revision_id = 7;
  // channel_id 标识关联的 Channel。
  optional uint32 channel_id = 8;
  // channel_revision_id 标识关联的 ChannelRevision。
  optional uint64 channel_revision_id = 9;
  // provider 标识本次能力使用的外部 Provider。
  optional PaymentProvider provider = 10;
  // provider_subscription_id 标识关联的 ProviderSubscription。
  optional string provider_subscription_id = 11;
  // original_transaction_id 标识关联的 OriginalTransaction。
  optional string original_transaction_id = 12;
  // product_sku 是外部商店或商品目录使用的稳定商品编码。
  optional string product_sku = 13;
  // status 表示 ProviderSubscription 当前可观察的生命周期状态。
  optional ProviderSubscriptionStatus status = 14;
  // current_period_started_at 指定 ProviderSubscription 生效或查询区间的起始时间。
  optional google.protobuf.Timestamp current_period_started_at = 15;
  // current_period_expired_at 指定 ProviderSubscription 失效的时间点。
  optional google.protobuf.Timestamp current_period_expired_at = 16;
  // auto_renew_enabled 显式表示 ProviderSubscription 是否满足该条件。
  optional bool auto_renew_enabled = 17;
  // cancel_at_period_end 显式表示 ProviderSubscription 是否满足该条件。
  optional bool cancel_at_period_end = 18;
  // grace_until 指定 ProviderSubscription 查询或生效区间的结束边界。
  optional google.protobuf.Timestamp grace_until = 19;
  // billing_retry_until 指定 ProviderSubscription 查询或生效区间的结束边界。
  optional google.protobuf.Timestamp billing_retry_until = 20;
  // cancelled_at 记录 ProviderSubscription 对应业务阶段的时间点。
  optional google.protobuf.Timestamp cancelled_at = 21;
  // terminal_at 记录 ProviderSubscription 对应业务阶段的时间点。
  optional google.protobuf.Timestamp terminal_at = 22;
  // last_provider_event_at 记录 ProviderSubscription 对应业务阶段的时间点。
  optional google.protobuf.Timestamp last_provider_event_at = 23;
  // last_provider_event_id 标识关联的 LastProviderEvent。
  optional string last_provider_event_id = 24;
  // created_at 记录 ProviderSubscription 的创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // updated_at 记录 ProviderSubscription 最近一次更新的时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// 一个 Provider 已付周期，只能形成一个 Payment 和一条 Subscription Detail。
message ProviderSubscriptionPeriod {
  // id 标识关联的 ProviderSubscriptionPeriod。
  optional uint64 id = 1;
  // provider_subscription_record_id 标识关联的 ProviderSubscriptionRecord。
  optional uint64 provider_subscription_record_id = 3;
  // provider 标识本次能力使用的外部 Provider。
  optional PaymentProvider provider = 4;
  // provider_transaction_id 标识关联的 ProviderTransaction。
  optional string provider_transaction_id = 5;
  // product_sku 是外部商店或商品目录使用的稳定商品编码。
  optional string product_sku = 6;
  // user_id 标识关联的 User。
  optional uint64 user_id = 7;
  // plan_revision_id 标识关联的 PlanRevision。
  optional uint64 plan_revision_id = 8;
  // source_event_id 标识关联的 SourceEvent。
  optional uint64 source_event_id = 9;
  // period_started_at 指定 ProviderSubscriptionPeriod 生效或查询区间的起始时间。
  optional google.protobuf.Timestamp period_started_at = 10;
  // period_expired_at 指定 ProviderSubscriptionPeriod 失效的时间点。
  optional google.protobuf.Timestamp period_expired_at = 11;
  // status 表示 ProviderSubscriptionPeriod 当前可观察的生命周期状态。
  optional ProviderSubscriptionPeriodStatus status = 12;
  // amount 以对应 currency 的最小货币单位表示，不使用浮点数。
  optional int64 amount = 13;
  // currency 指定相关金额使用的币种或计量单位。
  optional string currency = 14;
  // payment_id 标识关联的 Payment。
  optional uint64 payment_id = 15;
  // payment_no 是 ProviderSubscriptionPeriod 对外关联与审计使用的业务编号。
  optional string payment_no = 16;
  // subscription_detail_id 标识关联的 SubscriptionDetail。
  optional uint64 subscription_detail_id = 17;
  // created_at 记录 ProviderSubscriptionPeriod 的创建时间。
  optional google.protobuf.Timestamp created_at = 200;
  // updated_at 记录 ProviderSubscriptionPeriod 最近一次更新的时间。
  optional google.protobuf.Timestamp updated_at = 201;
}

// 一条不可变 Provider Subscription 状态事实。
message ProviderSubscriptionEvent {
  // id 标识关联的 ProviderSubscriptionEvent。
  optional uint64 id = 1;
  // provider_subscription_record_id 标识关联的 ProviderSubscriptionRecord。
  optional uint64 provider_subscription_record_id = 3;
  // provider 标识本次能力使用的外部 Provider。
  optional PaymentProvider provider = 4;
  // provider_event_id 标识关联的 ProviderEvent。
  optional string provider_event_id = 5;
  // event_type 区分 ProviderSubscriptionEvent 的业务类型。
  optional string event_type = 6;
  // normalized_status 表示 ProviderSubscriptionEvent 当前可观察的生命周期状态。
  optional ProviderSubscriptionStatus normalized_status = 7;
  // occurred_at 记录 ProviderSubscriptionEvent 对应业务阶段的时间点。
  optional google.protobuf.Timestamp occurred_at = 8;
  // period_started_at 指定 ProviderSubscriptionEvent 生效或查询区间的起始时间。
  optional google.protobuf.Timestamp period_started_at = 9;
  // period_expired_at 指定 ProviderSubscriptionEvent 失效的时间点。
  optional google.protobuf.Timestamp period_expired_at = 10;
  // auto_renew_enabled 显式表示 ProviderSubscriptionEvent 是否满足该条件。
  optional bool auto_renew_enabled = 11;
