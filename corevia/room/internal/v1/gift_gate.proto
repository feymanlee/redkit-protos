syntax = "proto3";

package room.internal.v1;

import "google/api/field_behavior.proto";
import "room/v1/types.proto";
import "validate/validate.proto";

// RoomGiftGateService 是 Room 向 Gift / 受信任 BFF 暴露的窄房内送礼门闸。
// Room 只判定「目标是否为在场 Session Gift Target」；Gift Send、价格、分成与 Settlement 仍归 Gift。
service RoomGiftGateService {
  // ValidateSessionGiftTarget 校验房内送礼目标，不创建 Gift Send。
  rpc ValidateSessionGiftTarget(ValidateSessionGiftTargetRequest) returns (ValidateSessionGiftTargetResponse) {}
  // PublishSessionSystemNotice 经三方直播群下发场次系统提示（上麦/送礼/进出等）；不写 Room 消息账本。
  rpc PublishSessionSystemNotice(PublishSessionSystemNoticeRequest) returns (PublishSessionSystemNoticeResponse) {}
}

// ValidateSessionGiftTargetRequest 校验某 User 能否作为本场 Gift Recipient。
message ValidateSessionGiftTargetRequest {
  // session_id 是 Gift Scene ID 对应的 Room Session 稳定身份。
  uint64 session_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // sender_user_id 是送礼 User。
  uint64 sender_user_id = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // target_user_id 是房内送礼目标。
  uint64 target_user_id = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
}

// ValidateSessionGiftTargetResponse 返回门闸结论。
message ValidateSessionGiftTargetResponse {
  // eligible 表示目标可否作为 Recipient。
  bool eligible = 1;
  // reason 在 ineligible 时给出稳定原因分类，例如 NOT_PRESENT、SELF_SEND、RESTRICTED。
  string reason = 2;
  // target_seat_index 目标若在麦上则返回麦位，便于特效锚定；可空。
  optional uint32 target_seat_index = 3;
}

// PublishSessionSystemNoticeRequest 请求向直播群发送系统提示。
message PublishSessionSystemNoticeRequest {
  // session_id 标识场次。
  uint64 session_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // notice_type 是稳定提示类型，例如 MEMBER_JOINED、SEAT_CHANGED、GIFT_SENT。
  string notice_type = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 64}];
  // payload_json 是结构化提示负载，Room 不解析业务语义之外的扩展字段。
  string payload_json = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 4000}];
  // operation_no 为审计与幂等重放稳定标识本次系统提示。
  string operation_no = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// PublishSessionSystemNoticeResponse 返回投递意图结果；失败可重试，不反向改写 Room 状态。
message PublishSessionSystemNoticeResponse {
  // accepted 表示同步指令已受理。
  bool accepted = 1;
  // live_group_id 是目标直播群绑定标识。
  string live_group_id = 2;
  // safe_error 在未受理时给出可诊断信息。
  string safe_error = 3;
}
