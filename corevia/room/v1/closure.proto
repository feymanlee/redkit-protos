syntax = "proto3";

package room.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

// RoomClosureService 暴露 User Deletion 使用的窄 Room participant 契约。
// 阻断条件：名下存在未终局房间（仍为 Owner 且房间可开场），或占用进行中场次（含麦位）。
// Room 不自动解散房间，也不拥有 Gift/Wallet Settlement。
service RoomClosureService {
  // PrepareClosure 建立 Room fence，并报告房主未终局房间与进行中场次占用阻断。
  rpc PrepareClosure(PrepareClosureRequest) returns (RoomClosureParticipantState) {}
  // ApplyClosure 在同一 fence 下重新检查 readiness。
  rpc ApplyClosure(ApplyClosureRequest) returns (RoomClosureParticipantState) {}
  // CancelClosure 仅撤销 Apply 前建立的可逆 fence。
  rpc CancelClosure(CancelClosureRequest) returns (RoomClosureParticipantState) {}
  // GetClosureStatus 返回持久化 participant 状态。
  rpc GetClosureStatus(GetClosureStatusRequest) returns (RoomClosureParticipantState) {}
}

// PrepareClosureRequest 定义执行 PrepareClosure 的命令参数。
message PrepareClosureRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // closure_no 是 PrepareClosure 对外关联与审计使用的业务编号。
  string closure_no = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// ApplyClosureRequest 定义应用 Closure 的命令参数。
message ApplyClosureRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // closure_no 是 ApplyClosure 对外关联与审计使用的业务编号。
  string closure_no = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// CancelClosureRequest 定义取消 Closure 的命令参数。
message CancelClosureRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // closure_no 是 CancelClosure 对外关联与审计使用的业务编号。
  string closure_no = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// GetClosureStatusRequest 标识待查询的 ClosureStatus。
message GetClosureStatusRequest {
  // user_id 标识关联的 User。
  uint64 user_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // closure_no 是 GetClosureStatus 对外关联与审计使用的业务编号。
  string closure_no = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// RoomClosureParticipantStatus 刻画 Room 侧 Closure 生命周期状态。
enum RoomClosureParticipantStatus {
  // 未提供有效取值；调用方不得据此推断业务状态。
  ROOM_CLOSURE_PARTICIPANT_STATUS_UNSPECIFIED = 0;
  // 正在处理中，尚未形成终态。
  ROOM_CLOSURE_PARTICIPANT_STATUS_PREPARING = 1;
  // 处理被阻塞，需要外部处置后才能继续。
  ROOM_CLOSURE_PARTICIPANT_STATUS_BLOCKED = 2;
  // 关闭流程正在执行，尚未形成关闭终态。
  ROOM_CLOSURE_PARTICIPANT_STATUS_CLOSING = 3;
  // 处理已成功完成。
  ROOM_CLOSURE_PARTICIPANT_STATUS_SUCCEEDED = 4;
  // 处理被阻塞，需要外部处置后才能继续。
  ROOM_CLOSURE_PARTICIPANT_STATUS_STALLED = 5;
  // 处理已取消，不再继续推进。
  ROOM_CLOSURE_PARTICIPANT_STATUS_CANCELED = 6;
}

// RoomClosureBlocker 描述阻止 Room 完成 User Deletion 的条件。
message RoomClosureBlocker {
  // category 指定稳定业务分类，例如 OWNED_ROOM、SESSION_OCCUPANCY。
  string category = 1;
  // count 记录符合对应条件的数量。
  uint32 count = 2;
  // owning_reference 记录关联房间或场次引用标识。
  string owning_reference = 3;
}

// RoomClosureParticipantState 表示 Room 对 User Deletion 的当前处理状态。
message RoomClosureParticipantState {
  // user_id 标识关联的 User。
  uint64 user_id = 2;
  // closure_no 是对外关联与审计使用的业务编号。
  string closure_no = 3;
  // status 表示当前可观察的生命周期状态。
  RoomClosureParticipantStatus status = 4;
  // attempt 记录当前流程已经执行的尝试次数。
  uint32 attempt = 5;
  // blocker_count 记录阻断条件数量。
  uint32 blocker_count = 6;
  // blockers 列出阻断条件。
  repeated RoomClosureBlocker blockers = 7;
  // failure_category 对失败进行稳定分类，供调用方决定重试或终止。
  string failure_category = 8;
  // safe_error 记录最近一次可诊断的失败信息。
  string safe_error = 9;
  // owning_reference 记录外部系统或关联流程提供的引用标识。
  string owning_reference = 10;
  // lease_until 指定查询或生效区间的结束边界。
  google.protobuf.Timestamp lease_until = 11;
  // updated_at 记录最近一次更新的时间。
  google.protobuf.Timestamp updated_at = 12;
  // completed_at 记录对应业务阶段的时间点。
  google.protobuf.Timestamp completed_at = 13;
}
