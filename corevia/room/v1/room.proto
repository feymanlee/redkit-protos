syntax = "proto3";

package room.v1;

import "common/file/v1/file.proto";
import "common/pagination/v1/pagination.proto";
import "common/v1/common.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "room/v1/types.proto";
import "validate/validate.proto";

// Room 是 App 内可被进入、开场的稳定业务空间身份。
message Room {
  // id 标识房间稳定身份。
  uint64 id = 1;
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 2;
  // owner_user_id 是房主 User。
  uint64 owner_user_id = 3;
  // room_type 是房间稳定类型，不随场次变更。
  RoomType room_type = 4;
  // visibility 决定发现与进入方式。
  RoomVisibility visibility = 5;
  // status 是房间可用性。
  RoomStatus status = 6;
  // name 是房间名称。
  string name = 7;
  // description 是房间简介。
  string description = 8;
  // cover_file_id 是封面 File 引用；Room 不拥有 File 生命周期。
  uint64 cover_file_id = 9;
  // cover 是封面安全展示对象。
  common.file.v1.FileView cover = 10;
  // seat_count 是类型能力位：CHAT/GAMING/KTV 麦位池大小；SHOW 期忽略。
  uint32 seat_count = 11;
  // audience_limit 是本场听众上限。
  uint32 audience_limit = 12;
  // active_session_id 是进行中场次；无场次时为空。
  optional uint64 active_session_id = 13;
  // created_at 是房间创建时间。
  google.protobuf.Timestamp created_at = 200;
  // updated_at 是房间最近更新时间。
  google.protobuf.Timestamp updated_at = 201;
}

// RoomFilter 是后台/列表查询的有界 typed 条件。
message RoomFilter {
  // exact room identity
  optional uint64 room_id = 1;
  // exact owner User identity
  optional uint64 owner_user_id = 2;
  // room types
  repeated RoomType room_types = 3;
  // visibilities
  repeated RoomVisibility visibilities = 4;
  // statuses
  repeated RoomStatus statuses = 5;
  // name keyword，服务端做转义后的包含匹配
  optional string name_keyword = 6;
}

// ListRoomsResponse 是房间列表响应。
message ListRoomsResponse {
  // items 是房间列表。
  repeated Room items = 1;
  // total 是匹配总数。
  uint64 total = 2;
}

// CreateRoomRequest 定义创建房间的命令参数。
message CreateRoomRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // owner_user_id 是房主 User；一期任意 ACTIVE User 可建房。
  uint64 owner_user_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // room_type 一期仅接受 ROOM_TYPE_CHAT。
  RoomType room_type = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // visibility 是发现与进入方式。
  RoomVisibility visibility = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // name 是房间名称。
  string name = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 60}];
  // description 是房间简介。
  optional string description = 6 [(validate.rules).string.max_len = 500];
  // cover_file_id 是封面 File 引用。
  optional uint64 cover_file_id = 7 [(validate.rules).uint64.gt = 0];
  // seat_count 为空时使用 App 默认（CHAT 默认 8）。
  optional uint32 seat_count = 8 [(validate.rules).uint32 = {gte: 1, lte: 20}];
  // audience_limit 为空时使用 App 默认（CHAT 默认 50）。
  optional uint32 audience_limit = 9 [(validate.rules).uint32 = {gte: 1, lte: 1000}];
  // idempotency_key 在约定作用域内稳定标识同一业务意图，重试时必须复用。
  string idempotency_key = 10 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// UpdateRoomRequest 定义更新房间资料的命令参数；不改 owner 与 room_type。
message UpdateRoomRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // room_id 标识房间。
  uint64 room_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // operator_user_id 是发起更新的房主。
  uint64 operator_user_id = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // name 是房间名称。
  optional string name = 4 [(validate.rules).string = {min_len: 1, max_len: 60}];
  // description 是房间简介。
  optional string description = 5 [(validate.rules).string.max_len = 500];
  // cover_file_id 是封面 File 引用。
  optional uint64 cover_file_id = 6 [(validate.rules).uint64.gt = 0];
  // visibility 是发现与进入方式。
  optional RoomVisibility visibility = 7 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
  // seat_count 变更仅对未开场或后续场次生效，由实现决定是否允许改进行中场次。
  optional uint32 seat_count = 8 [(validate.rules).uint32 = {gte: 1, lte: 20}];
  // audience_limit 变更仅对后续进场生效。
  optional uint32 audience_limit = 9 [(validate.rules).uint32 = {gte: 1, lte: 1000}];
}

// GetRoomRequest 标识待查询的房间。
message GetRoomRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // room_id 标识房间。
  uint64 room_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
}

// ListRoomsRequest 定义房间筛选与分页参数。
message ListRoomsRequest {
  // filter 限定本次查询条件。
  RoomFilter filter = 1;
  // paging 指定分页。
  common.pagination.v1.PagingRequest paging = 2;
}

// ListMyRoomsRequest 查询某 User 拥有的房间。
message ListMyRoomsRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // owner_user_id 是房主。
  uint64 owner_user_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // paging 指定分页。
  common.pagination.v1.PagingRequest paging = 3;
}

// AppointModeratorRequest 任命房管。
message AppointModeratorRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // room_id 标识房间。
  uint64 room_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // actor_user_id 是房主。
  uint64 actor_user_id = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // moderator_user_id 被任命为房管。
  uint64 moderator_user_id = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
}

// RemoveModeratorRequest 撤销房管。
message RemoveModeratorRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // room_id 标识房间。
  uint64 room_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // actor_user_id 是房主。
  uint64 actor_user_id = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // moderator_user_id 被撤销房管。
  uint64 moderator_user_id = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
}

// CreateRoomRestrictionRequest 创建房间级或场次级处置。
message CreateRoomRestrictionRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // room_id 标识房间。
  uint64 room_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // session_id 在 scope=SESSION 时必填。
  optional uint64 session_id = 3 [(validate.rules).uint64.gt = 0];
  // target_user_id 是被处置 User。
  uint64 target_user_id = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // scope 是处置作用域。
  RestrictionScope scope = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // kind 是处置种类。
  RestrictionKind kind = 6 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // actor_type 标识发起方类型。
  RestrictionActorType actor_type = 7 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // actor_id 是 Operator ID 或 User ID。
  uint64 actor_id = 8 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // reason 记录处置原因，供审计。
  string reason = 9 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 1000}];
  // expires_at 仅房间级限时处置使用。
  optional google.protobuf.Timestamp expires_at = 10;
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 11 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// RevokeRoomRequest 撤销仍生效的房间处置。
message RevokeRoomRestrictionRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // restriction_id 标识处置。
  uint64 restriction_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // actor_type 标识发起方类型。
  RestrictionActorType actor_type = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // actor_id 是 Operator ID 或 User ID。
  uint64 actor_id = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // reason 记录撤销原因，供审计。
  string reason = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 1000}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 6 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// ListRoomRestrictionsRequest 查询房间处置。
message ListRoomRestrictionsRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // room_id 标识房间。
  uint64 room_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // only_active 为 true 时仅返回仍生效处置。
  optional bool only_active = 3;
  // paging 指定分页。
  common.pagination.v1.PagingRequest paging = 4;
}

// ListRoomRestrictionsResponse 是处置列表响应。
message ListRoomRestrictionsResponse {
  // items 是处置列表。
  repeated RoomRestriction items = 1;
  // total 是匹配总数。
  uint64 total = 2;
}

// TakeDownRoomRequest 是 Operator 下架房间命令。
message TakeDownRoomRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // room_id 标识房间。
  uint64 room_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // operator_id 是平台 Operator。
  uint64 operator_id = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // reason 记录原因，供审计。
  string reason = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 1000}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// RestoreRoomRequest 是 Operator 恢复房间命令。
message RestoreRoomRequest {
  // app_id 限定所属 App；UNSPECIFIED 不表示跨 App。
  common.v1.AppId app_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).enum = {defined_only: true, not_in: [0]}];
  // room_id 标识房间。
  uint64 room_id = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // operator_id 是平台 Operator。
  uint64 operator_id = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).uint64.gt = 0];
  // reason 记录原因，供审计。
  string reason = 4 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 1000}];
  // operation_no 为审计与幂等重放稳定标识本次管理操作。
  string operation_no = 5 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 1, max_len: 128}];
}

// RoomService 拥有房间稳定身份、房管任命与房间处置。
service RoomService {
  // CreateRoom 创建房间稳定身份。
  rpc CreateRoom(CreateRoomRequest) returns (Room) {}
  // UpdateRoom 更新房间资料与能力位。
  rpc UpdateRoom(UpdateRoomRequest) returns (Room) {}
  // GetRoom 查询房间。
  rpc GetRoom(GetRoomRequest) returns (Room) {}
  // ListRooms 按筛选查询房间。
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse) {}
  // ListMyRooms 查询房主名下房间。
  rpc ListMyRooms(ListMyRoomsRequest) returns (ListRoomsResponse) {}
  // TakeDownRoom Operator 下架房间，阻止再开场。
  rpc TakeDownRoom(TakeDownRoomRequest) returns (Room) {}
  // RestoreRoom Operator 恢复已下架房间。
  rpc RestoreRoom(RestoreRoomRequest) returns (Room) {}
  // AppointModerator 任命房管。
  rpc AppointModerator(AppointModeratorRequest) returns (Room) {}
  // RemoveModerator 撤销房管。
  rpc RemoveModerator(RemoveModeratorRequest) returns (Room) {}
  // CreateRoomRestriction 创建场次/房间处置，并驱动直播群与 RTC 同步指令。
  rpc CreateRoomRestriction(CreateRoomRestrictionRequest) returns (RoomRestriction) {}
  // RevokeRoomRestriction 撤销处置。
  rpc RevokeRoomRestriction(RevokeRoomRestrictionRequest) returns (RoomRestriction) {}
  // ListRoomRestrictions 查询处置。
  rpc ListRoomRestrictions(ListRoomRestrictionsRequest) returns (ListRoomRestrictionsResponse) {}
}
